<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      *,*::before,*::after { box-sizing: border-box }
      body { padding: 0; margin: 0 }
      p { margin: 0 }
    </style>
  </head>
  <body>
    <div
      style="width: 1440px; height: 820px; background: linear-gradient(0deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.2) 100%), linear-gradient(0deg, #FFFFFF 0%, #FFFFFF 100%); overflow: hidden; position: relative">
      <div
        style="width: 480px; height: 134px; display: flex; flex: none; justify-content: flex-start; align-items: center; flex-direction: column; background: #FFFFFF; border-radius: 8px; position: absolute; left: calc(100% - 1440px + 480px); top: calc(100% - 820px + 343px); z-index: 0; overflow: hidden; border: 1px solid #F6F6F7">
        <div
          style="display: flex; align-self: stretch; justify-content: flex-start; align-items: center; gap: var(--space-2); background: #FFFFFF; overflow: hidden; padding: 12px 20px">
          <img
            src="./asset/icons/svg_075de527.svg"
            style="width: 24px; height: 24px" />
          <p
            style="flex: 1; flex-shrink: 0; color: #000000; font-size: 16px; font-family: PingFang SC; font-weight: 600; line-height: 24px">
            确定删除该科目吗？
          </p>
          <div
            style="display: flex; flex-shrink: 0; justify-content: center; align-items: center; padding: 8px; border-radius: 4px">
            <div
              style="display: flex; justify-content: center; align-items: center">
              <img
                src="./asset/icons/svg_233b9b60.svg"
                style="width: 16px; height: 16px" />
            </div>
          </div>
        </div>
        <div
          style="display: flex; align-self: stretch; justify-content: flex-start; align-items: flex-start; flex-direction: column; gap: var(--space-5); padding-right: 20px; padding-left: 20px">
          <p
            style="align-self: stretch; flex-shrink: 0; color: #505266; font-size: 14px; font-family: PingFang SC; line-height: 22px">
            “政治科目”删除后不可恢复
          </p>
        </div>
        <div
          style="display: flex; align-self: stretch; justify-content: flex-end; align-items: center; gap: var(--space-2); background: #FFFFFF; overflow: hidden; padding: 12px 20px">
          <div
            style="display: flex; flex: 1; flex-shrink: 0; justify-content: flex-start; align-items: center; gap: var(--space-2)"></div>
          <div
            style="display: flex; flex-shrink: 0; justify-content: flex-start; align-items: flex-start; gap: var(--space-2)">
            <div
              style="display: flex; justify-content: center; align-items: center; gap: var(--space-1); background: #FFFFFF; border-radius: 4px; padding: 5px 16px; border: 1px solid #DCDCE0">
              <span
                style="color: #000000; font-size: 14px; font-family: PingFang SC; line-height: 22px">
                取消
              </span>
            </div>
            <div
              style="display: flex; justify-content: center; align-items: center; gap: var(--space-1); background: #FA5151; border-radius: 4px; padding: 5px 16px">
              <span
                style="color: #FFFFFF; font-size: 14px; font-family: PingFang SC; line-height: 22px">
                确定
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
