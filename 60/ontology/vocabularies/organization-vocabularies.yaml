ontology: szpu-hr
version: 0.3.0
domain: organization
title: 组织机构领域词表

vocabularies:
  - id: OrganizationCategory
    label: 组织大类
    definition: 学校一级组织分类，用于顶层机构分组
    authority: system-confirmed
    source: T_RS_ZXBZ_DWLB
    concepts:
      - code: "1"
        label: 深圳职业技术大学
        level: 1
        parentCode: null
        inUse: true
        sortOrder: 1
      - code: "100"
        label: 党政教辅机构
        level: 2
        parentCode: "1"
        inUse: true
        sortOrder: 2
      - code: "300"
        label: 教学单位
        level: 2
        parentCode: "1"
        inUse: true
        sortOrder: 3
      - code: "400"
        label: 产学研单位
        level: 2
        parentCode: "1"
        inUse: true
        sortOrder: 4
      - code: "900"
        label: 后勤服务企业
        level: 2
        parentCode: "1"
        inUse: true
        sortOrder: 5
      - code: "999"
        label: 其他
        level: 2
        parentCode: "1"
        inUse: true
        sortOrder: 6

  - id: OrganizationLevel
    label: 组织级别
    definition: 组织在学校治理层级中的位置
    confirmation: required
    concepts:
      - code: "1"
        label: 校级
        description: 学校层面
      - code: "2"
        label: 院级/部门级
        description: 二级学院、职能部门
      - code: "3"
        label: 专业群/科室级
        description: 专业群、科室、中心
      - code: "4"
        label: 专业/小组级
        description: 专业、工作小组

  - id: OrganizationStatus
    label: 组织状态
    definition: 组织当前生命周期状态
    concepts:
      - code: active
        label: 在用
        description: 组织正常运作中
      - code: suspended
        label: 暂停
        description: 临时停止运作但未撤销
      - code: abolished
        label: 已撤销
        description: 正式撤销，历史留存

mappingRules:
  - sourceTable: T_RS_JGGL_XZJG
    targetEntity: Organization
    fieldMappings:
      - sourceField: ID
        targetAttribute: organizationId
        transform: prefix with "org-"
      - sourceField: DM
        targetAttribute: organizationCode
      - sourceField: MC
        targetAttribute: name
      - sourceField: YWMC
        targetAttribute: nameEn
      - sourceField: JC
        targetAttribute: shortName
      - sourceField: CC
        targetAttribute: level
        vocabulary: OrganizationLevel
      - sourceField: LS
        targetAttribute: parentOrganizationCode
        note: 需通过代码反查 parentOrganizationId
      - sourceField: LB
        targetAttribute: organizationCategory
        vocabulary: OrganizationCategory
        note: 映射到组织大类代码
      - sourceField: JB
        targetAttribute: organizationLevel
        vocabulary: OrganizationLevel
      - sourceField: CLRQ
        targetAttribute: establishedDate
      - sourceField: CLWH
        targetAttribute: establishmentDocument
      - sourceField: CXRQ
        targetAttribute: abolishedDate
      - sourceField: CXWH
        targetAttribute: abolishmentDocument
      - sourceField: DWZZ
        targetAttribute: responsibilities
      - sourceField: SFQY
        targetAttribute: isActive
        transform: "'1' -> true, '0' -> false"
      - sourceField: PX
        targetAttribute: sortOrder
      - sourceField: SFGK
        targetAttribute: isAffiliated
        transform: "'1' -> true, '0' -> false"
      - sourceField: GKGX
        targetAttribute: affiliatedToCode
        note: 挂靠关系，指向另一组织代码

  - sourceTable: T_RS_ZXBZ_DW
    targetEntity: Organization
    note: 与 T_RS_JGGL_XZJG 字段高度重叠，需明确两表使用边界
    fieldMappings:
      - sourceField: DM
        targetAttribute: organizationCode
      - sourceField: MC
        targetAttribute: name
      - sourceField: MC_EN
        targetAttribute: nameEn
      - sourceField: JC
        targetAttribute: shortName
      - sourceField: CC
        targetAttribute: level
      - sourceField: LS
        targetAttribute: parentOrganizationCode
      - sourceField: LBDM
        targetAttribute: organizationCategory
        vocabulary: OrganizationCategory
      - sourceField: SFSY
        targetAttribute: isActive
        transform: "'1' -> true, '0' -> false"
      - sourceField: BZLY
        targetAttribute: dataSource
        note: 标准来源，用于溯源

notes:
  - T_RS_JGGL_XZJG 和 T_RS_ZXBZ_DW 记录数完全一致（355条），需业务确认两表区别和使用场景
  - 组织层级通过 CC（层次）表达，通过 LS（隶属）字段建立父子关系
  - 组织编码采用层级编码规则，如 319012 表示 319 下的第 12 个子单位
  - 部分组织缺少成立日期和撤销日期，需补充完善生命周期管理
  - 组织类别代码体系：1xx=党政教辅、3xx=教学单位、4xx=产学研、9xx=后勤及其他
  - 挂靠关系（GKGX/SFGK）用于表达双重领导或业务归属，需在本体关系中建模
