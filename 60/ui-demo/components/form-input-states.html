<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>表单录入状态</title>
  <link rel="stylesheet" href="../packages/design-system/src/base.css" />
  <link rel="stylesheet" href="../packages/design-system/src/AppShell/app-shell.css" />
  <style>
    /* === 页面外壳 === */
    .fis-page {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      background: #fff;
    }

    .fis-stage {
      flex: 1;
      min-height: 0;
      padding: 24px;
      overflow: auto;
      background: #fff;
    }

    /* === 设计稿 693px 容器 === */
    .fis-content {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 693px;
    }

    .fis-title {
      color: #000000;
      font-size: 14px;
      font-weight: 600;
      line-height: 22px;
      font-family: 'PingFang SC', var(--ds-font-family);
    }

    /* === 状态列表 === */
    .fis-rows {
      display: grid;
      grid-template-columns: 133px 560px;
      row-gap: 20px;
      column-gap: 0;
    }

    .fis-state {
      align-self: start;
      padding-top: 5px;
      color: #505266;
      font-size: 14px;
      line-height: 22px;
      font-family: 'PingFang SC', var(--ds-font-family);
    }

    /* === 表单字段块（560px） === */
    .fis-field {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .fis-field-label {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      width: 94px;
      height: 32px;
      color: #505266;
      font-size: 14px;
      line-height: 20px;
      text-align: right;
      font-family: 'PingFang SC', var(--ds-font-family);
    }

    .fis-help-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      padding: 2px;
      color: #9697A3;
      cursor: help;
    }

    .fis-help-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .fis-field-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* === 输入控件 === */
    .fis-input {
      box-sizing: border-box;
      width: 100%;
      height: 32px;
      padding: 5px 12px;
      color: #1f2329;
      font-size: 14px;
      line-height: 22px;
      font-family: 'PingFang SC', var(--ds-font-family);
      background: #FFFFFF;
      border: 1px solid #DCDCE0;
      border-radius: 4px;
      outline: none;
      transition: border-color 160ms cubic-bezier(0.2, 0, 0, 1),
                  box-shadow 160ms cubic-bezier(0.2, 0, 0, 1);
    }

    .fis-input::placeholder {
      color: #9697A3;
    }

    /* 强制态：用于静态展示 */
    .fis-input.is-hover {
      border-color: #B8C3FF;
    }

    .fis-input.is-focused {
      border-color: #303FFF;
      box-shadow: 0 0 0 2px rgba(48, 63, 255, 0.12);
    }

    .fis-input:disabled {
      color: #C9CDD4;
      background: #F2F3F5;
      border-color: #E5E6EB;
      cursor: not-allowed;
    }

    .fis-input:disabled::placeholder {
      color: #C9CDD4;
    }

    .fis-input[readonly] {
      background: #F7F8FA;
      border-color: #EDF0F5;
      cursor: default;
    }

    .fis-input.is-error {
      border-color: #FA5151;
    }

    .fis-input.is-error.is-focused {
      box-shadow: 0 0 0 2px rgba(250, 81, 81, 0.12);
    }

    /* === 描述 / 报错文案 === */
    .fis-msg {
      color: #737585;
      font-size: 12px;
      line-height: 20px;
      font-family: 'PingFang SC', var(--ds-font-family);
    }

    .fis-msg.is-error {
      color: #FA5151;
    }
  </style>
</head>
<body>
<div class="frame2-stage ds-scope">
  <main class="fis-page">
    <section class="fis-stage">
      <div class="fis-content">
        <span class="fis-title">状态</span>

        <div class="fis-rows">
          <!-- 默认态 -->
          <div class="fis-state">默认态</div>
          <div class="fis-field">
            <span class="fis-field-label">标题名称</span>
            <div class="fis-field-body">
              <input class="fis-input" type="text" placeholder="请输入" />
            </div>
          </div>

          <!-- 悬浮 -->
          <div class="fis-state">悬浮</div>
          <div class="fis-field">
            <span class="fis-field-label">标题名称</span>
            <div class="fis-field-body">
              <input class="fis-input is-hover" type="text" placeholder="请输入" />
            </div>
          </div>

          <!-- 点击 -->
          <div class="fis-state">点击</div>
          <div class="fis-field">
            <span class="fis-field-label">标题名称</span>
            <div class="fis-field-body">
              <input class="fis-input is-focused" type="text" placeholder="请输入" />
            </div>
          </div>

          <!-- 禁用 -->
          <div class="fis-state">禁用</div>
          <div class="fis-field">
            <span class="fis-field-label">标题名称</span>
            <div class="fis-field-body">
              <input class="fis-input" type="text" placeholder="请输入" disabled />
            </div>
          </div>

          <!-- 只读 -->
          <div class="fis-state">只读</div>
          <div class="fis-field">
            <span class="fis-field-label">标题名称</span>
            <div class="fis-field-body">
              <input class="fis-input" type="text" placeholder="请输入" readonly />
            </div>
          </div>

          <!-- 报错 -->
          <div class="fis-state">报错</div>
          <div class="fis-field">
            <span class="fis-field-label">标题名称</span>
            <div class="fis-field-body">
              <input class="fis-input is-error" type="text" placeholder="请输入" />
              <span class="fis-msg is-error">报错</span>
            </div>
          </div>

          <!-- 描述信息·字段名图标 -->
          <div class="fis-state">描述信息<br />字段名图标</div>
          <div class="fis-field">
            <span class="fis-field-label">
              标题名称
              <span class="fis-help-icon" aria-label="字段说明" title="字段说明">
                <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1" />
                  <path d="M6.2 6.2c0-1 .8-1.7 1.8-1.7s1.8.7 1.8 1.6c0 .7-.4 1.1-1 1.4-.6.4-.8.6-.8 1.2v.2" stroke="currentColor" stroke-width="1" stroke-linecap="round" />
                  <circle cx="8" cy="11" r="0.7" fill="currentColor" />
                </svg>
              </span>
            </span>
            <div class="fis-field-body">
              <input class="fis-input" type="text" placeholder="请输入" />
            </div>
          </div>

          <!-- 描述信息·字段值下方 -->
          <div class="fis-state">描述信息<br />字段值下方</div>
          <div class="fis-field">
            <span class="fis-field-label">标题名称</span>
            <div class="fis-field-body">
              <input class="fis-input" type="text" placeholder="请输入" />
              <span class="fis-msg">描述信息</span>
            </div>
          </div>

          <!-- 报错+描述信息 -->
          <div class="fis-state">报错+描述信息</div>
          <div class="fis-field">
            <span class="fis-field-label">标题名称</span>
            <div class="fis-field-body">
              <input class="fis-input is-error" type="text" placeholder="请输入" />
              <span class="fis-msg">描述信息</span>
              <span class="fis-msg is-error">报错</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="../assets/icon-registry.js"></script>
<script src="../packages/design-system/src/AppShellV2/app-shell-v2.js?v=2.2.4"></script>
<script src="../framework/framework-2.staff-preset.js?v=2.2.3"></script>
<script src="../framework/framework-2.js?v=2.2.3"></script>
<script src="../framework/legacy-app-shell-adapter.js?v=2.2.3"></script>
<script>
  WiseAppShell.init({
    activeModule: 'doctor',
    secondaryNav: {
      title: '组件库',
      status: ['进行', 6],
      items: ['功能索引', '当前组件', 'Ant目录', '组件总览', '表单', '表格', '框架'],
      foot: '设计规范'
    },

        '组件总览': './ant-components-page.html',
        '表单': './form-components-page.html',

        '框架': '../framework/framework-index.html'
      };
      window.location.href = routes[feature] || './component-library-index.html';
    }
  });
</script>
</body>
</html>
