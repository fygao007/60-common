<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>通知消息 - 框架2</title>
<link rel="stylesheet" href="../../../../packages/design-system/src/base.css" />
<link rel="stylesheet" href="../../../../framework/theme.css" />
<style>
body { margin: 0; }

.app-page-frame {
  --ap-blue: #3167FF;
  --ap-blue-weak: #EDF4FF;
  --ap-ink: #000000;
  --ap-text: #505266;
  --ap-muted: #737585;
  --ap-line: #EEEEF0;
  --ap-page: #F4F6FB;
  font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Microsoft YaHei", Arial, sans-serif;
}

.app-page { min-height: 100%; background: #F0F5FC; }

/* 菜单项红色角标 */
.nc-menu-badge {
  height: 16px;
  min-width: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  margin-left: auto;
  background: #FA5151;
  border-radius: 12px;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  flex: none;
}

/* ===== 业务内容容器 ===== */
.nc-page {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  min-height: 0;
}

.nc-panel {
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

/* ===== 筛选栏 ===== */
.nc-filter {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 12px 12px 12px;
  margin: 12px 16px 0;
  background: linear-gradient(180deg, #FAFAFC 0%, rgba(255, 255, 255, 0) 100%);
  border-radius: 8px;
  flex: none;
}

.nc-filter-field {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.nc-filter-field.grow { flex: 1; }

.nc-filter-label {
  flex: none;
  font-size: 14px;
  color: var(--ap-text);
  line-height: 20px;
  white-space: nowrap;
}

.nc-filter-control {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fff;
  border: 1px solid #DCDCE0;
  border-radius: 4px;
  padding: 4px 12px;
  height: 36px;
  flex: 1;
  min-width: 0;
  max-width: 560px;
  box-sizing: border-box;
}

.nc-filter-control input {
  border: none;
  outline: none;
  flex: 1;
  font-size: 14px;
  color: var(--ap-ink);
  background: transparent;
  min-width: 0;
  font-family: inherit;
}

.nc-filter-control input::placeholder { color: #9697A3; }

.nc-filter-select {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fff;
  border: 1px solid #DCDCE0;
  border-radius: 4px;
  padding: 4px 12px;
  height: 36px;
  flex: 1;
  min-width: 0;
  max-width: 360px;
  box-sizing: border-box;
  cursor: pointer;
  position: relative;
}

.nc-filter-select select {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}

.nc-filter-select .sel-text {
  flex: 1;
  font-size: 14px;
  color: var(--ap-ink);
  line-height: 22px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  pointer-events: none;
}

.nc-filter-select .sel-text.is-placeholder { color: #9697A3; }

.nc-filter-select svg {
  flex: none;
  width: 14px;
  height: 14px;
  pointer-events: none;
}

.nc-filter-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  margin-left: auto;
}

.nc-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  padding: 7px 18px;
  font-size: 14px;
  line-height: 22px;
  cursor: pointer;
  border: none;
  white-space: nowrap;
  font-family: inherit;
}

.nc-btn-reset { background: #fff; color: var(--ap-ink); border: 1px solid #DCDCE0; }
.nc-btn-reset:hover { background: #f5f5f5; }
.nc-btn-query { background: var(--ap-blue); color: #fff; }
.nc-btn-query:hover { background: #2558e8; }

/* ===== 表格 ===== */
.nc-table-wrap {
  flex: 1;
  overflow: auto;
  padding: 8px 16px 0;
}

.nc-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.nc-table th {
  text-align: left;
  font-size: 14px;
  font-weight: 600;
  color: var(--ap-ink);
  padding: 13px 12px;
  background: #F7F8FA;
  border-bottom: 1px solid var(--ap-line);
  white-space: nowrap;
}

.nc-table td {
  font-size: 14px;
  color: var(--ap-text);
  padding: 16px 12px;
  border-bottom: 1px solid var(--ap-line);
  vertical-align: middle;
}

.nc-table tbody tr:hover td { background: #FAFCFF; }

.nc-col-no { width: 60px; }
.nc-col-status { width: 120px; }
.nc-col-time { width: 200px; }
.nc-col-op { width: 90px; }

.nc-title-cell {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--ap-ink);
  overflow: hidden;
}

.nc-title-cell .name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nc-top-badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border-radius: 4px;
  font-size: 12px;
  line-height: 20px;
  color: var(--ap-blue);
  background: linear-gradient(90deg, #EDF4FF 0%, #F2EDFF 100%);
}

.nc-status.read { color: #9697A3; }
.nc-status.unread { color: var(--ap-ink); }

.nc-op-link {
  color: var(--ap-blue);
  font-size: 14px;
  text-decoration: none;
  cursor: pointer;
}
.nc-op-link:hover { text-decoration: underline; }

.nc-empty {
  padding: 60px 20px;
  text-align: center;
  color: #9697A3;
  font-size: 14px;
}

/* ===== 分页 ===== */
.nc-pagination {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px;
  background: #fff;
  border-top: 1px solid var(--ap-line);
  flex: none;
}

.nc-page-info { font-size: 12px; color: var(--ap-text); line-height: 20px; }

.nc-page-size-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  background: #fff;
  border: 1px solid #DCDCE0;
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 12px;
  color: var(--ap-ink);
  cursor: pointer;
  line-height: 20px;
}
.nc-page-size-wrap svg { width: 14px; height: 14px; }

.nc-page-btns { display: flex; align-items: center; gap: 2px; }

.nc-page-btn {
  min-width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  border-radius: 4px;
  font-size: 12px;
  color: var(--ap-text);
  cursor: pointer;
  border: none;
  background: none;
  font-family: inherit;
  line-height: 20px;
}
.nc-page-btn:hover { background: #F0F5FF; color: var(--ap-blue); }
.nc-page-btn.active { background: #EEEEF0; color: var(--ap-ink); font-weight: 600; }

.nc-page-icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 4px;
  cursor: pointer;
  border: none;
  background: none;
}
.nc-page-icon-btn:hover { background: #F0F5FF; }

.nc-page-jump {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--ap-ink);
  line-height: 20px;
}

.nc-page-jump input {
  width: 40px;
  border: 1px solid #DCDCE0;
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 12px;
  text-align: center;
  outline: none;
  background: #fff;
  font-family: inherit;
  color: var(--ap-ink);
}
.nc-page-jump input:focus { border-color: var(--ap-blue); }
</style>
</head>
<body>
<div class="frame2-stage ds-scope">

  <!-- 业务内容：框架会把它移入 frame2-content（左侧菜单 + 右侧页签由框架渲染） -->
  <div class="nc-page app-page-frame">
    <div class="nc-panel">

      <!-- 筛选栏 -->
      <div class="nc-filter">
        <div class="nc-filter-field grow">
          <span class="nc-filter-label" id="ncNameLabel">通知名称</span>
          <div class="nc-filter-control">
            <input type="text" id="ncKeyword" placeholder="请输入" />
          </div>
        </div>
        <div class="nc-filter-field grow">
          <span class="nc-filter-label">状态</span>
          <div class="nc-filter-select">
            <span class="sel-text is-placeholder" id="ncStatusText">请选择</span>
            <svg viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="#505266" stroke-width="1.2" stroke-linecap="round"/></svg>
            <select id="ncStatus" onchange="ncOnStatusChange(this)">
              <option value="">全部</option>
              <option value="unread">未读</option>
              <option value="read">已读</option>
            </select>
          </div>
        </div>
        <div class="nc-filter-actions">
          <button class="nc-btn nc-btn-reset" onclick="ncReset()">重置</button>
          <button class="nc-btn nc-btn-query" onclick="ncQuery()">查询</button>
        </div>
      </div>

      <!-- 表格 -->
      <div class="nc-table-wrap">
        <table class="nc-table">
          <thead>
            <tr>
              <th class="nc-col-no">序号</th>
              <th id="ncColTitle">通知名称</th>
              <th class="nc-col-status">状态</th>
              <th class="nc-col-time" id="ncColTime">发布时间</th>
              <th class="nc-col-op">操作</th>
            </tr>
          </thead>
          <tbody id="ncTbody"></tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="nc-pagination">
        <span class="nc-page-info" id="ncPageInfo">共 0 条</span>
        <div class="nc-page-size-wrap">
          <span>10条/页</span>
          <svg viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="#505266" stroke-width="1.2" stroke-linecap="round"/></svg>
        </div>
        <div class="nc-page-btns" id="ncPageBtns"></div>
        <div class="nc-page-jump">
          <span>跳至</span>
          <input type="text" value="1" />
          <span>页</span>
        </div>
      </div>

    </div>
  </div>

</div>

<script src="../../../../assets/icon-registry.js"></script>
<script src="../../../../packages/design-system/src/AppShellV2/app-shell-v2.js?v=2.2.4"></script>
<script src="../../../../framework/framework-2.staff-preset.js?v=2.2.3"></script>
<script src="../../../../framework/framework-2.js?v=2.2.3"></script>
<script>
window.framework2Instance = WiseFramework2.mount({
  activeApp: 'home', activeFeature: 'notice-center',
  versionLabel: '通知消息', userName: '金晓智', roleName: '教职工',
  homeHref: './staff-home.html',
  secondaryNav: {
    items: [
      { key: 'notice', label: '通知' },
      { key: 'message', label: '消息' }
    ]
  },
  tabs: [
    { key: 'notice-center', label: '通知', closable: true }
  ]
});
</script>
<script>
(function () {
  function getFrameworkShell() {
    return window.framework2Instance?.shell
      || document.querySelector('.frame2-stage')?.shadowRoot?.querySelector('[data-frame2-shell-root]')
      || document;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---- 数据 ---- */
  function makeNotices() {
    var rows = [];
    for (var i = 1; i <= 10; i++) {
      rows.push({
        no: i,
        title: '这里展示的是通知的标题',
        top: i === 1,
        status: (i === 1 || i >= 5 && i <= 7) ? 'read' : 'unread',
        time: '2026-01-01 08:00:00',
        detailUrl: '#'
      });
    }
    return rows;
  }

  function makeMessages() {
    var src = [
      '您的「年休假申请」已通过学院审批',
      '您有一条「职称评审」材料待补充',
      '系统将于本周六 22:00 进行例行维护',
      '您的「企业实践认定」被人事处退回',
      '您的「证明打印申请」已办结，可下载',
      '请及时完善本学期业绩数据登记'
    ];
    return src.map(function (t, idx) {
      return {
        no: idx + 1,
        title: t,
        top: false,
        status: idx < 1 ? 'unread' : 'read',
        time: '2026-01-01 08:00:00',
        detailUrl: '#'
      };
    });
  }

  var SECTIONS = {
    notice: {
      tabLabel: '通知',
      nameLabel: '通知名称',
      titleColLabel: '通知名称',
      timeColLabel: '发布时间',
      items: makeNotices()
    },
    message: {
      tabLabel: '消息',
      nameLabel: '消息名称',
      titleColLabel: '消息内容',
      timeColLabel: '接收时间',
      items: makeMessages()
    }
  };

  var STATUS_LABEL = { read: '已读', unread: '未读' };

  /* ---- 当前状态 ---- */
  // 支持从首页通过 ?type=notice|message 直达对应分区
  var initialSection = (function () {
    var m = /[?&]type=(notice|message)/.exec(window.location.search);
    return m ? m[1] : 'notice';
  })();
  var currentSection = initialSection;
  var filterKeyword = '';
  var filterStatus = '';

  var tbodyEl = document.getElementById('ncTbody');
  var pageInfoEl = document.getElementById('ncPageInfo');
  var pageBtnsEl = document.getElementById('ncPageBtns');

  function getFilteredItems() {
    return SECTIONS[currentSection].items.filter(function (it) {
      var kw = filterKeyword.trim().toLowerCase();
      if (kw && it.title.toLowerCase().indexOf(kw) === -1) return false;
      if (filterStatus && it.status !== filterStatus) return false;
      return true;
    });
  }

  function rowHtml(item) {
    var titleCell = '<div class="nc-title-cell">' +
      (item.top ? '<span class="nc-top-badge">置顶</span>' : '') +
      '<span class="name">' + esc(item.title) + '</span>' +
    '</div>';

    return '<tr>' +
      '<td class="nc-col-no">' + item.no + '</td>' +
      '<td>' + titleCell + '</td>' +
      '<td class="nc-col-status"><span class="nc-status ' + item.status + '">' + esc(STATUS_LABEL[item.status]) + '</span></td>' +
      '<td class="nc-col-time">' + esc(item.time) + '</td>' +
      '<td class="nc-col-op"><a class="nc-op-link" href="' + esc(item.detailUrl) + '">详情</a></td>' +
    '</tr>';
  }

  function renderTable() {
    var items = getFilteredItems();
    tbodyEl.innerHTML = items.length
      ? items.map(rowHtml).join('')
      : '<tr><td colspan="5"><div class="nc-empty">暂无相关数据</div></td></tr>';

    // 演示用固定总数与分页
    var total = currentSection === 'notice' ? 100 : items.length;
    pageInfoEl.textContent = '共 ' + total + ' 条';

    if (currentSection === 'notice') {
      pageBtnsEl.innerHTML =
        '<button class="nc-page-icon-btn" title="上一页"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7l4 4" stroke="#505266" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        '<button class="nc-page-btn active">1</button>' +
        '<button class="nc-page-btn">2</button>' +
        '<button class="nc-page-btn">…</button>' +
        '<button class="nc-page-btn">10</button>' +
        '<button class="nc-page-icon-btn" title="下一页"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="#505266" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
    } else {
      pageBtnsEl.innerHTML =
        '<button class="nc-page-icon-btn" title="上一页"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7l4 4" stroke="#505266" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        '<button class="nc-page-btn active">1</button>' +
        '<button class="nc-page-icon-btn" title="下一页"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="#505266" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
    }
  }

  function applySectionLabels() {
    var s = SECTIONS[currentSection];
    document.getElementById('ncNameLabel').textContent = s.nameLabel;
    document.getElementById('ncColTitle').textContent = s.titleColLabel;
    document.getElementById('ncColTime').textContent = s.timeColLabel;
  }

  // 更新框架业务页签标题，使其与当前分区一致
  function updateTabLabel(label) {
    var url = new URL(window.location.href);
    url.searchParams.set('type', currentSection);
    window.history.replaceState(null, '', url.href);
    if (window.framework2Instance?.updateActiveTab) {
      window.framework2Instance.updateActiveTab(label, url.href);
      return;
    }
    var tab = getFrameworkShell().querySelector('.frame2-tabs .frame2-tab[data-tab="notice-center"]');
    if (!tab) return;
    var span = tab.querySelector('span:not(.frame2-tab-icon):not(.frame2-tab-close)');
    if (span) span.textContent = label;
    tab.setAttribute('data-tab-label', label);
    tab.setAttribute('title', label);
  }

  function switchSection(section) {
    if (!SECTIONS[section]) return;
    currentSection = section;
    filterKeyword = '';
    filterStatus = '';
    document.getElementById('ncKeyword').value = '';
    var statusSel = document.getElementById('ncStatus');
    statusSel.value = '';
    var statusText = document.getElementById('ncStatusText');
    statusText.textContent = '请选择';
    statusText.classList.add('is-placeholder');

    applySectionLabels();
    renderTable();
    updateTabLabel(SECTIONS[section].tabLabel);

    getFrameworkShell().querySelectorAll('.frame2-menu .frame2-side-item').forEach(function (el) {
      el.classList.toggle('is-active', el.getAttribute('data-feature') === section);
    });
  }

  /* ---- 全局事件 ---- */
  window.ncOnStatusChange = function (sel) {
    filterStatus = sel.value;
    var opt = sel.options[sel.selectedIndex];
    var t = document.getElementById('ncStatusText');
    t.textContent = sel.value ? opt.text : '请选择';
    t.classList.toggle('is-placeholder', !sel.value);
  };

  window.ncReset = function () {
    filterKeyword = '';
    filterStatus = '';
    document.getElementById('ncKeyword').value = '';
    var sel = document.getElementById('ncStatus');
    sel.value = '';
    var t = document.getElementById('ncStatusText');
    t.textContent = '请选择';
    t.classList.add('is-placeholder');
    renderTable();
  };

  window.ncQuery = function () {
    filterKeyword = document.getElementById('ncKeyword').value;
    renderTable();
  };

  document.getElementById('ncKeyword').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') window.ncQuery();
  });

  /* ---- 接管框架左侧菜单点击 ---- */
  function bindSideMenu() {
    var menu = getFrameworkShell().querySelector('.frame2-menu');
    if (!menu) return false;
    menu.addEventListener('click', function (e) {
      var node = e.target.closest('[data-feature]');
      if (!node) return;
      var section = node.getAttribute('data-feature');
      if (!SECTIONS[section]) return;
      e.stopPropagation();
      e.preventDefault();
      switchSection(section);
    }, true);

    addBadge(menu, 'notice', '99+');
    addBadge(menu, 'message', '1');
    return true;
  }

  function addBadge(menu, key, text) {
    var item = menu.querySelector('[data-feature="' + key + '"]');
    if (item && !item.querySelector('.nc-menu-badge')) {
      var badge = document.createElement('span');
      badge.className = 'nc-menu-badge';
      badge.textContent = text;
      badge.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;margin-left:auto;padding:0 4px;color:#fff;background:#FA5151;border-radius:12px;font-size:12px;font-weight:600;line-height:1';
      item.appendChild(badge);
    }
  }

  /* ---- 初始化 ---- */
  applySectionLabels();
  renderTable();

  (function waitMenu(tries) {
    if (bindSideMenu()) {
      switchSection(initialSection);
    } else if (tries > 0) {
      setTimeout(function () { waitMenu(tries - 1); }, 50);
    }
  })(40);

})();
</script>
</body>
</html>
