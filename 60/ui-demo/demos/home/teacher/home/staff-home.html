<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>框架2 - 智慧人事一体化服务系统首页</title>
  <link rel="stylesheet" href="../../../../packages/design-system/src/base.css" />
  <link rel="stylesheet" href="../../../../framework/theme.css" />
  <style>
    body { margin: 0; }

    .portal-home-frame {
      --pf-blue: #2f6bff;
      --pf-blue-deep: #1d4fd8;
      --pf-ink: #1f2937;
      --pf-text: #4b5563;
      --pf-muted: #8a93a6;
      --pf-line: #edf1f7;
      --pf-page: #f4f7fb;
      --pf-card: #fff;
      --pf-orange: #ff7d35;
      --pf-red: #ff4d4f;
      width: 100%;
      min-width: 0;
      max-width: none;
      font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Microsoft YaHei", Arial, sans-serif;
    }

    .portal-home {
      height: 100%;
      overflow: auto;
      overflow-x: hidden;
      color: var(--pf-ink);
      background: transparent;
    }

    .portal-home button { font: inherit; cursor: pointer; }

    .portal-layout {
      display: grid;
      grid-template-columns: minmax(760px, 3.4fr) minmax(380px, 1.7fr);
      gap: 12px;
      width: 100%;
      min-width: 1304px;
      margin: 0 auto;
      padding: 0 0 32px;
    }

    .portal-left, .portal-right { min-width: 0; display: grid; gap: 12px; align-content: start; }

    /* 欢迎横幅 */
    .welcome-card {
      position: relative;
      height: 196px;
      padding: 38px 48px;
      overflow: hidden;
      background:
        linear-gradient(120deg, rgba(40,76,209,.78) 0%, rgba(63,118,255,.55) 46%, rgba(120,170,255,.35) 100%),
        linear-gradient(120deg, #2756d6 0%, #4a7dff 60%, #8db2ff 100%);
      border-radius: 6px;
    }

    .welcome-card h1 {
      margin: 0;
      color: #fff;
      font-size: 28px;
      line-height: 38px;
      font-weight: 800;
    }

    .welcome-card p {
      margin: 12px 0 24px;
      max-width: 760px;
      color: rgba(255,255,255,.86);
      font-size: 15px;
      line-height: 24px;
    }

    .welcome-search {
      display: flex;
      max-width: 620px;
      height: 46px;
      background: rgba(255,255,255,.94);
      border-radius: 4px;
      overflow: hidden;
    }

    .welcome-search input {
      flex: 1;
      padding: 0 18px;
      border: 0;
      outline: none;
      font-size: 14px;
      color: var(--pf-ink);
      background: transparent;
    }

    .welcome-search input::placeholder { color: var(--pf-muted); }

    .welcome-search button {
      padding: 0 28px;
      color: #fff;
      background: var(--pf-blue);
      border: 0;
      font-size: 15px;
      font-weight: 600;
    }

    /* 全部应用 */
    .panel {
      background: var(--pf-card);
      border: 1px solid var(--pf-line);
      border-radius: 6px;
      box-shadow: 0 6px 20px rgba(31,59,105,.04);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 24px 0;
    }

    .panel-head .head-left {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .panel-head h2 {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--pf-ink);
    }

    .panel-head h2 .dot {
      display: inline-block;
      width: 6px;
      height: 16px;
      background: var(--pf-blue);
      border-radius: 3px;
    }

    .tab-link {
      padding: 10px 0;
      color: var(--pf-muted);
      font-size: 15px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
    }

    .tab-link.active {
      color: var(--pf-blue);
      font-weight: 700;
      border-bottom-color: var(--pf-blue);
    }

    .panel-head a.more {
      color: var(--pf-blue);
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 18px 12px;
      padding: 22px 24px 26px;
    }

    .app-tile {
      display: grid;
      justify-items: center;
      gap: 10px;
      padding: 14px 6px;
      border-radius: 6px;
      text-align: center;
      text-decoration: none;
    }

    .app-tile:hover { background: var(--pf-page); }
    .app-tile[hidden] { display: none; }

    .app-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      font-size: 22px;
      color: #fff;
    }

    .app-tile span { font-size: 14px; color: var(--pf-text); }

    .ic-1 { background: linear-gradient(135deg,#ff9966,#ff7043); }
    .ic-2 { background: linear-gradient(135deg,#5bc0ff,#3d8bff); }
    .ic-3 { background: linear-gradient(135deg,#9b8cff,#7a6bff); }
    .ic-4 { background: linear-gradient(135deg,#ff8fb1,#ff6f9c); }
    .ic-5 { background: linear-gradient(135deg,#7c8ba1,#5b6b82); }
    .ic-6 { background: linear-gradient(135deg,#7fd9c4,#4fc3a1); }
    .ic-7 { background: linear-gradient(135deg,#ffd34f,#f6b82e); }
    .ic-8 { background: linear-gradient(135deg,#5dd0a6,#34b88a); }
    .ic-9 { background: linear-gradient(135deg,#7aa6ff,#577dff); }
    .ic-10 { background: linear-gradient(135deg,#ffab6e,#ff8a3d); }
    .ic-11 { background: linear-gradient(135deg,#9adf8e,#6fcf6a); }
    .ic-12 { background: linear-gradient(135deg,#ffb259,#ff9234); }

    /* 我的申请 */
    .apply-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
      padding: 18px 24px 24px;
    }

    .apply-card {
      padding: 18px 20px;
      border: 1px solid var(--pf-line);
      border-left: 3px solid var(--pf-blue);
      border-radius: 4px;
      background: #fafcff;
    }

    .apply-card.is-returned { border-left-color: var(--pf-orange); }

    .apply-card .apply-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .apply-card .apply-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--pf-ink);
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 10px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-tag.progress { color: #1d6fff; background: #e8f1ff; }
    .status-tag.returned { color: #ff7d35; background: #fff1e6; }

    .apply-card a.detail {
      color: var(--pf-blue);
      font-size: 14px;
      text-decoration: none;
    }

    .apply-card p {
      margin: 0 0 6px;
      color: var(--pf-text);
      font-size: 14px;
      line-height: 22px;
    }

    .apply-card .step {
      color: var(--pf-blue);
      font-weight: 600;
    }

    .apply-card .reason {
      margin-top: 8px;
      padding: 8px 12px;
      color: var(--pf-orange);
      background: #fff4ec;
      border-radius: 4px;
      font-size: 13px;
      line-height: 20px;
    }

    .apply-card .note {
      margin-top: 8px;
      color: var(--pf-muted);
      font-size: 12px;
      line-height: 18px;
    }

    /* 待办卡片：系统需要本人去做的事项 */
    .todo-card {
      padding: 18px 20px;
      border: 1px solid var(--pf-line);
      border-left: 3px solid var(--pf-blue);
      border-radius: 4px;
      background: #fafcff;
    }

    .todo-card.is-urgent {
      border-left-color: var(--pf-red);
    }

    .todo-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .todo-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--pf-ink);
    }

    .todo-deadline {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 10px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      color: #1d6fff;
      background: #e8f1ff;
      white-space: nowrap;
    }

    .todo-deadline.urgent {
      color: #ff4d4f;
      background: #ffe8e8;
    }

    .todo-desc {
      margin: 0 0 14px;
      color: var(--pf-text);
      font-size: 14px;
      line-height: 22px;
    }

    .todo-action {
      color: var(--pf-blue);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .todo-action:hover {
      text-decoration: underline;
    }

    /* 右栏：日程 */
    .schedule-card { padding: 20px 22px; }

    .schedule-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .schedule-date {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .schedule-date .day-num {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      color: #fff;
      background: linear-gradient(135deg,#5b8cff,#3565ea);
      border-radius: 8px;
      font-size: 24px;
      font-weight: 800;
    }

    .schedule-date .day-meta p { margin: 0; color: var(--pf-muted); font-size: 13px; }
    .schedule-date .day-meta h3 { margin: 2px 0 0; font-size: 17px; font-weight: 700; color: var(--pf-ink); }

    .schedule-actions { display: flex; gap: 14px; }
    .schedule-actions a { color: var(--pf-blue); font-size: 14px; text-decoration: none; white-space: nowrap; }

    .schedule-event {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 22px;
      padding: 14px 16px;
      background: var(--pf-page);
      border-radius: 6px;
    }

    .schedule-event .ck {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      margin-top: 2px;
      color: #fff;
      background: #18b981;
      border-radius: 50%;
      font-size: 13px;
    }

    .schedule-event h4 { margin: 0 0 6px; font-size: 15px; font-weight: 700; color: var(--pf-ink); }
    .schedule-event p { margin: 0; color: var(--pf-muted); font-size: 13px; }

    /* 通知 */
    .notice-list { padding: 4px 24px 16px; display: grid; }

    .notice-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 0;
      border-bottom: 1px solid var(--pf-line);
    }

    .notice-item:last-child { border-bottom: none; }

    .notice-item {
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .notice-item:hover h3 { color: var(--pf-blue); }

    .notice-item .dot-mark {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 8px 8px 0 0;
      background: var(--pf-red);
      border-radius: 50%;
      flex: none;
    }
    .notice-item .dot-mark.normal { background: #c6cdd9; }

    .notice-item .text {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .notice-item h3 {
      margin: 0;
      overflow: hidden;
      color: var(--pf-text);
      font-size: 14px;
      font-weight: 400;
      line-height: 22px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 已读/未读仅通过左侧圆点区分，标题字体颜色与字重保持一致 */

    .notice-pin {
      display: inline-flex;
      align-items: center;
      flex: none;
      height: 22px;
      padding: 0 7px;
      color: #fff;
      background: var(--pf-blue);
      border-radius: 3px;
      font-size: 12px;
    }

    .notice-item time {
      flex: none;
      color: var(--pf-muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .notice-unread-badge {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--pf-red);
      border-radius: 50%;
    }

    /* 政策文件 */
    .policy-search {
      display: flex;
      align-items: center;
      height: 34px;
      padding: 0 12px;
      gap: 6px;
      color: var(--pf-muted);
      background: var(--pf-page);
      border-radius: 17px;
      font-size: 13px;
      width: 168px;
    }

    .policy-search input {
      flex: 1;
      border: 0;
      outline: none;
      background: transparent;
      font-size: 13px;
      color: var(--pf-text);
    }

    .policy-list { padding: 4px 24px 20px; display: grid; }

    .policy-item {
      display: block;
      padding: 13px 0;
      border-bottom: 1px solid var(--pf-line);
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .policy-item:last-child { border-bottom: none; }

    .policy-item:hover h3 { color: var(--pf-blue); }

    .policy-item h3 {
      margin: 0 0 8px;
      overflow: hidden;
      color: var(--pf-text);
      font-size: 14px;
      font-weight: 400;
      line-height: 22px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 置顶项仅通过左侧"置顶"标签区分，标题字体颜色与字重与普通项保持一致 */

    .policy-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--pf-muted);
      font-size: 12px;
    }

    .top-tag {
      display: inline-flex;
      align-items: center;
      height: 20px;
      margin-right: 6px;
      padding: 0 6px;
      color: #fff;
      background: var(--pf-blue);
      border-radius: 3px;
      font-size: 11px;
      vertical-align: 2px;
    }
    /* 全局搜索弹窗 */
    .gs-mask {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: none;
      background: rgba(17,28,52,.45);
      backdrop-filter: blur(2px);
    }
    .gs-mask.is-open { display: block; }

    .gs-dialog {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 736px;
      max-width: calc(100% - 48px);
      max-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,.18);
      overflow: hidden;
    }

    .gs-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px;
      border-bottom: 1px solid #EEEEF0;
      flex: none;
    }
    .gs-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      border: 1px solid #DCDCE0;
      border-radius: 4px;
      padding: 0 12px;
    }
    .gs-input-wrap:focus-within { border-color: #4752FF; }
    .gs-input-wrap input {
      flex: 1;
      border: 0;
      outline: none;
      font-size: 14px;
      color: #1D2129;
      background: transparent;
      min-width: 0;
    }
    .gs-input-wrap input::placeholder { color: #C9CAD4; }
    .gs-close {
      flex: none;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 0;
      background: none;
      cursor: pointer;
      padding: 0;
      border-radius: 4px;
    }
    .gs-close:hover { background: #f4f4f6; }

    .gs-body {
      overflow-y: auto;
      padding: 6px 0 14px;
    }

    .gs-hint {
      padding: 14px 22px 4px;
      color: var(--pf-muted);
      font-size: 13px;
    }

    /* AI 智能搜索助手卡片（默认态） */
    .gs-ai {
      margin: 16px 16px 0;
      padding: 12px;
      border-radius: 4px;
      background: linear-gradient(90deg, #EDF4FF 0%, #F2EDFF 100%);
    }
    .gs-ai-head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
    }
    .gs-ai-head .ai-title {
      background: linear-gradient(90deg, #4752FF 0%, #7847FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gs-ai-prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .gs-ai-prompts button {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 4px;
      border: none;
      background: #fff;
      color: #505266;
      font-size: 12px;
      cursor: pointer;
    }
    .gs-ai-prompts button:hover { background: #e8eeff; }
    /* 历史查询 */
    .gs-history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 8px;
    }
    .gs-history-title { font-size: 12px; color: #737585; }
    .gs-history-clear {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border: 0;
      background: none;
      cursor: pointer;
      padding: 0;
    }
    .gs-history-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 16px;
    }
    .gs-history-chip {
      background: #EEEEF0;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      color: #505266;
      cursor: pointer;
      border: none;
    }
    .gs-history-chip:hover { background: #dddde2; }
    /* 无历史记录空状态 */
    .gs-empty-img {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 48px;
    }
    .gs-empty-img img { width: 120px; height: 120px; }
    .gs-empty-title {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #1D2129;
    }
    .gs-empty-sub {
      margin-top: 4px;
      font-size: 12px;
      color: #737585;
    }

    /* AI 回答卡片：在搜索结果上方展示 AI 对自然语言提问的理解与总结 */
    .gs-ai-answer {
      margin: 14px 22px 4px;
      padding: 14px 16px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f3f6ff 0%, #faf6ff 100%);
      border: 1px solid #e6ebfb;
    }
    .gs-ai-answer-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--pf-ink);
    }
    .gs-ai-answer-head .spark {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      font-size: 12px;
      color: #fff;
      background: linear-gradient(135deg, #6a8bff, #b07bff);
    }
    .gs-ai-answer-text {
      margin: 8px 0 0;
      font-size: 13px;
      line-height: 22px;
      color: var(--pf-text);
    }
    .gs-think-dots { display: flex; gap: 5px; margin: 12px 2px 2px; }
    .gs-think-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #b3c0e6;
      animation: gsThinkBounce 1.1s infinite ease-in-out;
    }
    .gs-think-dots span:nth-child(2) { animation-delay: .15s; }
    .gs-think-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes gsThinkBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .5; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    .gs-group { padding: 6px 22px 4px; }

    .gs-group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0 6px;
      color: var(--pf-muted);
      font-size: 13px;
      font-weight: 600;
    }

    .gs-group-title .cnt { color: var(--pf-muted); font-weight: 400; }

    .gs-result {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 12px;
      border-radius: 6px;
      text-decoration: none;
      color: inherit;
    }
    .gs-result:hover { background: var(--pf-page); }

    .gs-result .gs-badge {
      flex: none;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
    }

    .gs-result .gs-meta { min-width: 0; flex: 1; }
    .gs-result .gs-meta h4 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--pf-ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .gs-mask mark {
      background: none;
      color: var(--pf-blue);
      font-weight: 600;
      border-radius: 0;
      padding: 0;
    }

    /* 分类切换 Tab */
    .gs-tabs {
      flex: none;
      display: flex;
      gap: 22px;
      padding: 0 22px;
      border-bottom: 1px solid var(--pf-line);
      overflow-x: auto;
    }
    .gs-tab {
      flex: none;
      padding: 12px 1px;
      font-size: 14px;
      color: var(--pf-muted);
      background: none;
      border: 0;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
    }
    .gs-tab:hover { color: var(--pf-ink); }
    .gs-tab.active { color: var(--pf-blue); font-weight: 600; }
    .gs-tab.active::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
      height: 2px; background: var(--pf-blue); border-radius: 1px;
    }

    /* 综合 / 分类结果分组 */
    .gs-sec { padding: 12px 22px 4px; }
    .gs-sec.gs-sec-flat { padding-top: 10px; }
    .gs-sec-title {
      margin: 0 0 6px; padding: 6px 0;
      font-size: 13px; font-weight: 600; color: var(--pf-muted);
    }
    .gs-more {
      display: inline-flex; align-items: center; gap: 2px;

      font-size: 13px; color: var(--pf-blue); cursor: pointer;

    /* 教职工结果行 */
    .gs-person {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 12px; border-radius: 6px; text-decoration: none; color: inherit;
    }
    .gs-person:hover { background: var(--pf-page); }
    .gs-avatar {

      display: grid; place-items: center; font-size: 16px; background: #eef1f6;

    .gs-p-id { font-size: 13px; color: var(--pf-muted); }
    .gs-p-college { margin-left: auto; font-size: 13px; color: var(--pf-muted); flex: none; }

    /* 应用结果：双列宫格 */
    .gs-app-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
    .gs-app-item {
      display: flex; align-items: center; gap: 10px; min-width: 0;
      padding: 10px 12px; border-radius: 6px; text-decoration: none; color: inherit;
    }
    .gs-app-item:hover { background: var(--pf-page); }

      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

    /* 待办 / 消息 / 通知 / 政策：标题 + 元信息行 */
    .gs-task {
      display: block; padding: 10px 12px; border-radius: 6px;
      text-decoration: none; color: inherit;
    }
    .gs-task:hover { background: var(--pf-page); }
    .gs-task h4 {

      line-height: 21px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;

    .gs-task .gs-sub {
      margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 18px;
      font-size: 12px; color: var(--pf-muted);
    }

    /* 文档结果：文件图标 + 信息 */

      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 6px; text-decoration: none; color: inherit;
    }
    .gs-info:hover { background: var(--pf-page); }

    .gs-info .gs-meta h4 {

    .gs-info .gs-meta .gs-sub {

    if (activeTab === cat) return;

  // displayKw 用于"无结果"提示中向用户复述其原始输入
  function renderResults(displayKw, effectiveKw, matched) {
    var aiHtml = (aiState.isQuestion && aiState.kw === displayKw) ? aiAnswerBlock(aiState.answer) : '';

    if (!matched.length) {
      body.innerHTML = aiHtml + emptyHtml(displayKw);
      bindMore();
      return;
    }

    var html = '';
    if (activeTab === '综合') {
      // 按固定分类顺序分组展示，每组限量 + "查看更多" 跳转到对应 Tab
      SEARCH_CATS.slice(1).forEach(function (cat) {
        var items = matched.filter(function (item) { return item.cat === cat; });
        if (items.length) html += renderGroup(cat, items, effectiveKw);
      });
    } else {
      var items = matched.filter(function (item) { return item.cat === activeTab; });
      if (!items.length) { body.innerHTML = aiHtml + emptyHtml(displayKw); bindMore(); return; }
      html = '<div class="gs-sec gs-sec-flat">' + renderRows(activeTab, items, effectiveKw) + '</div>';

    body.innerHTML = aiHtml + (html || emptyHtml(displayKw));
    bindMore();

  function plainFilter(text) {
    return SEARCH_INDEX.filter(function (item) {
      return matchText(item).toLowerCase().indexOf(text.toLowerCase()) !== -1;
    });
  }

  function runSearch(keyword) {
    var kw = (keyword || '').trim();
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }

    if (!kw) {
      aiState = { kw: '', answer: '', isQuestion: false };
      renderDefault();
      return;
    }

    var isNewKw = (kw !== aiState.kw);
    var isQuestion = looksLikeQuestion(kw);

    if (isNewKw && isQuestion) {
      // 新的自然语言提问：先模拟"AI 思考中"，再给出理解后的回答 + 结果
      renderThinking();
      aiTimer = setTimeout(function () {
        aiTimer = null;
        var intent = detectIntent(kw);
        var matched, effectiveKw;
        if (intent) {
          effectiveKw = intent.kw || '';
          matched = SEARCH_INDEX.filter(function (item) {
            if (item.cat !== intent.cat) return false;
            return effectiveKw ? matchText(item).toLowerCase().indexOf(effectiveKw.toLowerCase()) !== -1 : true;
          });
        } else {
          effectiveKw = kw;
          matched = plainFilter(kw);
        }
        aiState = { kw: kw, answer: buildAiAnswer(kw, matched), isQuestion: true, effectiveKw: effectiveKw, matched: matched };
        renderResults(kw, effectiveKw, matched);
      }, 650);
      return;
    }

    if (isNewKw) {
      // 普通关键词搜索：直接按字面匹配，不触发 AI 回答
      aiState = { kw: kw, answer: '', isQuestion: false, effectiveKw: kw, matched: plainFilter(kw) };
    }

    renderResults(kw, aiState.effectiveKw, aiState.matched);
  }

  var DELETE_SVG  = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M11.33 4H14.67V5.33H13.33V14c0 .37-.3.67-.67.67H3.33C2.97 14.67 2.67 14.37 2.67 14V5.33H1.33V4H4.67V2c0-.37.3-.67.67-.67h5.33c.37 0 .67.3.67.67V4zM12 5.33H4V13.33H12V5.33zM6 2.67V4H10V2.67H6Z" fill="#3167FF"/></svg>';
  var REMOVE_SVG  = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7.5" fill="#FA5151"/><path d="M5.5 5.5l5 5M10.5 5.5l-5 5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>';
  var PLUS_SVG    = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16" fill="none"><path d="M14.667 7.333H8.667V1.333H7.333v6H1.333v1.334h6v6h1.334v-6h6z" fill="#C9CAD4"/></svg>';

  function escAc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var AC_MENUS = [
    { key: 'menu-announce', type: 'menu', label: '人事公告', parentKey: 'my-info', url: '#' },
    { key: 'menu-recruit',  type: 'menu', label: '招聘信息', parentKey: 'my-info', url: '#' },
    { key: 'menu-policy',   type: 'menu', label: '政策文件', parentKey: 'cert',    url: '#' },
    { key: 'menu-org',      type: 'menu', label: '组织架构', parentKey: 'cert',    url: '#' },
    { key: 'menu-train',    type: 'menu', label: '培训计划', parentKey: 'annual',  url: '#' },
    { key: 'menu-attend',   type: 'menu', label: '考勤记录', parentKey: 'annual',  url: '#' },
    { key: 'menu-contract', type: 'menu', label: '合同管理', parentKey: 'salary',  url: '#' },
    { key: 'menu-welfare',  type: 'menu', label: '福利待遇', parentKey: 'salary',  url: '#' },
  ];
  var MENU_ICON_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4.5h12M2 8h12M2 11.5h8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>';
  var CHEVRON_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 10.667L4 6.667L12 6.667Z" fill="#000"/></svg>';
  var MENU_CB_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14"><rect x="0" y="0" width="14" height="14" rx="2" fill="#FFF"/><rect x="0.5" y="0.5" width="13" height="13" rx="1.5" fill="none" stroke="#DCDCE0" stroke-width="1"/></svg>';

  function findAcGroup(id) {
    for (var i = 0; i < acGroups.length; i++) if (acGroups[i].id === id) return acGroups[i];
    return null;
  }
  function appByKey(key) {
    for (var i = 0; i < AC_APPS.length; i++) if (AC_APPS[i].key === key) return AC_APPS[i];
    return null;
  }
  function menuByKey(key) {
    for (var i = 0; i < AC_MENUS.length; i++) if (AC_MENUS[i].key === key) return AC_MENUS[i];
    return null;
  }
  function isMenuKey(key) { return key.indexOf('menu-') === 0; }

  function renderAcSidebar() {
    acSidebar.innerHTML = acGroups.map(function (g) {
      var active = g.id === acActiveId;
      var actions = (!g.readonly)
        ? '<span class="gacts">' +
            '<button type="button" data-act="rename" aria-label="重命名">' + RENAME_SVG + '</button>' +
            '<button type="button" data-act="delete" aria-label="删除">' + DELETE_SVG + '</button>' +
          '</span>'
        : '';
      return '<div class="ac-group-item' + (active ? ' active' : '') + '" data-id="' + g.id + '">' +
        '<span class="gname">' + escAc(g.name) + '</span>' + actions +
      '</div>';
    }).join('');
    acSidebar.querySelectorAll('.ac-group-item').forEach(function (item) {
      var gid = item.getAttribute('data-id');
      item.addEventListener('click', function (e) {
        if (e.target.closest('[data-act]')) return;
        acActiveId = gid; renderAcSidebar(); renderAcContent();
      });
      var renBtn = item.querySelector('[data-act="rename"]');
      if (renBtn) renBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        var g = findAcGroup(gid);
        var name = window.prompt('重命名分组', g ? g.name : '');
        if (name && name.trim()) { if (g) g.name = name.trim(); renderAcSidebar(); renderAcContent(); }
      });
      var delBtn = item.querySelector('[data-act="delete"]');
      if (delBtn) delBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        var g = findAcGroup(gid);
        if (!window.confirm('确定要删除分组「' + (g ? g.name : '') + '」吗？')) return;
        acGroups = acGroups.filter(function (x) { return x.id !== gid; });
        if (acActiveId === gid) acActiveId = acGroups.length ? acGroups[0].id : null;
        renderAcSidebar(); renderAcContent();
      });
    });
  }

  function renderAcContent() {
    var g = findAcGroup(acActiveId);
    if (!g) { acContentEl.innerHTML = ''; return; }
    var readonly = !!g.readonly;
    var tiles = g.apps.map(function (key) {
      var app = appByKey(key);
      var item = app || menuByKey(key);
      if (!item) return '';
      var removeBtn = readonly ? '' : '<button class="ac-remove" type="button" data-act="remove" data-key="' + key + '" aria-label="移除">' + REMOVE_SVG + '</button>';
      var iconHtml = app
        ? '<img class="ac-app-icon ' + app.ic + '" src="' + app.src + '" alt="" />'
        : '<div class="ac-app-icon ac-menu-icon-big ic-menu">' + MENU_ICON_SVG + '</div>';
      return '<div class="ac-app-tile">' +
        removeBtn +
        '<a class="ac-app-link" href="' + item.url + '" onclick="return false">' +
          iconHtml +
          '<span class="ac-app-name">' + escAc(item.label) + '</span>' +
        '</a>' +
      '</div>';
    }).join('');
    var addBtn = readonly ? '' : '<button class="ac-add-tile" type="button" data-act="add">' + PLUS_SVG + '<span>添加应用</span></button>';
    acContentEl.innerHTML = '<h3 class="ac-content-title">' + escAc(g.name) + '</h3>' +
      '<div class="ac-app-grid">' + tiles + addBtn + '</div>';
    acContentEl.querySelectorAll('[data-act="remove"]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        g.apps = g.apps.filter(function (k) { return k !== btn.getAttribute('data-key'); });
        renderAcContent();
      });
    });
    var addTile = acContentEl.querySelector('[data-act="add"]');
    if (addTile) addTile.addEventListener('click', function () { openTransfer(g.id); });
  }

  // ── 穿梭框 ──────────────────────────────────────────────
  var DRAG_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M5.5,2C4.95,2,4.5,2.45,4.5,3C4.5,3.55,4.95,4,5.5,4C6.05,4,6.5,3.55,6.5,3C6.5,2.45,6.05,2,5.5,2ZM5.5,12C4.95,12,4.5,12.45,4.5,13C4.5,13.55,4.95,14,5.5,14C6.05,14,6.5,13.55,6.5,13C6.5,12.45,6.05,12,5.5,12ZM5.5,7C4.95,7,4.5,7.45,4.5,8C4.5,8.55,4.95,9,5.5,9C6.05,9,6.5,8.55,6.5,8C6.5,7.45,6.05,7,5.5,7ZM10.5,2C9.95,2,9.5,2.45,9.5,3C9.5,3.55,9.95,4,10.5,4C11.05,4,11.5,3.55,11.5,3C11.5,2.45,11.05,2,10.5,2ZM10.5,12C9.95,12,9.5,12.45,9.5,13C9.5,13.55,9.95,14,10.5,14C11.05,14,11.5,13.55,11.5,13C11.5,12.45,11.05,12,10.5,12ZM10.5,7C9.95,7,9.5,7.45,9.5,8C9.5,8.55,9.95,9,10.5,9C11.05,9,11.5,8.55,11.5,8C11.5,7.45,11.05,7,10.5,7Z" fill="#9697A3"/></svg>';
  var DEL_SVG  = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8,7.057L3.805,2.862L2.862,3.805L7.057,8L2.862,12.195L3.805,13.138L8,8.943L12.195,13.138L13.138,12.195L8.943,8L13.138,3.805L12.195,2.862L8,7.057Z" fill="currentColor" fill-rule="evenodd"/></svg>';

  var tfMask       = document.getElementById('acTfMask');
  var tfTitle      = document.getElementById('acTfTitle');
  var tfLeftList   = document.getElementById('acTfLeftList');
  var tfRightList  = document.getElementById('acTfRightList');
  var tfLeftCount  = document.getElementById('acTfLeftCount');
  var tfRightCount = document.getElementById('acTfRightCount');
  var tfSearchEl   = document.getElementById('acTfSearch');
  var tfTargetId   = null;
  var tfLeft  = [];
  var tfRight = [];
  var tfLeftTab = 'app';
  var tfSearchQ = '';

  function tfVisibleLeft() {
    return tfLeft.filter(function (k) {
      if (tfLeftTab === 'menu' ? !isMenuKey(k) : isMenuKey(k)) return false;
      if (!tfSearchQ) return true;
      var item = appByKey(k) || menuByKey(k);
      return item && item.label.indexOf(tfSearchQ) !== -1;
    });
  }

  function tfMenuTreeHtml() {
    var visibleKeys = tfVisibleLeft();
    var groups = {};
    visibleKeys.forEach(function (k) {
      var m = menuByKey(k);
      if (!m) return;
      var pk = m.parentKey || '__none__';
      if (!groups[pk]) groups[pk] = [];
      groups[pk].push(k);
    });
    var html = '';
    AC_APPS.forEach(function (app) {
      var children = groups[app.key];
      if (!children || children.length === 0) return;
      html += '<div class="ac-tf-tree-parent">' +
        '<span class="ac-tf-tree-chevron">' + CHEVRON_SVG + '</span>' +
        '<span class="ac-tf-item-name">' + escAc(app.label) + '</span>' +
      '</div>';
      children.forEach(function (k) {
        var m = menuByKey(k);
        if (!m) return;
        html += '<div class="ac-tf-tree-child" data-key="' + k + '">' +
          '<span class="ac-tf-tree-cb">' + MENU_CB_SVG + '</span>' +
          '<span class="ac-tf-item-name">' + escAc(m.label) + '</span>' +
        '</div>';
      });
    });
    return html;
  }

  function tfUpdateTabCounts() {
    var appCount  = tfLeft.filter(function (k) { return !isMenuKey(k); }).length;
    var menuCount = tfLeft.filter(function (k) { return  isMenuKey(k); }).length;
    var appEl  = document.getElementById('acTfCountApp');
    var menuEl = document.getElementById('acTfCountMenu');
    if (appEl)  appEl.textContent  = appCount;
    if (menuEl) menuEl.textContent = menuCount;
  }

  function tfLeftItemHtml(key) {
    var app = appByKey(key);
    var item = app || menuByKey(key);
    if (!item) return '';
    var iconHtml = app
      ? '<img class="ac-tf-icon ' + app.ic + '" src="' + app.src + '" alt="" />'
      : '<div class="ac-tf-icon ac-tf-menu-icon ic-menu">' + MENU_ICON_SVG + '</div>';
    return '<div class="ac-tf-item" data-key="' + key + '">' +
      '<div class="ac-tf-item-cb"></div>' +
      iconHtml +
      '<span class="ac-tf-item-name">' + escAc(item.label) + '</span>' +
    '</div>';
  }

  function tfRightChipHtml(key) {
    var app = appByKey(key);
    var item = app || menuByKey(key);
    if (!item) return '';
    var iconHtml = app
      ? '<img class="ac-tf-chip-icon ' + app.ic + '" src="' + app.src + '" alt="" />'
      : '<div class="ac-tf-chip-icon ac-tf-menu-icon ic-menu">' + MENU_ICON_SVG + '</div>';
    return '<div class="ac-tf-chip" data-key="' + key + '">' +
      '<span class="ac-tf-chip-drag">' + DRAG_SVG + '</span>' +
      iconHtml +
      '<span class="ac-tf-chip-name">' + escAc(item.label) + '</span>' +
      '<button class="ac-tf-chip-del" type="button" data-key="' + key + '" aria-label="移除">' + DEL_SVG + '</button>' +
    '</div>';
  }

  function tfRenderLeft() {
    var list = tfVisibleLeft();
    tfLeftCount.textContent = list.length;
    tfUpdateTabCounts();
    if (tfLeftTab === 'menu') {
      tfLeftList.innerHTML = tfMenuTreeHtml();
      tfLeftList.querySelectorAll('.ac-tf-tree-child').forEach(function (el) {
        el.addEventListener('click', function () {
          var k = el.getAttribute('data-key');
          tfLeft  = tfLeft.filter(function (x) { return x !== k; });
          tfRight = tfRight.concat([k]);
          tfRenderLeft(); tfRenderRight();
        });
      });
    } else {
      tfLeftList.innerHTML = list.map(tfLeftItemHtml).join('');
      tfLeftList.querySelectorAll('.ac-tf-item').forEach(function (el) {
        el.addEventListener('click', function () {
          var k = el.getAttribute('data-key');
          tfLeft  = tfLeft.filter(function (x) { return x !== k; });
          tfRight = tfRight.concat([k]);
          tfRenderLeft(); tfRenderRight();
        });
      });
    }
  }

  function tfRenderRight() {
    tfRightList.innerHTML = tfRight.map(tfRightChipHtml).join('');
    tfRightCount.textContent = tfRight.length;
    tfRightList.querySelectorAll('.ac-tf-chip-del').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var k = btn.getAttribute('data-key');
        tfRight = tfRight.filter(function (x) { return x !== k; });
        tfLeft.push(k);
        tfRenderLeft(); tfRenderRight();
      });
    });
  }

  function tfRender() { tfRenderLeft(); tfRenderRight(); }

  tfSearchEl.addEventListener('input', function () {
    tfSearchQ = tfSearchEl.value.trim();
    tfRenderLeft();
  });

  document.getElementById('acTfClear').addEventListener('click', function () {
    tfLeft = tfLeft.concat(tfRight);
    tfRight = [];
    tfRender();
  });

  function tfSetTab(tab) {
    tfLeftTab = tab;
    document.getElementById('acTfTabApp').classList.toggle('active', tab === 'app');
    document.getElementById('acTfTabMenu').classList.toggle('active', tab === 'menu');
    tfRenderLeft();
  }

  document.getElementById('acTfTabApp').addEventListener('click',  function () { tfSetTab('app'); });
  document.getElementById('acTfTabMenu').addEventListener('click', function () { tfSetTab('menu'); });

  function openTransfer(gid) {
    var g = findAcGroup(gid);
    if (!g) return;
    tfTargetId = gid;
    tfTitle.textContent = '管理「' + g.name + '」的内容';
    tfRight = g.apps.slice();
    var allKeys = AC_APPS.map(function (a) { return a.key; })
      .concat(AC_MENUS.map(function (m) { return m.key; }));
    tfLeft = allKeys.filter(function (k) { return tfRight.indexOf(k) === -1; });
    tfSearchQ = ''; tfSearchEl.value = '';
    tfSetTab('app');
    tfMask.classList.add('is-open');
    tfRender();
  }
  function closeTransfer() { tfMask.classList.remove('is-open'); tfTargetId = null; }

  document.getElementById('acTfTabApp').addEventListener('click', function () { tfSetTab('app'); });
  document.getElementById('acTfTabMenu').addEventListener('click', function () { tfSetTab('menu'); });

  document.getElementById('acTfClose').addEventListener('click', closeTransfer);
  document.getElementById('acTfCancel').addEventListener('click', closeTransfer);
  document.getElementById('acTfConfirm').addEventListener('click', function () {
    var g = findAcGroup(tfTargetId);
    if (g) { g.apps = tfRight.slice(); renderAcContent(); }
    closeTransfer();
  });
  tfMask.addEventListener('click', function (e) { if (e.target === tfMask) closeTransfer(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && tfMask.classList.contains('is-open')) closeTransfer();
  });

  function openAcModal() {
    acMask.classList.add('is-open');
    renderAcSidebar();
    renderAcContent();
  }
  function closeAcModal() { acMask.classList.remove('is-open'); }

  document.getElementById('openCustomModal').addEventListener('click', openAcModal);
  document.getElementById('acClose').addEventListener('click', closeAcModal);
  document.getElementById('acCancel').addEventListener('click', closeAcModal);
  document.getElementById('acConfirm').addEventListener('click', closeAcModal);
  acMask.addEventListener('click', function (e) { if (e.target === acMask) closeAcModal(); });
  document.getElementById('acAddGroupBtn').addEventListener('click', function () {
    var name = window.prompt('请输入新分组名称');
    if (!name || !name.trim()) return;
    acGroupSeq++;
    var newId = 'ac' + acGroupSeq;
    acGroups.push({ id: newId, name: name.trim(), apps: [] });
    acActiveId = newId;
    renderAcSidebar(); renderAcContent();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && acMask.classList.contains('is-open')) closeAcModal();
  });

  // ------- 应用分组 tab 切换 -------
  var appTabsWrap = document.getElementById('appTabsWrap');
  var appGid = 'all';

  function renderAppGrid() {
    var g = findAcGroup(appGid);
    var allowed = (g && appGid !== 'all') ? g.apps : null;
    if (!allowed) {
      document.querySelectorAll('.app-grid .app-tile').forEach(function (tile) { tile.hidden = false; });
      return;
    }
    var urlToKey = {};
    AC_APPS.forEach(function (a) { urlToKey[a.url] = a.key; });
    document.querySelectorAll('.app-grid .app-tile').forEach(function (tile) {
      var key = urlToKey[tile.getAttribute('href') || ''];
      tile.hidden = !key || allowed.indexOf(key) === -1;
    });
  }

  appTabsWrap.querySelectorAll('.tab-link').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var gid = btn.getAttribute('data-gid');
      if (gid === appGid) return;
      appGid = gid;
      appTabsWrap.querySelectorAll('.tab-link').forEach(function (b) { b.classList.toggle('active', b === btn); });
      renderAppGrid();
    });
  });
})();
</script>
</body>
</html>
