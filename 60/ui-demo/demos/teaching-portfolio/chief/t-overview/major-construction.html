<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../../../../assets/tokens.css" />
  <link rel="stylesheet" href="../../../../assets/base.css" />
  <link rel="stylesheet" href="../../../../assets/theme.css" />
  <style>
    body { margin: 0; background: #fff; }
    .ds-scope, .ds-page { background: #fff; }

    .ah-page { height: 100%; min-height: 0; background: var(--ds-color-bg-container); }
    .ah-content-card { width: 100%; height: calc(100vh - 92px); min-height: 0; overflow: hidden; background: var(--ds-color-bg-container); }

    .ah-top-header { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--ds-color-border-secondary); }
    .ah-back-btn { display: inline-flex; align-items: center; gap: 4px; color: #000; font-size: 14px; cursor: pointer; background: none; border: none; padding: 0; }
    .ah-back-btn:hover { color: var(--ds-color-primary); }
    .ah-back-btn svg { width: 20px; height: 20px; }
    .ah-header-divider { width: 1px; height: 20px; background: #eeeef0; }
    .ah-header-title { margin: 0; font-size: 20px; font-weight: 600; color: #000; }

    .ah-detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 180px; height: calc(100vh - 144px); min-height: 0; overflow: hidden; }

    .ah-main { display: flex; flex-direction: column; gap: 28px; overflow-y: auto; overscroll-behavior: contain; padding: 24px 24px 40px; scroll-behavior: smooth; }

    .ah-anchor-panel { width: 100%; min-width: 150px; max-width: 220px; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 20px 0; background: var(--ds-color-bg-container); border-left: 1px solid var(--ds-color-border-secondary); }
    .ah-anchor-item { display: block; padding: 8px 16px; color: #505266; font-size: 13px; text-decoration: none; cursor: pointer; border-left: 3px solid transparent; transition: color 0.2s, background 0.2s; }
    .ah-anchor-item:hover { color: var(--ds-color-primary); background: var(--ds-color-primary-light); }
    .ah-anchor-item.is-active { color: var(--ds-color-primary); background: var(--ds-color-primary-light); border-left-color: var(--ds-color-primary); }

    .ah-section { display: grid; gap: 10px; min-width: 0; scroll-margin-top: 16px; }
    .ah-section-head { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-width: 0; }
    .ah-section-title { margin: 0; padding-left: 8px; color: #000; font-size: 16px; font-weight: 600; line-height: 22px; border-left: 3px solid var(--ds-color-primary); }

    /* 只读表单 - 表格式（6.0规范） */
    .info-table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid #eeeef0; background: #fff; table-layout: fixed; }
    .info-table th, .info-table td { padding: 10px 12px; border-bottom: 1px solid #eeeef0; border-left: 1px solid #eeeef0; font-size: 13px; line-height: 20px; }
    .info-table th:first-child, .info-table td:first-child { border-left: none; }
    .info-table th { background: #fafafa; color: #505266; font-weight: 400; text-align: right; white-space: nowrap; width: 140px; }
    .info-table td { color: #000; word-break: break-all; }
    .info-table tbody tr:last-child th, .info-table tbody tr:last-child td { border-bottom: none; }

    /* 数据表格（6.0规范） */
    .ah-table-wrap { overflow-x: auto; }
    .data-table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; color: #000; font-size: 14px; line-height: 22px; border: 1px solid #eeeef0; background: #fff; }
    .data-table th, .data-table td { height: 40px; padding: 0 12px; background: #fff; border-bottom: 1px solid #eeeef0; white-space: nowrap; overflow: hidden; text-align: left; text-overflow: ellipsis; }
    .data-table th { position: sticky; top: 0; z-index: 5; background: #fafafa; font-weight: 600; }
    .data-table th + th, .data-table td + td { border-left: 1px solid rgba(238, 238, 240, 0.72); }
    .data-table tbody tr:hover td { background: #f6f6f7; }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table .action-cell { text-align: right; position: sticky; right: 0; background: #fff; white-space: nowrap; }
    .data-table .action-cell .text-action + .text-action::before { content: "|"; color: var(--ds-color-border); margin: 0 8px; }
    .data-table .text-action { padding: 0; color: var(--ds-color-primary); background: transparent; border: 0; cursor: pointer; font-size: 14px; }
    .data-table .text-action:hover { color: var(--ds-color-primary-hover); }
    .mc-large-text { padding: 16px; color: #000; font-size: 14px; line-height: 1.75; border: 1px solid var(--ds-color-border-secondary); border-radius: 2px; background: var(--ds-color-bg-subtle); white-space: pre-wrap; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; min-width: 72px; padding: 0 14px; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid #dcdce0; background: #fff; color: #000; }
    .btn:hover { color: var(--ds-color-primary); border-color: var(--ds-color-primary); }
    .btn.primary { color: #fff; background: var(--ds-color-primary); border-color: var(--ds-color-primary); }
    .btn.primary:hover { background: var(--ds-color-primary-hover); }
    
    /* 弹窗 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1100; display: none; align-items: center; justify-content: center; }
    .modal-overlay.is-open { display: flex; }
    .modal { width: 800px; max-width: 90vw; max-height: 90vh; background: #fff; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); display: flex; flex-direction: column; }
    .modal--sm { width: 420px; }
    .modal__header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #eeeef0; flex-shrink: 0; }
    .modal__title { margin: 0; font-size: 16px; font-weight: 600; }
    .modal__close { width: 32px; height: 32px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
    .modal__close:hover { background: #f5f5f5; }
    .modal__body { flex: 1; overflow-y: auto; padding: 20px; }
    .modal__footer { display: flex; justify-content: flex-end; gap: 12px; padding: 16px 20px; border-top: 1px solid #eeeef0; flex-shrink: 0; }

    /* 双列表单 */
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; }
    .form-field { display: flex; flex-direction: column; gap: 8px; }
    .form-field--full { grid-column: 1 / -1; }
    .form-field__label { font-size: 14px; color: #000; font-weight: 500; }
    .form-field input, .form-field textarea { padding: 8px 12px; border: 1px solid #dcdce0; border-radius: 4px; font-size: 14px; }
    .form-field input:focus, .form-field textarea:focus { outline: none; border-color: var(--ds-color-primary); box-shadow: 0 0 0 2px var(--ds-color-focus-ring); }
    .form-field textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

    @media (max-width: 1100px) { .ah-detail-layout { grid-template-columns: minmax(0, 1fr) 170px; } }
    @media (max-width: 860px) {
      .ah-detail-layout { grid-template-columns: 1fr; height: auto; overflow: visible; }
      .ah-anchor-panel { order: -1; overflow: visible; padding: 12px; border-bottom: 1px solid var(--ds-color-border-secondary); border-left: 0; max-width: none; display: flex; flex-wrap: wrap; gap: 4px; }
      .ah-anchor-item { display: inline-block; padding: 4px 8px; border-left: none; }
      .ah-main { overflow: visible; }
      .form-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) { .ah-main { padding: 16px; } .ah-readonly-form { grid-template-columns: 1fr; } }
  </style>
</head>

      const rows = [];
      let pair = [];
      fields.forEach(f => {
        if (f.full) {
          if (pair.length) { rows.push(pair); pair = []; }
          rows.push([f]);
        } else {

        data.map(row =>
          '<tr>' + columns.map(c => '<td>' + (row[c.key] || '-') + '</td>').join('') +
          '<td class="action-cell"><button class="text-action" data-table="' + id + '" data-action="edit" data-id="' + row.id + '" type="button">编辑</button><button class="text-action" data-table="' + id + '" data-action="delete" data-id="' + row.id + '" type="button">删除</button></td></tr>'
        ).join('') +
      '</tbody></table></div>';
    }

    function render() {
      mainContent.innerHTML =
        // 1. 专业基本信息
        '<section class="ah-section" id="basic-info" data-section-key="basic-info">' +
          '<div class="ah-section-head"><h3 class="ah-section-title">专业基本信息</h3><button class="btn" data-open-form="basic-info" type="button">编辑</button></div>' +
          readonlyFormHTML(basicInfoFields) +
        '</section>' +
        // 2. 专业建设理念
        '<section class="ah-section" id="construction-idea" data-section-key="construction-idea">' +
          '<div class="ah-section-head"><h3 class="ah-section-title">专业建设理念</h3><button class="btn" data-table-add="idea" type="button">新增</button></div>' +
          crudTableHTML('idea', IDEA_COLUMNS, ideaData) +
        '</section>' +
        // 3. 队伍建设
        '<section class="ah-section" id="team-building" data-section-key="team-building">' +
          '<div class="ah-section-head"><h3 class="ah-section-title">队伍建设</h3><button class="btn" data-open-form="team" type="button">编辑</button></div>' +
          readonlyFormHTML(teamFields) +
        '</section>' +
        // 4. 主要成果
        '<section class="ah-section" id="main-results" data-section-key="main-results">' +
          '<div class="ah-section-head"><h3 class="ah-section-title">主要成果</h3><button class="btn" data-table-add="result" type="button">新增</button></div>' +
          crudTableHTML('result', RESULT_COLUMNS, resultData) +
        '</section>' +
        // 5. 相关工作
        '<section class="ah-section" id="related-work" data-section-key="related-work">' +
          '<div class="ah-section-head"><h3 class="ah-section-title">相关工作</h3><button class="btn" data-open-text="related-work" type="button">编辑</button></div>' +
          '<div class="mc-large-text">' + relatedWorkContent + '</div>' +
        '</section>' +
        // 6. 专业建设经验
        '<section class="ah-section" id="construction-experience" data-section-key="construction-experience">' +
          '<div class="ah-section-head"><h3 class="ah-section-title">专业建设经验</h3><button class="btn" data-table-add="experience" type="button">新增</button></div>' +
          crudTableHTML('experience', EXPERIENCE_COLUMNS, experienceData) +
        '</section>';

      anchorPanel.innerHTML = ANCHOR.map((s, i) =>
        '<a class="ah-anchor-item' + (i === 0 ? ' is-active' : '') + '" href="#' + s.key + '">' + s.title + '</a>'
      ).join('');
      bindAnchors();
    }

    function bindAnchors() {
      anchorPanel.querySelectorAll('.ah-anchor-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.preventDefault();
          const target = document.getElementById(item.getAttribute('href').slice(1));
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    }

    function updateFromScroll() {
      const sections = Array.from(mainContent.querySelectorAll('[data-section-key]'));
      if (!sections.length) return;
      const mainBox = mainContent.getBoundingClientRect();
      const scrollable = mainContent.scrollHeight > mainContent.clientHeight + 1;
      const atBottom = scrollable && mainContent.scrollTop + mainContent.clientHeight >= mainContent.scrollHeight - 2;
      let current = sections[0];
      if (atBottom) {
        current = sections[sections.length - 1];
      } else {
        sections.forEach(section => {
          const sectionTop = section.getBoundingClientRect().top - mainBox.top;
          if (sectionTop <= 64) current = section;
        });
      }
      const nextKey = current && current.getAttribute('data-section-key');
      if (nextKey) {
        anchorPanel.querySelectorAll('.ah-anchor-item').forEach(item =>
          item.classList.toggle('is-active', item.getAttribute('href') === '#' + nextKey)
        );
      }
    }

    mainContent.addEventListener('scroll', updateFromScroll, { passive: true });
    render();
    setTimeout(updateFromScroll, 0);

    // ===== 编辑状态管理 =====
    // 表格配置映射
    const TABLE_CONFIG = {
      'idea': { title: '建设理念', columns: IDEA_COLUMNS, get data() { return ideaData; }, set data(v) { ideaData = v; } },
      'result': { title: '成果', columns: RESULT_COLUMNS, get data() { return resultData; }, set data(v) { resultData = v; } },
      'experience': { title: '建设经验', columns: EXPERIENCE_COLUMNS, get data() { return experienceData; }, set data(v) { experienceData = v; } },
    };

    let editState = null; // { type: 'table', tableKey, item, isNew } | { type: 'form', formKey, fields } | { type: 'text', key }

    mainContent.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      if (btn.dataset.openForm) {
        const formKey = btn.dataset.openForm;
        const fields = formKey === 'basic-info' ? basicInfoFields : teamFields;
        editState = { type: 'form', formKey, fields: JSON.parse(JSON.stringify(fields)) };
        openFormModal('编辑' + (formKey === 'basic-info' ? '专业基本信息' : '队伍建设'));
      } else if (btn.dataset.openText) {
        editState = { type: 'text', key: btn.dataset.openText };
        textModalTitle.textContent = '编辑相关工作';
        textModalLabel.textContent = '相关工作内容';
        textModalTextarea.value = relatedWorkContent;
        textModal.classList.add('is-open');
      } else if (btn.dataset.tableAdd) {
        const tableKey = btn.dataset.tableAdd;
        const config = TABLE_CONFIG[tableKey];
        const item = { id: tableKey + '-' + Date.now() };
        config.columns.forEach(c => { item[c.key] = ''; });
        editState = { type: 'table', tableKey, item, isNew: true };
        openFormModal('新增' + config.title);
      } else if (btn.dataset.table) {
        const tableKey = btn.dataset.table;
        const action = btn.dataset.action;
        const id = btn.dataset.id;
        const config = TABLE_CONFIG[tableKey];
        const item = config.data.find(d => d.id === id);
        if (!item) return;
        if (action === 'edit') {
          editState = { type: 'table', tableKey, item: { ...item }, isNew: false };
          openFormModal('编辑' + config.title);
        } else if (action === 'delete') {
          editState = { type: 'delete', tableKey, id };
          deleteModalText.textContent = '确定要删除该' + config.title + '吗？此操作不可恢复。';
          deleteModal.classList.add('is-open');
        }
      }
    });

    function openFormModal(title) {
      editModalTitle.textContent = title;
      let fields;
      if (editState.type === 'form') {
        fields = editState.fields.map(f => ({ label: f.label, key: f.key, value: f.value, full: f.full, textarea: f.textarea }));
      } else {
        fields = TABLE_CONFIG[editState.tableKey].columns.map(c => ({ label: c.title, key: c.key, value: editState.item[c.key] || '', full: c.full, textarea: c.textarea }));
      }
      editModalForm.innerHTML = fields.map(f =>
        '<div class="form-field' + (f.full ? ' form-field--full' : '') + '">' +
          '<label class="form-field__label">' + f.label + '</label>' +
          (f.textarea
            ? '<textarea data-field-key="' + f.key + '" rows="4">' + (f.value || '') + '</textarea>'
            : '<input type="text" data-field-key="' + f.key + '" value="' + (f.value || '') + '" />') +
        '</div>'
      ).join('');
      editModal.classList.add('is-open');
    }

    editModalClose.addEventListener('click', () => editModal.classList.remove('is-open'));
    editModalCancel.addEventListener('click', () => editModal.classList.remove('is-open'));

    editModalOk.addEventListener('click', () => {
      if (!editState) return;
      const values = {};
      editModalForm.querySelectorAll('[data-field-key]').forEach(el => { values[el.dataset.fieldKey] = el.value; });

      if (editState.type === 'form') {
        const updated = editState.fields.map(f => ({ ...f, value: values[f.key] || f.value }));
        if (editState.formKey === 'basic-info') basicInfoFields = updated;
        else teamFields = updated;
      } else if (editState.type === 'table') {
        const config = TABLE_CONFIG[editState.tableKey];
        const item = { ...editState.item, ...values };
        if (editState.isNew) {
          config.data = [item, ...config.data];
        } else {
          config.data = config.data.map(d => d.id === item.id ? item : d);
        }
      }

      editModal.classList.remove('is-open');
      render();
      setTimeout(updateFromScroll, 0);
    });

    // ===== 大文本编辑 =====
    textModalClose.addEventListener('click', () => textModal.classList.remove('is-open'));
    textModalCancel.addEventListener('click', () => textModal.classList.remove('is-open'));
    textModalOk.addEventListener('click', () => {
      if (editState && editState.type === 'text') {
        relatedWorkContent = textModalTextarea.value;
        textModal.classList.remove('is-open');
        render();
        setTimeout(updateFromScroll, 0);
      }
    });

    // ===== 删除确认 =====
    deleteModalClose.addEventListener('click', () => deleteModal.classList.remove('is-open'));
    deleteModalCancel.addEventListener('click', () => deleteModal.classList.remove('is-open'));
    deleteModalOk.addEventListener('click', () => {
      if (editState && editState.type === 'delete') {
        const config = TABLE_CONFIG[editState.tableKey];
        config.data = config.data.filter(d => d.id !== editState.id);
        deleteModal.classList.remove('is-open');
        render();
        setTimeout(updateFromScroll, 0);
      }
    });
  </script>
</body>
</html>
