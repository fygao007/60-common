  - { source: 奖励情况, target: TeachingAchievement, records: 463, persons: 417, joinKey: 工号 }
  - { source: 人才信息, target: TalentTitle, records: 346, persons: 268, joinKey: 工号 }
  - { source: 教师资格证, target: TeacherCertificate, records: 1078, persons: 1074, joinKey: 工号 }
