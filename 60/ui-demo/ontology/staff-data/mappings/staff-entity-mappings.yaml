# ============================================================
# 三、映射规则
# ============================================================
mappingRules:
  - id: M1
    rule: 扩展表统一以工号关联 Person，不得用姓名关联
    reason: 姓名存在重名，工号唯一且非空

  - id: M2
    rule: 一张扩展表对应一个实体，多张考核表合并为 Assessment 并通过 assessmentType 区分
    reason: 三类考核结构高度一致，合并可避免实体膨胀

  - id: M3
    rule: 当前值（如当前职称、当前岗位）作为 Person 的派生属性，历史事实保留在对应实体中
    reason: 遵循本体设计原则第 3 条——当前状态由历史事实计算

  - id: M4
    rule: 职称（ProfessionalTitle）与聘岗（PositionAppointment）必须映射到不同实体
    reason: 遵循本体设计原则第 2 条与维度规则，资格与聘用不得互相覆盖

  - id: M5
    rule: 年龄等派生字段不入库，仅在查询时计算
    reason: 静态值会随时效失效

  - id: M6
    rule: restricted 级字段映射到独立存储区，不随 Person 主对象返回
    ref: governance/sensitive-fields.yaml

  - id: M7
    rule: 扩展表孤儿记录（工号不在主表）需在 ETL 阶段标记并告警，不得静默丢弃
    reason: 当前最多 24 条，静默丢弃会导致数据对不上

# ============================================================
# 四、待确认项
# ============================================================
openQuestions:
  - question: 主表"所在部门"为部门名称，需与 Organization 实体的编码建立映射
    impact: 影响按部门统计的准确性
    action: 需建立部门名称到组织代码的对照表
  - question: 聘岗信息与 EmploymentAssignment 实体的关系
    impact: 两个实体语义重叠
    action: 确认是否合并，或明确前者为现网事实、后者为标准模型
  - question: 班主任经历仅 6 条，与主表标记严重不匹配
    impact: 无法用于统计
    action: 确认数据完整性
