  - { source: 工作经历, target: WorkExperience, records: 11281, persons: 2417, joinKey: 工号 }
  - { source: 职称资格, target: ProfessionalTitle, records: 4992, persons: 2904, joinKey: 工号 }
  - { source: 聘岗信息, target: PositionAppointment, records: 3424, persons: 3418, joinKey: 工号 }
  - { source: 学年（年度）考核, target: Assessment, records: 20540, persons: 3668, joinKey: 工号, assessmentType: 学年考核 }
  - { source: 师德考核, target: Assessment, records: 20539, persons: 3668, joinKey: 工号, assessmentType: 师德考核 }
  - { source: 聘期考核, target: Assessment, records: 4965, persons: 3088, joinKey: 工号, assessmentType: 聘期考核 }
  - { source: 政治面貌, target: PoliticalStatus, records: 3901, persons: 3845, joinKey: 工号 }
