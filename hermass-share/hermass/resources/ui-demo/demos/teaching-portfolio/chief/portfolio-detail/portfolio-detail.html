<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教学档案袋 · 教师档案详情</title>
  <style>
    :root { --mp-border: #eeeef0; --mp-radius: 8px; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; font-family: var(--ds-font-family); color: #1f2937; }
    .ds-scope { min-height: 100vh; background: #fff; }

    /* 标题行（二级页面：对齐 audit 详情页） */
    .pd-header-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 24px; background: #fff;
      border-bottom: 1px solid var(--mp-border);
    }
    .pd-header-row .pd-title { flex: 1; margin: 0; font-size: 20px; font-weight: 600; color: #000; }
    .pd-back { display: inline-flex; align-items: center; gap: 4px; color: #000; font-size: 14px; cursor: pointer; background: none; border: none; padding: 0; }
    .pd-back:hover { color: var(--ds-color-primary); }
    .pd-back__icon { width: 20px; height: 20px; }
    .pd-header-divider { width: 1px; height: 20px; background: var(--mp-border); }
    .pd-btn {
      height: 32px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--mp-border);
      background: #fff; color: #1f2937; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .pd-btn:hover { border-color: #c5c8d4; }
    .pd-btn--primary { background: #3167ff; border-color: #3167ff; color: #fff; }
    .pd-btn--primary:hover { background: #255ae0; border-color: #255ae0; }

    /* 主体布局（对齐 teaching-info 二级页：左栏细分割线 + 右栏平铺） */
    .pd-layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 0; padding: 0 24px 32px; align-items: stretch; min-height: calc(100vh - 144px); }
    .pd-layout > .pd-card { background: #fff; border: 0; border-radius: 0; min-width: 0; min-height: 0; }
    /* 左：课程栏 */
    .pd-layout > .pd-card:first-child {
      overflow-y: auto; overscroll-behavior: contain;
      padding: 20px 12px 32px 16px;
      border-right: 1px solid var(--mp-border);
    }
    /* 右：详情栏 */
    .pd-layout > .pd-card:last-child {
      display: flex; flex-direction: column; min-height: 0;
      padding: 8px 0 40px 16px;
    }
    .pd-pane-head { display: flex; align-items: center; gap: 12px; padding: 0; margin-bottom: 12px; }
    .pd-pane-head .pd-select { width: 100%; height: 32px; border: 1px solid #dcdce0; border-radius: 4px; padding: 0 10px; font-size: 14px; background: #fff; color: #000; cursor: pointer; }
    .pd-pane-head .pd-select:focus { outline: none; border-color: #3167ff; }
    .pd-search-wrap { position: relative; flex: 1; display: flex; align-items: center; }
    .pd-search { width: 100%; height: 32px; border: 1px solid #dcdce0; border-radius: 4px; padding: 0 34px 0 10px; font-size: 14px; box-sizing: border-box; }
    .pd-search:focus { outline: none; border-color: #3167ff; }
    .pd-search-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #9094a6; pointer-events: none; }
    .pd-search:focus + .pd-search-icon { color: #3167ff; }

    /* 课程列表 */
    .pd-course-list { display: grid; gap: 12px; margin-top: 6px; }
    .pd-course-card { display: grid; gap: 14px; padding: 18px; color: #000; border: 2px solid var(--mp-border); border-radius: 8px; background: #fff; cursor: pointer; transition: border-color .15s, background .15s; }
    .pd-course-card:hover { border-color: #c5c8d4; }
    .pd-course-card.is-active { border-color: #3167ff; background: linear-gradient(180deg, #f0f6ff, #fff); }
    .pd-course-card h3 { margin: 0; font-size: 16px; font-weight: 600; color: #000; line-height: 1.5; }
    .pd-course-tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .pd-course-tags span { display: inline-flex; align-items: center; min-height: 32px; padding: 0 14px; font-size: 14px; color: #505266; background: #f9fafb; border-radius: 4px; }
    .pd-course-fields { margin: 6px 0 0; display: grid; gap: 14px; }
    .pd-course-fields div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 18px; align-items: center; font-size: 14px; }
    .pd-course-fields dt { color: #9094a6; margin: 0; }
    .pd-course-fields dd { margin: 0; color: #1f2937; }

    /* 详情区 */
    .pd-detail { display: flex; flex-direction: column; min-height: 0; }
    .pd-tabs { display: flex; width: max-content; max-width: 100%; gap: 2px; padding: 2px; margin-bottom: 16px; background: #f9fafb; border-radius: 6px; overflow-x: auto; scrollbar-width: none; }
    .pd-tabs::-webkit-scrollbar { display: none; }
    .pd-tab { height: 28px; padding: 3px 12px; font-size: 14px; color: #505266; cursor: pointer; border: 0; border-radius: 4px; background: transparent; white-space: nowrap; display: inline-flex; align-items: center; }
    .pd-tab:hover { color: #000; background: #fff; }
    .pd-tab.is-active { color: #3167ff; background: #fff; font-weight: 600; }

    .pd-section { margin-bottom: 20px; }
    .pd-section-head { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-bottom: 12px; padding: 0 16px; background: linear-gradient(90deg, #f0f6ff, #fff); border-radius: 4px; }
    .pd-section-head h3 { margin: 0; font-size: 16px; font-weight: 600; color: #000; }

    /* 只读表单（一行一列） */
    .pd-form { display: grid; grid-template-columns: 1fr; gap: 0; border: 1px solid var(--mp-border); border-radius: 6px; overflow: hidden; }
    .pd-form.full { grid-template-columns: 1fr; }
    .pd-field { display: flex; border-bottom: 1px solid var(--mp-border); border-right: 1px solid var(--mp-border); }
    .pd-field.full { grid-column: 1 / -1; }
    .pd-field__label { width: 110px; flex: none; padding: 10px 12px; background: #fafbfc; font-size: 13px; border-right: 1px solid var(--mp-border); }
    .pd-field__value { flex: 1; padding: 10px 12px; font-size: 13px; color: #1f2937; }

    /* 文本展示框 */
    .pd-box { padding: 12px 14px; background: #fafbfc; border: 1px solid var(--mp-border); border-radius: 6px; font-size: 13px; line-height: 1.7; color: #1f2937; }
    .pd-box--lg { min-height: 80px; }

    /* 教学实施卡片 */
    .pd-plan { border: 1px solid var(--mp-border); border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
    .pd-plan__head { display: flex; align-items: center; gap: 16px; padding: 10px 14px; background: #fafbfc; cursor: pointer; font-size: 13px; }
    .pd-plan__head b { color: #3167ff; font-variant-numeric: tabular-nums; }
    .pd-plan__body { padding: 12px 14px; border-top: 1px solid var(--mp-border); display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
    .pd-plan__body .full { grid-column: 1 / -1; }
    .pd-plan__body div { display: flex; gap: 8px; font-size: 13px; }
    .pd-plan__body dt { color: #9094a6; margin: 0; }
    .pd-plan__body dd { margin: 0; color: #1f2937; }

    /* 表格 */
    .pd-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .pd-table th, .pd-table td { border: 1px solid var(--mp-border); padding: 8px 10px; text-align: left; vertical-align: top; }
    .pd-table th { background: #fafbfc; color: #505266; font-weight: 600; white-space: nowrap; }
    .pd-table td { color: #1f2937; }

    .pd-empty { padding: 40px; text-align: center; color: #9094a6; font-size: 14px; }

    /* 抽屉 */
    .pd-drawer-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; z-index: 100; }
    .pd-drawer-mask.open { display: block; }
    .pd-drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 100vw; max-width: 1100px; background: #fff; z-index: 101; display: none; flex-direction: column; }
    .pd-drawer.open { display: flex; }
    .pd-drawer__head { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--mp-border); }
    .pd-drawer__head h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .pd-drawer__close { margin-left: auto; width: 32px; height: 32px; border: 1px solid var(--mp-border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 16px; color: #505266; }
    .pd-drawer__tabs { display: flex; gap: 4px; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--mp-border); flex-wrap: wrap; }
    .pd-drawer__body { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }

    .pd-archive-head { font-size: 16px; font-weight: 600; color: #1f2937; padding-left: 10px; border-left: 4px solid #3167ff; margin: 0 0 14px; }
    .pd-archive-sub { margin-bottom: 22px; }
    .pd-archive-sub__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .pd-archive-sub__title { font-size: 14px; font-weight: 600; color: #1f2937; padding-left: 9px; border-left: 3px solid #9db4ff; margin: 0; }
    .pd-archive-source { font-size: 12px; color: #9094a6; }
  </style>
</head>
<body>
  <div class="ds-scope">
    <div class="pd-header-row">
      <button class="pd-back" type="button" onclick="goBack()">
        <svg class="pd-back__icon" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

          </div>
        </div>
        <div class="pd-course-list" id="courseList"></div>
      </aside>

      <!-- 右：教学信息 -->
      <section class="pd-card">
        <div class="pd-detail">
          <div class="pd-tabs" id="tiTabs"></div>
          <div id="tiBody"></div>
        </div>
      </section>
    </div>
  </div>

  <!-- 查看更多 抽屉 -->

    <div class="pd-drawer__body" id="drawerBody"></div>

    expandedPlans: {}
  };

  function getCourses() {
    var list = COURSES_BY_SEMESTER[state.semester] || BASE_COURSES;
    if (!state.search.trim()) return list;
    var q = state.search.trim().toLowerCase();
    return list.filter(function (c) { return c.name.toLowerCase().indexOf(q) >= 0; });
  }
  function getSelectedCourse() {
    var list = getCourses();
    return list.filter(function (c) { return c.id === state.selectedCourseId; })[0] || list[0] || BASE_COURSES[0];
  }

  // ========== 渲染：标题 / 学期 ==========
  function renderTitle() {
    var t = TEACHER_MAP[state.teacherCode] || TEACHER_MAP[Object.keys(TEACHER_MAP)[0]];
    document.getElementById('pdTitle').textContent = state.teacherName + ' ' + t.code;
    document.getElementById('drawerTitle').textContent = state.teacherName + ' · 教学档案详情';
  }
  function renderSemester() {
    document.getElementById('semesterSel').innerHTML = SEMESTER_OPTIONS.map(function (o) {
      return '<option value="' + o.value + '"' + (o.value === state.semester ? ' selected' : '') + '>' + o.label + '</option>';
    }).join('');
  }

  // ========== 渲染：课程列表 ==========
  function renderCourseList() {
    var list = getCourses();
    var box = document.getElementById('courseList');
    if (list.length === 0) { box.innerHTML = '<div class="pd-empty">未找到相关课程</div>'; return; }
    box.innerHTML = list.map(function (c) {
      var active = c.id === state.selectedCourseId ? ' is-active' : '';
      var fields = active ? '<dl class="pd-course-fields"><div><dt>课程号</dt><dd>' + c.code + '</dd></div><div><dt>承担单位</dt><dd>' + c.owner + '</dd></div><div><dt>课程性质</dt><dd>' + c.nature + '</dd></div></dl>' : '';
      return '<div class="pd-course-card' + active + '" onclick="selectCourse(\'' + c.id + '\')"><h3>' + c.name + '</h3><div class="pd-course-tags">' + c.tags.map(function (t) { return '<span>' + t + '</span>'; }).join('') + '</div>' + fields + '</div>';
    }).join('');
  }

  // ========== 渲染：页签 ==========
  function renderTabs() {
    document.getElementById('tiTabs').innerHTML = TI_TABS.map(function (t) {
      return '<div class="pd-tab' + (t.key === state.activeTab ? ' is-active' : '') + '" onclick="setTab(\'' + t.key + '\')">' + t.label + '</div>';
    }).join('');
  }

  // ========== 渲染：详情主体 ==========
  function field(label, value, full) {
    return '<div class="pd-field' + (full ? ' full' : '') + '"><div class="pd-field__label">' + label + '</div><div class="pd-field__value">' + (value || '-') + '</div></div>';
  }
  function renderCourseInfo(c) {
    return '<div class="pd-section"><div class="pd-section-head"><h3>课程信息</h3><span class="pd-archive-source">来源：教务系统</span></div>' +
      '<div class="pd-form">' +
      field('课程号', c.code) + field('课程名', c.name) +
      field('课序号', c.sequence) + field('承担单位', c.owner) +
      field('授课形式', c.teachingForm) + field('课程类别', c.category) +
      field('课程性质', c.nature) + field('授课班级', c.className) +
      field('学分', c.credits) + field('学时', c.hours) +
      field('选课人数', c.students) + field('考试类型', c.examType) +
      field('教学方式', c.teachingMode, true) + field('附件', '-', true) +
      '</div></div>';
  }
  function renderDesign(c) {
    var baseGroups = [
      { t: '教学方式', v: DESIGN_BASE.way },
      { t: '教学目标', v: DESIGN_BASE.goal },
      { t: '教学实施', v: DESIGN_BASE.plan },
      { t: '学情分析', v: DESIGN_BASE.analysis }
    ];
    var baseHtml = baseGroups.map(function (g) {
      return '<div class="pd-section"><div class="pd-section-head"><h3>' + g.t + '</h3></div><div class="pd-box">' + g.v + '</div></div>';
    }).join('');
    var plans = TEACHING_PLANS[c.id] || [];
    var planHtml = plans.map(function (p, i) {
      var open = state.expandedPlans[p.date] !== false;
      var body = open ? '<div class="pd-plan__body">' +
        '<div><dt>教学类型</dt><dd>' + (p.teachingType || '-') + '</dd></div>' +
        '<div><dt>教学方式</dt><dd>' + (p.teachingMethod || '-') + '</dd></div>' +
        '<div class="full"><dt>上课内容</dt><dd>' + (p.content || '-') + '</dd></div>' +
        '<div><dt>上课地点</dt><dd>' + (p.location || '-') + '</dd></div>' +
        '<div><dt>信息化教学工具</dt><dd>' + (p.tools || '-') + '</dd></div>' +
        '<div class="full"><dt>课程资源</dt><dd>' + (p.resources.length ? p.resources.join('、') : '-') + '</dd></div>' +
        '<div class="full"><dt>教学随笔</dt><dd>' + (p.reflection || '-') + '</dd></div>' +
        '<div class="full"><dt>课程思政</dt><dd>' + (p.ideology || '-') + '</dd></div>' +
        '</div>' : '';
      return '<div class="pd-plan"><div class="pd-plan__head" onclick="togglePlan(\'' + p.date + '\')">' +
        '<span>上课日期：<b>' + p.date + '</b></span><span>周次：' + p.week + '</span><span>星期：' + p.weekday + '</span><span>学时：<b>' + p.hours + '</b></span>' +
        '</div>' + body + '</div>';
    }).join('') || '<div class="pd-empty">暂无教学实施记录</div>';
    return baseHtml +
      '<div class="pd-section"><div class="pd-section-head"><h3>教学实施</h3></div>' + planHtml + '</div>' +
      '<div class="pd-section"><div class="pd-section-head"><h3>教学改革与创新</h3></div><div class="pd-box pd-box--lg">' + DESIGN_BASE.innovation + '</div></div>' +
      '<div class="pd-section"><div class="pd-section-head"><h3>附件</h3></div><div class="pd-box">拖拽至此处，或点击上传</div></div>';
  }
  function renderIdeology(c) {
    return '<div class="pd-section"><div class="pd-section-head"><h3>思政元素</h3></div><div class="pd-box">工匠精神、职业道德、创新精神、劳动精神、安全规范意识</div></div>' +
      '<div class="pd-section"><div class="pd-section-head"><h3>思政教学内容</h3></div><div class="pd-box pd-box--lg">' + buildSectionText('ideology-content', c.name) + '</div></div>';
  }
  function renderCare(c) {
    return '<div class="pd-section"><div class="pd-section-head"><h3>课程目标</h3><span class="pd-archive-source">来源：教务系统</span></div><div class="pd-box pd-box--lg">' + buildSectionText('goal', c.name) + '</div></div>' +
      '<div class="pd-section"><div class="pd-section-head"><h3>辅导学生</h3></div><div class="pd-box pd-box--lg">' + buildSectionText('student-help', c.name) + '</div></div>' +
      '<div class="pd-section"><div class="pd-section-head"><h3>个性化案例</h3></div><div class="pd-box pd-box--lg">' + buildSectionText('student-case', c.name) + '</div></div>';
  }
  function renderEffect(c) {
    var rate = c.id === 'data-structure' ? '98%' : '96%';
    var score = c.id === 'data-structure' ? '--' : '86.5';
    return '<div class="pd-section"><div class="pd-section-head"><h3>教学信息</h3><span class="pd-archive-source">来源：教务系统</span></div><div class="pd-form">' + field('上课率', rate) + field('平均成绩', score) + '</div></div>' +
      '<div class="pd-section"><div class="pd-section-head"><h3>学生代表性作业</h3></div><div class="pd-box">课件.pdf（3.6KB）</div></div>';
  }
  function renderEvaluation(c) {
    return '<div class="pd-section"><div class="pd-section-head"><h3>学生评价</h3><span class="pd-archive-source">来源：教务系统</span></div><div class="pd-box pd-box--lg">' + buildSectionText('student-evaluation', c.name) + '</div></div>' +
      '<div class="pd-section"><div class="pd-section-head"><h3>督导评价</h3><span class="pd-archive-source">来源：教务系统</span></div><div class="pd-box pd-box--lg">' + buildSectionText('supervisor-evaluation', c.name) + '</div></div>' +
      '<div class="pd-section"><div class="pd-section-head"><h3>同行评价</h3><span class="pd-archive-source">来源：教务系统</span></div><div class="pd-box pd-box--lg">' + buildSectionText('peer-evaluation', c.name) + '</div></div>';
  }
  function renderReflection(c) {
    return '<div class="pd-section"><div class="pd-section-head"><h3>教学反思</h3></div><div class="pd-box pd-box--lg">' + buildSectionText('teaching-reflection', c.name) + '</div></div>' +
      '<div class="pd-section"><div class="pd-section-head"><h3>优化措施</h3></div><div class="pd-box pd-box--lg">' + buildSectionText('optimization', c.name) + '</div></div>';
  }
  function renderSummary(c) {
    return '<div class="pd-section"><div class="pd-section-head"><h3>课程总结</h3></div><div class="pd-box pd-box--lg">' + buildSectionText('course-summary', c.name) + '</div></div>' +
      '<div class="pd-section"><div class="pd-section-head"><h3>课程总结附件</h3></div><div class="pd-box">课件.pdf（3.6KB）</div></div>';
  }
  function renderMaterials(c) {
    return '<div class="pd-section"><div class="pd-section-head"><h3>课程资料</h3></div><div class="pd-box">拖拽至此处，或点击上传附件</div></div>';
  }

  function renderBody() {
    var c = getSelectedCourse();
    var html = '';
    switch (state.activeTab) {
      case 'courseInfo': html = renderCourseInfo(c); break;
      case 'design': html = renderDesign(c); break;
      case 'ideology': html = renderIdeology(c); break;
      case 'care': html = renderCare(c); break;
      case 'effect': html = renderEffect(c); break;
      case 'evaluation': html = renderEvaluation(c); break;
      case 'reflection': html = renderReflection(c); break;
      case 'summary': html = renderSummary(c); break;
      case 'materials': html = renderMaterials(c); break;
    }
    document.getElementById('tiBody').innerHTML = html;
  }

  // ========== 抽屉：8 档案分组 ==========
  var ARCHIVE_TABS = [

      { label: '毕业院校', value: '华南理工大学' }, { label: '所学专业', value: '信息与通信工程' },
      { label: '海外学习经历', value: '2023-10 至 2024-04，英国伦敦大学学院访学', full: true }
    ] },
    { title: '职称信息', source: '人事系统', items: [

      { label: '专业领域', value: '主要从事人工智能与软件工程、智慧教学平台建设、职业教育数字化等领域的教学与研究。', full: true },

      { label: '双师等级', value: '高级' }, { label: '双师认定年份', value: '2024' },
      { label: '技能等级证书', value: '软件设计师（中级）', full: true }
    ] }
  ];

  var TABLE_SECTIONS = {
    'enterprise-practice': [
      { title: '企业实践', columns: ['企业名称', '所属行业', '实践开始时间', '实践结束时间', '实践内容'], rows: [

        ['深圳云启工业互联网有限公司', '科技行业', '2024-07-01', '2024-08-30', '参与工业互联网平台项目调研，了解设备数据采集与边缘网关配置。']

    'achievements-honors': [
      { title: '教研项目', columns: ['项目名称', '项目类型', '开始时间', '结束时间', '本人角色'], rows: [

      ] },
      { title: '获奖', columns: ['获奖成果名称', '奖励名称', '获奖级别', '获奖日期', '颁奖单位'], rows: [
        ['职业教育智能学习分析平台建设', '广东省教学成果奖', '省级二等奖', '2025-09-10', '广东省教育厅'],
        ['课程画像驱动的教学改进实践', '深圳市教育教学创新奖', '市级一等奖', '2024-12-20', '深圳市教育局']
      ] },
      { title: '论文', columns: ['论文名称', '刊物名称', '刊物级别', '发表日期', '本人排名'], rows: [
        ['基于学习画像的高职课程质量改进研究', '职业技术教育', '中文核心', '2025-04-12', '1/4']
      ] }
    ],
    'training': [
      { title: '培训', columns: ['培训名称', '培训级别', '培训年度', '学时', '组织单位'], rows: [
        ['高等职业教育教学能力提升培训', '国家级', '2025', '40', '教育部']
      ] },

      ] }
    ],

        ['中小企业数字化转型咨询', '横向课题', '市级', '2024-05-01', '2024-12-31']
      ] },
      { title: '专家聘任', columns: ['任职机构名称', '任职类型', '任职级别', '入选日期'], rows: [

      ] }
    ],

      ] },
      { title: '指导新教师情况', columns: ['新教师名称', '指导周期', '指导开始日期', '指导结束日期'], rows: [
        ['李敏', '一年', '2024-09-01', '2025-08-31']
      ] }
    ],
    'other-education': [
      { title: '第二课堂教学', columns: ['活动名称', '类型', '时间', '人数', '成果'], rows: [

      ] },
      { title: '毕业设计指导', columns: ['学生名称', '课题名称', '指导类型', '成果形式', '成绩'], rows: [
        ['陈晨', '基于Vue的教务管理系统设计与实现', '毕业设计', '应用系统', '优秀']
      ] }
    ]
  };

  function renderFormGroup(g) {
    var items = g.items.map(function (it) {
      return '<div class="pd-field' + (it.full ? ' full' : '') + '"><div class="pd-field__label">' + it.label + '</div><div class="pd-field__value">' + it.value + '</div></div>';
    }).join('');
    return '<div class="pd-archive-sub"><div class="pd-archive-sub__head"><h4 class="pd-archive-sub__title">' + g.title + '</h4><span class="pd-archive-source">来源：' + g.source + '</span></div><div class="pd-form">' + items + '</div></div>';
  }
  function renderTableSection(s) {
    var head = '<tr>' + s.columns.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>';
    var rows = s.rows.map(function (r) {
      return '<tr>' + r.map(function (v) { return '<td>' + v + '</td>'; }).join('') + '</tr>';
    }).join('');
    return '<div class="pd-archive-sub"><div class="pd-archive-sub__head"><h4 class="pd-archive-sub__title">' + s.title + '</h4></div><table class="pd-table"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>';
  }

  function renderDrawerBody() {
    var key = state.drawerTab;
    var html = '';
    if (key === 'basic-info') {
      html = BASIC_INFO_GROUPS.map(renderFormGroup).join('');
    } else if (key === 'teaching-info') {
      html = '<div class="pd-empty">暂无数据</div>';
    } else {
      html = (TABLE_SECTIONS[key] || []).map(renderTableSection).join('');
    }
    document.getElementById('drawerBody').innerHTML = html;
  }
  function renderDrawerTabs() {
    document.getElementById('drawerTabs').innerHTML = ARCHIVE_TABS.map(function (t) {
      return '<div class="pd-tab' + (t.key === state.drawerTab ? ' is-active' : '') + '" onclick="setDrawerTab(\'' + t.key + '\')">' + t.label + '</div>';
    }).join('');
  }

  // ========== 交互 ==========
  function selectCourse(id) { state.selectedCourseId = id; renderCourseList(); renderBody(); }
  function setTab(key) { state.activeTab = key; renderTabs(); renderBody(); }
  function onSemester(v) {
    state.semester = v; state.search = '';
    var list = COURSES_BY_SEMESTER[v] || BASE_COURSES;
    state.selectedCourseId = list[0].id;
    document.getElementById('courseSearch').value = '';
    renderCourseList(); renderBody();
  }
  function onSearch(v) {
    state.search = v;
    var list = getCourses();
    if (list.length) state.selectedCourseId = list[0].id;
    renderCourseList(); renderBody();
  }
  function togglePlan(date) { state.expandedPlans[date] = state.expandedPlans[date] === false; renderBody(); }
  function setDrawerTab(key) { state.drawerTab = key; renderDrawerTabs(); renderDrawerBody(); }
  function openDrawer() { document.getElementById('drawer').classList.add('open'); document.getElementById('drawerMask').classList.add('open'); }
  function closeDrawer() { document.getElementById('drawer').classList.remove('open'); document.getElementById('drawerMask').classList.remove('open'); }
  function goBack() {  }

  // ========== 初始化 ==========
  function init() {
    var params = new URLSearchParams(window.location.search);
    state.teacherCode = params.get('teacher') || '';
    var t = TEACHER_MAP[state.teacherCode] || TEACHER_MAP[Object.keys(TEACHER_MAP)[0]];
    state.teacherName = t.name;
    renderTitle();
    renderSemester();
    renderCourseList();
    renderTabs();
    renderBody();
    renderDrawerTabs();
    renderDrawerBody();
  }
  init();
  </script>
</body>
</html>
