<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>企业实践</title>
  <link rel="stylesheet" href="../../../../assets/tokens.css" />
  <link rel="stylesheet" href="../../../../assets/base.css" />
  <link rel="stylesheet" href="../../../../assets/theme.css" />
  <style>
    body { margin: 0; background: #fff; }
    .ds-scope, .ds-page { background: #fff; }

    .ep-page { height: 100%; min-height: 0; background: var(--ds-color-bg-container); }
    .ep-content-card { width: 100%; min-height: calc(100vh - 92px); background: var(--ds-color-bg-container); }

    .ep-top-header { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--ds-color-border-secondary); }
    .ep-back-btn { display: inline-flex; align-items: center; gap: 4px; color: #000; font-size: 14px; cursor: pointer; background: none; border: none; padding: 0; }
    .ep-back-btn:hover { color: var(--ds-color-primary); }
    .ep-back-btn svg { width: 20px; height: 20px; }
    .ep-header-divider { width: 1px; height: 20px; background: #eeeef0; }
    .ep-header-title { margin: 0; font-size: 20px; font-weight: 600; color: #000; }

    .ep-records { padding: 24px; }

    .ep-section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .ep-section-title { display: flex; align-items: center; gap: 10px; margin: 0; color: #000; font-size: 16px; font-weight: 500; }
    .ep-section-title::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: var(--ds-color-primary); }
    .ep-source-note { display: inline-flex; align-items: center; color: var(--ds-color-text-secondary); font-size: 13px; white-space: nowrap; }
    .ep-source-note strong { color: #000; font-weight: 600; }

    /* 时间轴 */
    .ep-timeline { display: flex; flex-direction: column; }
    .ep-timeline-item { position: relative; display: flex; gap: 16px; padding-bottom: 24px; }
    .ep-timeline-item:last-child { padding-bottom: 0; }
    .ep-timeline-dot { position: relative; flex: none; width: 12px; }
    .ep-timeline-dot::before { content: ""; position: absolute; left: 0; top: 24px; width: 12px; height: 12px; border-radius: 50%; background: var(--ds-color-primary); box-shadow: 0 0 0 3px var(--ds-color-primary-light); }
    .ep-timeline-item:not(:last-child) .ep-timeline-dot::after { content: ""; position: absolute; left: 5px; top: 40px; bottom: -8px; width: 2px; background: var(--ds-color-border-secondary); }

    /* 实践卡片 */
    .ep-practice-card { flex: 1; min-width: 0; border: 1px solid var(--ds-color-border-secondary); border-radius: 8px; background: var(--ds-color-bg-container); overflow: hidden; }
    .ep-practice-card__head { padding: 16px 20px; border-bottom: 1px solid var(--ds-color-border-secondary); background: linear-gradient(90deg, var(--ds-color-primary-light), var(--ds-color-bg-container)); }
    .ep-practice-card__head h3 { margin: 0 0 10px; color: #000; font-size: 16px; font-weight: 600; }
    .ep-practice-meta { display: flex; flex-wrap: wrap; gap: 8px 24px; }
    .ep-practice-meta span { color: var(--ds-color-text-secondary); font-size: 13px; }
    .ep-practice-meta strong { color: #000; font-weight: 500; margin-left: 4px; }
    .ep-practice-card__body { display: grid; gap: 16px; padding: 16px 20px; }

    .ep-practice-block__title { position: relative; margin-bottom: 8px; padding-left: 10px; color: #000; font-size: 14px; font-weight: 500; }
    .ep-practice-block__title::before { content: ""; position: absolute; top: 50%; left: 0; width: 3px; height: 14px; border-radius: 2px; background: var(--ds-color-primary); transform: translateY(-50%); }
    .ep-practice-block__content { color: var(--ds-color-text-secondary); font-size: 14px; line-height: 1.75; }

    @media (max-width: 640px) {
      .ep-records { padding: 16px; }
      .ep-practice-meta { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <div class="ds-scope ep-page" id="app">
    <div class="ep-content-card">
      <div class="ep-top-header">
        <button class="ep-back-btn" id="backBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          返回
        </button>
        <div class="ep-header-divider"></div>
        <h1 class="ep-header-title">企业实践</h1>
      </div>
      <section class="ep-records" id="enterprise-practice-records">
        <div class="ep-section-head">
          <h2 class="ep-section-title">企业实践记录</h2>
          <span class="ep-source-note">数据来源于<strong>人事系统</strong>，<a class="ep-edit-link" href="#">去纠错或补录</a></span>
        </div>
        <div class="ep-timeline" aria-label="企业实践经历时间轴" id="timeline"></div>
      </section>
    </div>
  </div>

  <style>
    .ep-edit-link { color: var(--ds-color-primary); font-size: 13px; text-decoration: none; }
    .ep-edit-link:hover { text-decoration: underline; }
  </style>

  <script>
    const PRACTICES = [
      { id: 'practice-2025-smart-hardware', company: '联科精密电子股份有限公司', code: '91440300MA5K1C8X6L', industry: '科技行业', startDate: '2025-01-01', endDate: '2025-02-01', content: '参与智能硬件测试流程、生产现场工艺诊断与岗位能力调研，跟岗了解企业真实生产任务、质量控制要求和技术岗位协作流程。', result: '形成智能硬件测试岗位能力分析报告，完成企业测试流程优化建议 1 项，并沉淀可用于课堂教学的真实任务案例。', transfer: '更新《嵌入式系统开发》项目案例 2 个，补充企业真实测试任务单、岗位能力评价表和课堂实践指导材料。' },
      { id: 'practice-2024-industrial-internet', company: '深圳云启工业互联网有限公司', code: '91440300MA5L9F2P3Q', industry: '科技行业', startDate: '2024-07-01', endDate: '2024-08-30', content: '参与工业互联网平台项目调研，了解设备数据采集、边缘网关配置、生产数据看板和企业数字化改造实施流程。', result: '完成企业数字化岗位能力画像，梳理工业互联网平台课程案例，形成校企协同实践任务清单。', transfer: '将设备数据采集、异常诊断和看板配置转化为课程综合实训项目，补充课堂演示数据与考核 rubrics。' },
      { id: 'practice-2023-ai-platform', company: '鹏城智慧教育科技有限公司', code: '91440300MA5H7N8R2T', industry: '科技行业', startDate: '2023-12-01', endDate: '2024-01-15', content: '参与智慧教学平台功能验证、课堂学习数据分析和产品需求评审，重点了解教育技术产品从需求到交付的全流程。', result: '沉淀智慧教学平台应用案例，完善学习过程数据采集与课堂反馈分析方法。', transfer: '转化为信息化教学工具应用专题，纳入课程资源建设和教师教学改进材料。' },
    ];

    const SORTED_PRACTICES = [...PRACTICES].sort((a, b) => new Date(b.startDate).getTime() - new Date(a.startDate).getTime());


    document.getElementById('timeline').innerHTML = SORTED_PRACTICES.map(item =>
      '<div class="ep-timeline-item">' +
        '<span class="ep-timeline-dot" aria-hidden="true"></span>' +
        '<article class="ep-practice-card" id="' + item.id + '">' +
          '<div class="ep-practice-card__head">' +
            '<h3>' + item.company + '（' + item.code + '）</h3>' +
            '<div class="ep-practice-meta" aria-label="企业实践关键信息">' +
              '<span>所属行业<strong>' + item.industry + '</strong></span>' +
              '<span>实践开始时间<strong>' + item.startDate + '</strong></span>' +
              '<span>实践结束时间<strong>' + item.endDate + '</strong></span>' +
            '</div>' +
          '</div>' +
          '<div class="ep-practice-card__body">' +
            '<div class="ep-practice-block"><div class="ep-practice-block__title">实践内容</div><div class="ep-practice-block__content">' + item.content + '</div></div>' +
            '<div class="ep-practice-block"><div class="ep-practice-block__title">实践成果</div><div class="ep-practice-block__content">' + item.result + '</div></div>' +
            '<div class="ep-practice-block"><div class="ep-practice-block__title">转化内容</div><div class="ep-practice-block__content">' + item.transfer + '</div></div>' +
          '</div>' +
        '</article>' +
      '</div>'
    ).join('');
  </script>
</body>
</html>
