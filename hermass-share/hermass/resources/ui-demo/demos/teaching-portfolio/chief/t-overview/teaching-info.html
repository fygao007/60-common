<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教学信息</title>
  <link rel="stylesheet" href="../../../../assets/tokens.css" />
  <link rel="stylesheet" href="../../../../assets/base.css" />
  <link rel="stylesheet" href="../../../../assets/theme.css" />
  <link rel="stylesheet" href="../../../../packages/design-system/src/Upload/index.css" />
  <style>
    body { margin: 0; background: #fff; }
    .ds-scope, .ds-page { background: #fff; }

    .ti-page { height: 100%; min-height: 0; background: var(--ds-color-bg-container); }
    .ti-content-card { width: 100%; height: calc(100vh - 92px); min-height: 0; overflow: hidden; background: var(--ds-color-bg-container); }

    /* 顶部返回头 */
    .ti-top-header { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--ds-color-border-secondary); }
    .ti-back-btn { display: inline-flex; align-items: center; gap: 4px; color: #000; font-size: 14px; cursor: pointer; background: none; border: none; padding: 0; }
    .ti-back-btn:hover { color: var(--ds-color-primary); }
    .ti-back-btn svg { width: 20px; height: 20px; }
    .ti-header-divider { width: 1px; height: 20px; background: #eeeef0; }
    .ti-header-title { margin: 0; font-size: 20px; font-weight: 600; color: #000; }

    /* 布局 */
    .ti-layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); height: calc(100vh - 144px); min-height: 0; overflow: hidden; }

    /* 左侧课程栏 */
    .ti-course-pane { min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 20px 12px 32px 16px; border-right: 1px solid var(--ds-color-border-secondary); background: var(--ds-color-bg-container); }
    .ti-filter-head { margin-bottom: 12px; }
    .ti-semester-select { width: 100%; height: 32px; padding: 0 10px; border: 1px solid #dcdce0; border-radius: 4px; font-size: 14px; background: #fff; color: #000; cursor: pointer; }
    .ti-semester-select:focus { outline: none; border-color: var(--ds-color-primary); box-shadow: 0 0 0 2px var(--ds-color-focus-ring); }

    .ti-search-box { display: flex; margin-bottom: 18px; }
    .ti-search-input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid #dcdce0; border-radius: 4px 0 0 4px; font-size: 14px; }
    .ti-search-input:focus { outline: none; border-color: var(--ds-color-primary); }
    .ti-search-btn { flex: none; width: 40px; height: 32px; margin-left: -1px; border: 1px solid #dcdce0; border-radius: 0 4px 4px 0; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #505266; }
    .ti-search-btn:hover { color: var(--ds-color-primary); border-color: var(--ds-color-primary); }

    .ti-course-list { display: grid; gap: 12px; }
    .ti-empty-state { padding: 32px 16px; color: var(--ds-color-text-tertiary); font-size: 14px; text-align: center; border: 1px dashed var(--ds-color-border); border-radius: 4px; }

    /* 课程卡片 */
    .ti-course-card { display: grid; gap: 14px; padding: 18px; color: #000; text-decoration: none; border: 2px solid var(--ds-color-border); border-radius: 8px; background: var(--ds-color-bg-container); cursor: pointer; }
    .ti-course-card.is-active { border-color: var(--ds-color-primary); background: linear-gradient(180deg, var(--ds-color-primary-light), var(--ds-color-bg-container)); }
    .ti-course-card:not(.is-active) { gap: 16px; }
    .ti-course-card h2 { margin: 0; color: #000; font-size: 16px; font-weight: 600; line-height: 1.5; }
    .ti-course-tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .ti-course-tags span { display: inline-flex; align-items: center; min-height: 32px; padding: 0 14px; color: var(--ds-color-text-secondary); font-size: 14px; background: var(--ds-color-bg-subtle); border-radius: 4px; }
    .ti-course-fields { display: grid; gap: 14px; margin: 6px 0 0; }
    .ti-course-fields div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 18px; align-items: center; }
    .ti-course-fields dt { color: var(--ds-color-text-secondary); font-size: 14px; }
    .ti-course-fields dd { margin: 0; color: #000; font-size: 14px; }

    /* 右侧详情区 */
    .ti-detail-pane { display: flex; min-width: 0; min-height: 0; flex-direction: column; background: var(--ds-color-bg-container); }
    .ti-tabs-wrap { flex: none; min-width: 0; padding: 8px 24px 8px 12px; overflow-x: auto; scrollbar-width: none; }
    .ti-tabs-wrap::-webkit-scrollbar { display: none; }
    .ti-tab-segments { display: flex; width: max-content; height: 32px; gap: 2px; padding: 2px; background: var(--ds-color-bg-subtle); border-radius: 6px; }
    .ti-tab-segment { min-width: auto; height: 28px; padding: 3px 12px; color: var(--ds-color-text-secondary); background: transparent; border: 0; border-radius: 4px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .ti-tab-segment:hover { color: #000; background: var(--ds-color-bg-container); }
    .ti-tab-segment.is-active { color: var(--ds-color-primary); background: var(--ds-color-bg-container); }

    .ti-tab-body { display: grid; gap: 22px; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 16px 40px 12px; align-content: start; }

    /* 分区 */
    .ti-section { display: grid; gap: 12px; min-width: 0; }
    .ti-section-head { display: flex; align-items: center; gap: 16px; min-width: 0; min-height: 44px; padding: 0 16px; background: linear-gradient(90deg, var(--ds-color-primary-light), var(--ds-color-bg-container)); border-radius: 4px; }
    .ti-section-head h3 { margin: 0 auto 0 0; color: #000; font-size: 16px; font-weight: 600; }
    .ti-source-note { display: inline-flex; align-items: center; margin-left: auto; color: var(--ds-color-text-secondary); font-size: 13px; white-space: nowrap; }
    .ti-source-note strong { color: #000; font-weight: 600; }

    /* 只读表单 - 表格式 */
    .info-table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid #eeeef0; background: #fff; table-layout: fixed; }
    .info-table th, .info-table td { height: 36px; padding: 0 12px; border-bottom: 1px solid #eeeef0; border-left: 1px solid #eeeef0; font-size: 13px; line-height: 20px; }
    .info-table th:first-child, .info-table td:first-child { border-left: none; }
    .info-table th { background: #fafafa; color: #505266; font-weight: 400; text-align: right; white-space: nowrap; width: 140px; }
    .info-table td { color: #000; }
    .info-table tbody tr:last-child th, .info-table tbody tr:last-child td { border-bottom: none; }

    /* 文本展示框 */
    .ti-display-box { min-height: 84px; padding: 16px; color: #000; font-size: 14px; line-height: 1.75; border: 1px solid var(--ds-color-border-secondary); border-radius: 2px; background: var(--ds-color-bg-subtle); }
    .ti-display-box--compact { min-height: 42px; }
    .ti-display-box--large { min-height: 220px; }

    /* 上传区（ds-upload 规范组件） */
    .ti-upload-section { display: block; }
    .ds-upload__button-description { font-size: 12px; color: var(--ds-color-text-tertiary); }
    .ti-upload-box, .ti-file-card { display: grid; place-items: center; width: 148px; height: 96px; color: var(--ds-color-text-secondary); font-size: 13px; border: 1px dashed var(--ds-color-border); border-radius: 8px; background: var(--ds-color-bg-container); text-align: center; cursor: pointer; }
    .ti-upload-box:hover { border-color: var(--ds-color-primary); }
    .ti-upload-link { color: var(--ds-color-primary); }
    .ti-file-card { border-style: solid; background: var(--ds-color-bg-subtle); cursor: default; display: flex; flex-direction: column; gap: 4px; }
    .ti-file-icon { color: #fa5151; font-weight: 600; }

    /* 基本信息二级分组 */
    .ti-base-group { padding: 0; }
    .ti-base-group + .ti-base-group { margin-top: 16px; }
    .ti-base-group__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .ti-base-group__title { position: relative; padding-left: 10px; color: #000; font-size: 14px; font-weight: 500; }
    .ti-base-group__title::before { content: ""; position: absolute; top: 50%; left: 0; width: 3px; height: 14px; border-radius: 2px; background: var(--ds-color-primary); transform: translateY(-50%); }
    .ti-base-group__body { padding: 16px; color: #000; font-size: 14px; line-height: 1.75; border: 1px solid var(--ds-color-border-secondary); border-radius: 2px; background: var(--ds-color-bg-subtle); }

    /* 教学计划卡片 */
    .ti-plan-list { display: grid; gap: 12px; }
    .ti-plan-card { border: 1px solid var(--ds-color-border-secondary); border-radius: 8px; background: var(--ds-color-bg-container); overflow: hidden; }
    .ti-plan-card__head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; user-select: none; }
    .ti-plan-card__head:hover { background: var(--ds-color-bg-subtle); }
    .ti-plan-grid-4--compact { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .ti-plan-grid-4--compact > span { display: flex; gap: 2px; color: #000; font-size: 14px; overflow: hidden; white-space: nowrap; }
    .ti-plan-grid-4__name { flex: none; color: var(--ds-color-text-secondary); }
    .ti-plan-card__arrow { display: inline-block; font-size: 10px; color: var(--ds-color-text-secondary); }
    .ti-plan-card__body { padding: 4px 14px 14px; }
    .ti-plan-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; margin: 0; }
    .ti-plan-fields > div { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 12px; align-items: baseline; }
    .ti-plan-fields > div.ti-full-width { grid-column: 1 / -1; }
    .ti-plan-fields dt { margin: 0; color: var(--ds-color-text-secondary); font-size: 14px; line-height: 1.6; }
    .ti-plan-fields dd { margin: 0; color: #000; font-size: 14px; line-height: 1.6; }
    .ti-plan-card__actions { display: flex; justify-content: flex-end; margin-top: 12px; }

    /* 按钮 */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; min-width: 72px; padding: 0 14px; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid #dcdce0; background: #fff; color: #000; }
    .btn:hover { color: var(--ds-color-primary); border-color: var(--ds-color-primary); }
    .btn.primary { color: #fff; background: var(--ds-color-primary); border-color: var(--ds-color-primary); }
    .btn.primary:hover { background: var(--ds-color-primary-hover); }
    .btn.sm { height: 28px; font-size: 13px; padding: 0 12px; min-width: auto; }

    /* 弹窗 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1100; display: none; align-items: center; justify-content: center; }
    .modal-overlay.is-open { display: flex; }
    .modal { width: 640px; max-width: 90vw; max-height: 90vh; background: #fff; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); display: flex; flex-direction: column; }
    .modal__header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #eeeef0; flex-shrink: 0; }
    .modal__title { margin: 0; font-size: 16px; font-weight: 600; }
    .modal__close { width: 32px; height: 32px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
    .modal__close:hover { background: #f5f5f5; }
    .modal__body { flex: 1; overflow-y: auto; padding: 20px; }
    .modal__footer { display: flex; justify-content: flex-end; gap: 12px; padding: 16px 20px; border-top: 1px solid #eeeef0; flex-shrink: 0; }

    /* 表单 */
    .form-field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .form-field__label { font-size: 14px; color: #000; font-weight: 500; }
    .form-field input, .form-field textarea, .form-field select { padding: 8px 12px; border: 1px solid #dcdce0; border-radius: 4px; font-size: 14px; }
    .form-field input:focus, .form-field textarea:focus, .form-field select:focus { outline: none; border-color: var(--ds-color-primary); box-shadow: 0 0 0 2px var(--ds-color-focus-ring); }
    .form-field textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
    .ti-modal-sync-info { margin-bottom: 20px; padding: 12px 14px; font-size: 13px; color: var(--ds-color-text-secondary); background: var(--ds-color-bg-subtle); border-radius: 4px; }
    .ti-modal-sync-info span + span::before { content: "·"; margin: 0 8px; color: var(--ds-color-text-tertiary); }
    .form-field select { height: 36px; background: #fff; cursor: pointer; }

    /* 响应式 */
    @media (max-width: 1100px) {
      .ti-layout { grid-template-columns: 320px minmax(0, 1fr); }
      .ti-course-pane { padding-inline: 18px 14px; }
    }
    @media (max-width: 860px) {
      .ti-content-card { height: auto; min-height: calc(100vh - 92px); }
      .ti-layout { grid-template-columns: 1fr; height: auto; overflow: visible; }
      .ti-course-pane, .ti-tab-body { overflow: visible; }
      .ti-course-pane { border-right: 0; border-bottom: 1px solid var(--ds-color-border-secondary); }
    }
  </style>
</head>
<body>
  <div class="ds-scope ti-page" id="app">
    <div class="ti-content-card">
      <!-- 顶部返回头 -->
      <div class="ti-top-header">
        <button class="ti-back-btn" id="backBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          返回
        </button>
        <div class="ti-header-divider"></div>
        <h1 class="ti-header-title">教育教学信息</h1>
      </div>

      <div class="ti-layout">
        <!-- 左侧课程列表 -->
        <aside class="ti-course-pane" aria-label="授课课程">
          <div class="ti-filter-head">
            <select class="ti-semester-select" id="semesterSelect"></select>
          </div>
          <div class="ti-search-box">
            <input class="ti-search-input" id="searchInput" type="text" placeholder="搜索课程名称" />
            <button class="ti-search-btn" type="button" aria-label="搜索">
              <svg viewBox="0 0 16 16" fill="none" width="16" height="16"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" strokeWidth="1.5"/><path d="M10 10L14 14" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
            </button>
          </div>
          <div class="ti-course-list" id="courseList">
            <!-- JS渲染 -->
          </div>
        </aside>

        <!-- 右侧详情区 -->
        <section class="ti-detail-pane" aria-label="教学信息详情">
          <div class="ti-tabs-wrap">
            <div class="ti-tab-segments" id="tabSegments">
              <!-- JS渲染 -->
            </div>
          </div>
          <div class="ti-tab-body" id="tabBody">
            <!-- JS渲染 -->
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- 文本编辑弹窗 -->
  <div class="modal-overlay" id="textModal">
    <div class="modal">
      <div class="modal__header">
        <h3 class="modal__title" id="textModalTitle">编辑</h3>
        <button class="modal__close" id="textModalClose" type="button" aria-label="关闭">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-field">
          <label class="form-field__label" id="textModalFieldLabel">内容</label>

        </div>
      </div>
      <div class="modal__footer">
        <button class="btn" id="textModalCancel" type="button">取消</button>
        <button class="btn primary" id="textModalOk" type="button">保存</button>

    </div>
  </div>

  <!-- 教学实施编辑弹窗 -->
  <div class="modal-overlay" id="planModal">
    <div class="modal">
      <div class="modal__header">
        <h3 class="modal__title" id="planModalTitle">编辑教学实施</h3>
        <button class="modal__close" id="planModalClose" type="button" aria-label="关闭">

          </select>
        </div>
        <div class="form-field">
          <label class="form-field__label">教学方式</label>

            <option>课堂讲授</option>

            <option>案例教学</option>
            <option>翻转课堂</option>

          <textarea id="planContent" rows="3" placeholder="请输入本次课的核心内容"></textarea>

          <input type="text" id="planLocation" placeholder="请输入" />

        <div class="form-field">
          <label class="form-field__label">信息化教学工具</label>

          <input type="text" id="planResources" placeholder="多个资源用英文逗号分隔" />

          <textarea id="planReflection" rows="4" placeholder="请输入课后反思/随笔"></textarea>

  <script>
    // 审核页只读模式：URL 带 ?mode=readonly 时隐藏编辑按钮与返回头返回上级改为不可用
    const IS_READONLY = new URLSearchParams(window.location.search).get('mode') === 'readonly';
    if (IS_READONLY) {
      const style = document.createElement('style');
      style.textContent = '.btn[data-edit-basic],.btn[data-edit-plan],.btn[data-edit-section],#addPlanBtn{display:none!important}.ti-top-header{display:none!important}.ti-content-card{height:100vh}';
      document.head.appendChild(style);
    }

    // ===== 学期选项 =====
    function generateSemesterOptions() {
      const options = [];
      const currentYear = new Date().getFullYear();
      const month = new Date().getMonth() + 1;
      const isFall = month >= 9 || month <= 1;
      const defaultValue = isFall ? (currentYear + '-' + (currentYear + 1) + '-fall') : ((currentYear - 1) + '-' + currentYear + '-spring');
      for (let yearOffset = 0; yearOffset < 5; yearOffset++) {
        const year = currentYear - yearOffset;
        options.push({ value: year + '-' + (year + 1) + '-fall', label: year + '-' + (year + 1) + '学年 秋季学期' });
        options.push({ value: (year - 1) + '-' + year + '-spring', label: (year - 1) + '-' + year + '学年 春季学期' });
      }
      return { options, defaultValue };
    }

    const SEMESTER = generateSemesterOptions();

    // ===== 课程数据 =====
    const BASE_COURSES = [
      { id: 'data-structure', name: '数据结构与算法', tags: ['汽车智能技术', '88学时', '6学分'], code: 'CS20260101', sequence: '01', owner: '汽车智能技术学院', teachingForm: '线下授课', category: '专业核心课', nature: '必修', className: '202406', credits: 6, hours: 88, students: 19, examType: '闭卷考试', teachingMode: '讲授+实践', status: '进行中' },
      { id: 'auto-engineering', name: '汽车工程', tags: ['汽车工程', '64学时', '6学分'], code: 'AE20260203', sequence: '02', owner: '汽车工程学院', teachingForm: '线下授课', category: '专业基础课', nature: '选修', className: '202405', credits: 6, hours: 64, students: 36, examType: '开卷考试', teachingMode: '讲授', status: '进行中' },

      if (pair.length) rows.push(pair);

      return '<table class="info-table"><tbody>' +
        rows.map(row =>

      // 展开/收起
      tabBody.querySelectorAll('.ti-plan-card__head').forEach(head => {
        head.addEventListener('click', () => {
          const body = head.parentElement.querySelector('.ti-plan-card__body');
          const arrow = head.querySelector('.ti-plan-card__arrow');
          if (body.style.display === 'none') {
            body.style.display = '';
            arrow.textContent = '▼';
          } else {
            body.style.display = 'none';
            arrow.textContent = '▶';
          }
        });
      });
    }

    function renderOtherTab(tabKey, course) {
      const sectionDefs = {
        ideology: [
          { key: 'ideology-element', title: '思政元素', kind: 'dict', editable: false },
          { key: 'ideology-content', title: '思政教学内容', kind: 'text', large: true, editable: true },
        ],
        care: [
          { key: 'goal', title: '课程目标', source: '教务系统', kind: 'text', large: true, editable: false },
          { key: 'student-help', title: '辅导学生', kind: 'text', large: true, editable: true },
          { key: 'student-case', title: '个性化案例', kind: 'text', large: true, editable: true },
        ],
        effect: [
          { key: 'teaching-info', title: '教学信息', source: '教务系统', kind: 'metrics', editable: false },
          { key: 'representative-homework', title: '学生代表性作业', kind: 'upload', editable: false },
        ],
        evaluation: [
          { key: 'student-evaluation', title: '学生评价', source: '教务系统', kind: 'text', large: true, editable: false },
          { key: 'supervisor-evaluation', title: '督导评价', source: '教务系统', kind: 'text', large: true, editable: false },
          { key: 'peer-evaluation', title: '同行评价', source: '教务系统', kind: 'text', large: true, editable: false },
        ],
        reflection: [
          { key: 'teaching-reflection', title: '教学反思', kind: 'text', large: true, editable: true },
          { key: 'optimization', title: '优化措施', kind: 'text', large: true, editable: true },
        ],
        summary: [
          { key: 'course-summary', title: '课程总结', kind: 'text', large: true, editable: true },
          { key: 'summary-file', title: '课程总结附件', kind: 'files', editable: false },
        ],
      };

      const sections = sectionDefs[tabKey] || [];
      let html = '';
      sections.forEach(section => {
        html += '<section class="ti-section"><div class="ti-section-head"><h3>' + section.title + '</h3>' +
          (section.source ? '<span class="ti-source-note">数据来源于<strong>' + section.source + '</strong></span>' : '') +
          (section.editable ? '<button class="btn sm" data-edit-section="' + section.key + '" data-edit-title="' + section.title + '" type="button" style="margin-left:auto;">编辑</button>' : '') +
        '</div>';

        if (section.kind === 'text') {
          html += '<div class="ti-display-box' + (section.large ? ' ti-display-box--large' : '') + '"><span>' + buildSectionText({ ...section, tabKey }, course) + '</span></div>';
        } else if (section.kind === 'dict') {
          html += '<div class="ti-display-box"><span>工匠精神、职业道德、创新精神、劳动精神、安全规范意识</span></div>';
        } else if (section.kind === 'metrics') {
          html += readOnlyFormHTML([
            { label: '上课率', value: course.id === 'data-structure' ? '98%' : '96%' },
            { label: '平均成绩', value: course.id === 'data-structure' ? '--' : '86.5' },
          ]);
        } else if (section.kind === 'upload' || section.kind === 'files') {
          html += '<section class="ds-upload ds-upload--button ds-upload--text"><div class="ds-upload__button-wrap"><input class="ds-upload__input" type="file" /><label class="ds-upload__button"><span>上传附件</span></label></div><div class="ds-upload__text-list"></div></section>';
        }
        html += '</section>';
      });

      // 绑定编辑事件
      setTimeout(() => {
        tabBody.querySelectorAll('[data-edit-section]').forEach(btn => {
          btn.addEventListener('click', () => {
            const key = btn.dataset.editSection;
            const title = btn.dataset.editTitle;
            const section = sections.find(s => s.key === key);
            editingSection = { type: 'section', courseId: course.id, tabKey, key, title };
            editingText = buildSectionText({ ...section, tabKey }, course);
            openTextModal(title);
          });
        });
      }, 0);

      return html;
    }

    function renderMaterialsPanel() {
      return '<section class="ti-section"><div class="ti-section-head"><h3>课程资料</h3></div>' +
        '<section class="ds-upload ds-upload--button ds-upload--text"><div class="ds-upload__button-wrap"><input class="ds-upload__input" type="file" /><label class="ds-upload__button"><span>上传附件</span></label></div><div class="ds-upload__text-list"></div></section></section>';
    }

    // ===== 文本编辑弹窗 =====
    let textSaveCallback = null;

    function openTextModal(title) {
      textModalTitle.textContent = '编辑' + title;
      textModalFieldLabel.textContent = title;
      textModalTextarea.value = editingText;
      textModal.classList.add('is-open');
    }

    textModalClose.addEventListener('click', () => textModal.classList.remove('is-open'));
    textModalCancel.addEventListener('click', () => textModal.classList.remove('is-open'));

    textModalOk.addEventListener('click', () => {
      const newText = textModalTextarea.value;
      if (!editingSection) return;

      if (editingSection.type === 'basic') {
        const courseKey = editingSection.courseId + '-design';
        if (!courseContentData[courseKey]) courseContentData[courseKey] = {};
        if (!courseContentData[courseKey].basicInfo) courseContentData[courseKey].basicInfo = {};
        courseContentData[courseKey].basicInfo[editingSection.field] = newText;
      } else if (editingSection.type === 'section') {
        const contentKey = editingSection.courseId + '-' + editingSection.tabKey;
        if (!courseContentData[contentKey]) courseContentData[contentKey] = {};
        courseContentData[contentKey][editingSection.key] = newText;
      }

      textModal.classList.remove('is-open');
      renderTabBody();
    });

    // ===== 教学实施编辑弹窗 =====
    function openPlanModal() {
      planModalTitle.textContent = editingPlanIsNew ? '新增教学实施' : ('编辑教学实施 - ' + (editingPlan.date || ''));
      planModalSyncInfo.innerHTML = '<span>' + (editingPlan.date || '-') + '</span><span>' + (editingPlan.week || '-') + '</span><span>' + (editingPlan.weekday || '-') + '</span><span>' + (editingPlan.hours || 0) + '学时</span>';
      document.getElementById('planTeachingType').value = editingPlan.teachingType || '';
      document.getElementById('planTeachingMethod').value = editingPlan.teachingMethod || '';
      document.getElementById('planContent').value = editingPlan.content || '';
      document.getElementById('planLocation').value = editingPlan.location || '';
      document.getElementById('planTools').value = editingPlan.tools || '';
      document.getElementById('planResources').value = (editingPlan.resources || []).join(', ');
      document.getElementById('planReflection').value = editingPlan.reflection || '';
      document.getElementById('planIdeology').value = editingPlan.ideology || '';
      planModal.classList.add('is-open');
    }

    planModalClose.addEventListener('click', () => planModal.classList.remove('is-open'));
    planModalCancel.addEventListener('click', () => planModal.classList.remove('is-open'));

    planModalOk.addEventListener('click', () => {
      if (!editingPlan) return;
      editingPlan.teachingType = document.getElementById('planTeachingType').value;
      editingPlan.teachingMethod = document.getElementById('planTeachingMethod').value;
      editingPlan.content = document.getElementById('planContent').value;
      editingPlan.location = document.getElementById('planLocation').value;
      editingPlan.tools = document.getElementById('planTools').value;
      editingPlan.resources = document.getElementById('planResources').value ? document.getElementById('planResources').value.split(',').map(s => s.trim()).filter(Boolean) : [];
      editingPlan.reflection = document.getElementById('planReflection').value;
      editingPlan.ideology = document.getElementById('planIdeology').value;

      const course = getSelectedCourse();
      const courseKey = course.id + '-design';
      if (!courseContentData[courseKey]) courseContentData[courseKey] = {};
      if (!courseContentData[courseKey].teachingPlans) {
        courseContentData[courseKey].teachingPlans = (TEACHING_PLANS_BY_COURSE[course.id] || DEFAULT_TEACHING_PLANS).map(p => ({ ...p }));
      }
      const plans = courseContentData[courseKey].teachingPlans;
      const exists = plans.some(p => p.id === editingPlan.id);
      if (exists) {
        const idx = plans.findIndex(p => p.id === editingPlan.id);
        plans[idx] = editingPlan;
      } else {
        plans.unshift(editingPlan);
      }

      planModal.classList.remove('is-open');
      renderTabBody();
    });

    // ===== 初始化 =====
    initSemesterOptions();
    const initialCourses = getCourses();
    selectedCourseId = initialCourses[0] ? initialCourses[0].id : null;
    selectedCourseId = getFilteredCourses()[0] ? getFilteredCourses()[0].id : selectedCourseId;
    renderCourseList();
    renderTabs();
    renderTabBody();
  </script>
</body>
</html>
