<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图表配置能力</title>
  <style>
    body { margin: 0; background: #fff; }
    .ds-scope, .ds-page { background: #fff; }
    .chart-designer-page { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .cd-layout { flex: 1; display: flex; overflow: hidden; }

    /* ═══ 左栏 ═══ */
    .cd-left-panel { width: 240px; border-right: 1px solid #eeeef0; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
    .cd-panel-header { padding: 12px 16px; font-size: 14px; font-weight: 600; color: #000; border-bottom: 1px solid #eeeef0; display: flex; align-items: center; justify-content: space-between; }
    .cd-container-list { border-bottom: 1px solid #eeeef0; max-height: 200px; overflow: auto; }
    .cd-container-list__header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; font-size: 12px; color: #737585; }
    .cd-container-item { display: flex; align-items: center; gap: 8px; padding: 8px 16px; cursor: pointer; }
    .cd-container-item:hover { background: #f6f6f7; }
    .cd-container-item.active { background: #e8f0ff; }
    .cd-container-item__title { flex: 1; font-size: 13px; color: #000; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cd-container-item.active .cd-container-item__title { color: var(--ds-color-primary); }
    .cd-container-item__count { font-size: 12px; color: #737585; }
    .cd-container-item__del { border: 0; background: transparent; color: #737585; cursor: pointer; font-size: 14px; padding: 0 4px; }
    .cd-container-item__del:hover { color: #F53F3F; }
    .cd-type-list { flex: 1; overflow: auto; padding: 8px; }
    .cd-type-group__title { font-size: 12px; color: #737585; padding: 8px 8px 4px; }
    .cd-type-card { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 1px solid transparent; border-radius: 6px; cursor: grab; }
    .cd-type-card:hover { border-color: var(--ds-color-primary); background: #f6f9ff; }
    .cd-type-card__thumb { width: 40px; height: 40px; color: var(--ds-color-primary); flex: none; display: flex; align-items: center; justify-content: center; }
    .cd-type-card__thumb svg { width: 100%; height: 100%; }
    .cd-type-card__name { font-size: 13px; color: #000; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; min-width: 60px; padding: 0 12px; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid #dcdce0; background: #fff; color: #000; }
    .btn:hover { color: var(--ds-color-primary); border-color: var(--ds-color-primary); }
    .btn.primary { color: #fff; background: var(--ds-color-primary); border-color: var(--ds-color-primary); }
    .btn.primary:hover { color: #fff; background: var(--ds-color-primary-hover); border-color: var(--ds-color-primary-hover); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.sm { height: 24px; padding: 0 10px; font-size: 12px; min-width: auto; }

    /* ═══ 中栏 ═══ */
    .cd-canvas-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .cd-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #eeeef0; }
    .cd-toolbar__title { font-size: 15px; font-weight: 600; color: #000; }
    .cd-canvas-body { flex: 1; overflow: auto; padding: 16px; background: #f7f8fa; }
    .cd-canvas-toolbar__count { font-size: 12px; color: #737585; margin-left: 12px; }
    .cd-canvas-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #bcbecd; }
    .cd-canvas-empty__icon { font-size: 40px; }
    .cd-canvas-empty__text { font-size: 13px; }

    .cd-dashboard-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .cd-chart-wrapper { position: relative; background: #fff; border: 1px solid #eeeef0; border-radius: 8px; padding: 12px; cursor: pointer; min-width: 0; }
    .cd-chart-wrapper.selected { border-color: var(--ds-color-primary); box-shadow: 0 0 0 2px rgba(51,63,255,0.12); }
    .cd-chart-wrapper__delete { position: absolute; top: -8px; right: -8px; width: 18px; height: 18px; border-radius: 50%; background: #F53F3F; color: #fff; border: 0; font-size: 12px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; }

    .cd-chart-card__title { font-size: 13px; font-weight: 600; color: #000; margin-bottom: 8px; }
    .cd-chart-card__body { min-height: 120px; }
    .cd-chart-card__body svg { width: 100%; height: auto; display: block; }
    .cd-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; }
    .cd-legend__item { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #505266; }
    .cd-legend__dot { width: 8px; height: 8px; border-radius: 2px; }

    /* 档案信息卡 */
    .cd-profile-card { display: flex; gap: 12px; }
    .cd-profile-card__photo { width: 64px; height: 80px; border-radius: 6px; background: #e8e9ee; object-fit: cover; flex: none; }
    .cd-profile-card__name { font-size: 15px; font-weight: 600; color: #000; margin-bottom: 6px; }
    .cd-profile-card__field { display: flex; gap: 8px; font-size: 12px; line-height: 20px; }
    .cd-profile-card__field dt { color: #737585; flex: none; }
    .cd-profile-card__field dd { margin: 0; color: #000; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 统计卡 */
    .cd-stat-card { display: flex; align-items: center; gap: 10px; border-radius: 8px; padding: 14px; height: 100%; box-sizing: border-box; }
    .cd-stat-card__icon-before { flex: none; }
    .cd-stat-card__icon-before svg { width: 22px; height: 22px; }
    .cd-stat-card__icon-corner svg { width: 26px; height: 26px; opacity: 0.5; }
    .cd-stat-card__body { flex: 1; min-width: 0; }
    .cd-stat-card__label { font-size: 13px; }
    .cd-stat-card__value-row { display: flex; align-items: baseline; gap: 4px; }
    .cd-stat-card__value { font-size: 26px; font-weight: 600; }
    .cd-stat-card__unit { font-size: 12px; }
    .cd-stat-card__compare { font-size: 12px; opacity: 0.75; margin-top: 2px; }

    /* 条形占比 */
    .cd-segbar-stats { display: flex; gap: 8px; margin-bottom: 10px; }
    .cd-segbar-stat { padding: 6px 12px; border-radius: 6px; background: #f6f6f7; }
    .cd-segbar-stat__value { font-size: 16px; font-weight: 600; color: #000; }
    .cd-segbar-stat__label { font-size: 11px; color: #737585; }
    .cd-segbar-track { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #e8e9ee; }
    .cd-segbar-seg { height: 100%; }

    /* 横向柱状 / 排名 */
    .cd-barrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .cd-barrow__name { width: 64px; font-size: 12px; color: #505266; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cd-barrow__track { flex: 1; height: 10px; border-radius: 5px; background: #f0f0f2; overflow: hidden; }
    .cd-barrow__fill { height: 100%; border-radius: 5px; }
    .cd-barrow__value { width: 42px; text-align: right; font-size: 12px; color: #000; flex: none; }
    .cd-rankrow { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
    .cd-rankrow__badge { width: 18px; height: 18px; border-radius: 4px; background: #e8e9ee; color: #737585; font-size: 11px; display: flex; align-items: center; justify-content: center; flex: none; }
    .cd-rankrow__badge.top1 { background: #F53F3F; color: #fff; }
    .cd-rankrow__badge.top2 { background: #FF7D00; color: #fff; }
    .cd-rankrow__badge.top3 { background: #FFC00E; color: #fff; }

    /* 容器 */
    .cd-container { border: 1px solid #eeeef0; border-radius: 8px; background: #fff; margin-bottom: 16px; }
    .cd-container__header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #eeeef0; cursor: pointer; }
    .cd-container__title { font-size: 14px; font-weight: 600; color: #000; }
    .cd-container__toggle { border: 0; background: transparent; color: #737585; cursor: pointer; padding: 2px 6px; }
    .cd-container__tabs { display: flex; gap: 0; padding: 0 14px; border-bottom: 1px solid #eeeef0; }
    .cd-container__tab { padding: 8px 14px; font-size: 13px; color: #505266; cursor: pointer; border-bottom: 2px solid transparent; }
    .cd-container__tab.active { color: var(--ds-color-primary); font-weight: 500; border-bottom-color: var(--ds-color-primary); }
    .cd-container__body { padding: 12px; min-height: 60px; }
    .cd-container__empty { padding: 16px; text-align: center; color: #bcbecd; font-size: 13px; border: 1px dashed #dcdce0; border-radius: 6px; }
    .cd-top-charts { margin-bottom: 16px; }

    /* ═══ 右栏 ═══ */
    .cd-right-panel { width: 300px; border-left: 1px solid #eeeef0; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
    .cd-right-panel .cd-panel-header button.close { border: 0; background: transparent; color: #737585; cursor: pointer; font-size: 16px; padding: 0 4px; }
    .cd-right-panel .cd-panel-header button.close:hover { color: #F53F3F; }
    .cd-right-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #bcbecd; }
    .cd-right-empty__icon { font-size: 32px; }
    .cd-right-empty__text { font-size: 13px; }
    .cd-tabs-bar { display: flex; border-bottom: 1px solid #eeeef0; }
    .cd-tabs-bar__tab { flex: 1; text-align: center; padding: 8px 0; font-size: 13px; color: #505266; cursor: pointer; border-bottom: 2px solid transparent; background: none; border-top: 0; border-left: 0; border-right: 0; }
    .cd-tabs-bar__tab.active { color: var(--ds-color-primary); font-weight: 500; border-bottom-color: var(--ds-color-primary); }
    .cd-property-body { flex: 1; overflow: auto; padding: 12px; }
    .cd-field-group { border: 1px solid #eeeef0; border-radius: 6px; margin-bottom: 10px; }
    .cd-field-group__header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; font-size: 13px; font-weight: 600; color: #000; cursor: pointer; background: #fafafa; }
    .cd-field-group__arrow { color: #737585; font-size: 11px; }
    .cd-field-group__body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .cd-field { display: flex; flex-direction: column; gap: 4px; }
    .cd-field__label { font-size: 12px; color: #505266; }
    .cd-field input[type="text"], .cd-field input[type="number"], .cd-field select, .cd-field textarea { height: 28px; padding: 0 8px; border: 1px solid #dcdce0; border-radius: 4px; font-size: 13px; color: #000; outline: none; box-sizing: border-box; width: 100%; font-family: inherit; }
    .cd-field textarea { height: auto; padding: 8px; line-height: 1.5; resize: vertical; }
    .cd-field input:focus, .cd-field select:focus, .cd-field textarea:focus { border-color: var(--ds-color-primary); box-shadow: 0 0 0 2px rgba(51,63,255,0.12); }
    .cd-field input[readonly] { background: #f6f6f7; color: #737585; }
    .cd-field-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cd-field-error { font-size: 12px; color: #F53F3F; }
    .cd-field-hint { font-size: 11px; color: #b3b5c3; }
    .cd-switch-row { display: flex; align-items: center; justify-content: space-between; }
    .cd-switch-row__label { font-size: 12px; color: #505266; }
    .cd-switch { width: 34px; height: 18px; border-radius: 9px; background: #bcbecd; position: relative; cursor: pointer; transition: background 0.2s; flex: none; }
    .cd-switch.is-on { background: var(--ds-color-primary); }
    .cd-switch::after { content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: transform 0.2s; }
    .cd-switch.is-on::after { transform: translateX(16px); }
    .cd-series-editor__header { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #505266; }
    .cd-filter-item { border: 1px solid #eeeef0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .cd-filter-item__row { display: flex; gap: 6px; align-items: center; }
    .cd-filter-item__row input[type="text"] { flex: 1; height: 26px; padding: 0 8px; border: 1px solid #dcdce0; border-radius: 4px; font-size: 12px; outline: none; box-sizing: border-box; min-width: 0; }
    .cd-icon-btn { border: 0; background: transparent; color: #737585; cursor: pointer; font-size: 14px; padding: 2px 6px; flex: none; }
    .cd-icon-btn:hover { color: #F53F3F; }
    .cd-type-badge { margin-top: auto; padding: 8px 10px; font-size: 11px; color: #737585; background: #fafafa; border-top: 1px solid #eeeef0; }

    /* toast & modal */
    .cd-message { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: #20b486; color: #fff; padding: 8px 20px; border-radius: 6px; font-size: 13px; z-index: 9999; display: none; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .modal-overlay.is-open { display: flex; }
    .cd-export-modal { width: 680px; max-width: 90vw; background: #fff; border-radius: 8px; display: flex; flex-direction: column; max-height: 80vh; }
    .cd-export-modal__header { padding: 14px 20px; border-bottom: 1px solid #eeeef0; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .cd-export-modal__body { padding: 16px 20px; overflow: auto; }
    .cd-export-modal__desc { font-size: 13px; color: #505266; margin: 0 0 10px; }
    .cd-export-modal__desc code { background: #f6f6f7; padding: 1px 4px; border-radius: 3px; }
    .cd-export-modal__code { background: #f7f8fa; border: 1px solid #eeeef0; border-radius: 6px; padding: 12px; font-size: 12px; line-height: 1.5; overflow: auto; max-height: 320px; }
    .cd-export-modal__footer { display: flex; justify-content: flex-end; gap: 12px; padding: 12px 20px; border-top: 1px solid #eeeef0; }
  </style>
</head>
<body>
<div class="ds-scope ds-page chart-designer-page">
  <div class="cd-layout">
    <aside class="cd-left-panel" id="leftPanel"></aside>
    <div class="cd-canvas-section">
      <div class="cd-toolbar">
        <span class="cd-toolbar__title">图表设计器</span>
        <button class="btn primary" type="button" id="exportBtn" onclick="openExport()">导出配置</button>
      </div>
      <div class="cd-canvas-body" id="canvasBody" ondragover="canvasDragOver(event)" ondrop="dropTypeOnCanvas(event)" onclick="selectNone()"></div>
    </div>
    <aside class="cd-right-panel" id="rightPanel" onclick="event.stopPropagation()"></aside>
  </div>
</div>

<div class="cd-message" id="toast"></div>

<div class="modal-overlay" id="exportModal">
  <div class="cd-export-modal">
    <div class="cd-export-modal__header"><span>导出图表配置</span><button class="cd-icon-btn" type="button" onclick="closeExport()">×</button></div>
    <div class="cd-export-modal__body">
      <p class="cd-export-modal__desc">导出的 <code>containers</code> 数组可直接用于业务页面。</p>
      <pre class="cd-export-modal__code" id="exportCode"></pre>
    </div>
    <div class="cd-export-modal__footer">
      <button class="btn" type="button" onclick="downloadJson()">下载文件</button>
      <button class="btn primary" type="button" onclick="copyJson()">复制 JSON</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════ 常量 ═══════════════ */
var CHART_TYPE_META = [
  { type: 'profileCard', name: '档案信息卡', group: '统计卡', size: 'medium', desc: '照片+姓名+基本信息的档案卡' },
  { type: 'basicInfo', name: '统计卡片', group: '统计卡', size: 'small', desc: '单个彩色统计卡片，支持图标与对比分析' },
  { type: 'segmentBar', name: '条形占比图', group: '统计卡', size: 'full', desc: '分段占比统计' },
  { type: 'donut', name: '环形图', group: '占比类', size: 'small', desc: '分类占比，环心显示总数' },
  { type: 'donutCallout', name: '引导线环形图', group: '占比类', size: 'wide', desc: '带引导线标签的占比' },
  { type: 'pie', name: '饼状图', group: '占比类', size: 'small', desc: '实心分类占比' },
  { type: 'pieCallout', name: '引导线扇形图', group: '占比类', size: 'wide', desc: '实心饼图+短引导线标签' },
  { type: 'progressRing', name: '进度环', group: '占比类', size: 'mini', desc: '完成度展示' },
  { type: 'barHorizontal', name: '横向柱状图', group: '对比类', size: 'small', desc: '横向对比' },
  { type: 'barVertical', name: '竖向柱状图', group: '对比类', size: 'medium', desc: '纵向对比' },
  { type: 'rankBar', name: '排名柱状图', group: '对比类', size: 'medium', desc: 'TOP 排名对比，带名次' },
  { type: 'line', name: '折线图', group: '趋势类', size: 'medium', desc: '趋势分析' },
  { type: 'areaLine', name: '面积折线图', group: '趋势类', size: 'wide', desc: '重点趋势展示' },
  { type: 'radar', name: '雷达图', group: '画像类', size: 'medium', desc: '多维度画像' }
];

var SIZE_OPTIONS = ['mini', 'small', 'medium', 'wide', 'full'];
var SIZE_SPAN = { mini: 1, small: 2, medium: 3, wide: 4, full: 6 };
var SPAN_TO_SIZE = { 1: 'mini', 2: 'small', 3: 'medium', 4: 'wide', 5: 'wide', 6: 'full' };
var GRID_COLUMNS = 6;
var CHART_SIZE_LIMITS = {
  profileCard: { min: 2 }, basicInfo: { min: 3 }, segmentBar: { min: 4 },
  donut: { min: 2 }, donutCallout: { min: 3 }, pie: { min: 2 }, pieCallout: { min: 3 },
  progressRing: { min: 1 }, barHorizontal: { min: 2 }, barVertical: { min: 2 },
  rankBar: { min: 3 }, line: { min: 3 }, areaLine: { min: 3 }, radar: { min: 3 }
};
var STAT_COLOR_OPTIONS = ['purple', 'cyan', 'blue', 'green', 'deepPurple', 'pink', 'orange'];
var STAT_ICON_OPTIONS = ['project', 'award', 'person', 'chart', 'book', 'money', 'time'];
var STAT_ICON_POSITIONS = [{ label: '标题前', value: 'before-title' }, { label: '卡片右下', value: 'bottom-right' }];
var SEGMENT_STATUS_OPTIONS = ['excellent', 'good', 'attention', 'risk'];
var SEGMENT_STATUS_COLOR = { excellent: '#00B42A', good: '#1677FF', attention: '#FF7D00', risk: '#F53F3F' };
var FILTER_TYPE_OPTIONS = [{ label: '选择字段', value: 'select' }, { label: '时间筛选', value: 'time' }];
var FILTER_TIME_GRAINS = ['按年', '按学期', '按月', '按日'];
var PALETTE = ['#3B82F6', '#00B42A', '#FF7D00', '#F53F3F', '#722ED1', '#14C0FF', '#F77EB9', '#25467A'];

var THUMBS = {
  profileCard: '<svg viewBox="0 0 40 40" fill="none"><circle cx="12" cy="12" r="6" fill="currentColor" opacity="0.7"/><rect x="4" y="22" width="16" height="3" rx="1.5" fill="currentColor" opacity="0.5"/><rect x="4" y="27" width="12" height="2" rx="1" fill="currentColor" opacity="0.3"/><rect x="22" y="6" width="14" height="28" rx="2" fill="currentColor" opacity="0.15"/><rect x="24" y="10" width="10" height="2" rx="1" fill="currentColor" opacity="0.4"/><rect x="24" y="14" width="8" height="2" rx="1" fill="currentColor" opacity="0.3"/><rect x="24" y="18" width="10" height="2" rx="1" fill="currentColor" opacity="0.4"/><rect x="24" y="22" width="6" height="2" rx="1" fill="currentColor" opacity="0.3"/></svg>',
  basicInfo: '<svg viewBox="0 0 40 40" fill="none"><rect x="4" y="8" width="14" height="10" rx="2" fill="currentColor" opacity="0.8"/><rect x="22" y="8" width="14" height="10" rx="2" fill="currentColor" opacity="0.5"/><rect x="4" y="22" width="14" height="10" rx="2" fill="currentColor" opacity="0.6"/><rect x="22" y="22" width="14" height="10" rx="2" fill="currentColor" opacity="0.4"/></svg>',
  segmentBar: '<svg viewBox="0 0 40 40" fill="none"><rect x="4" y="14" width="22" height="6" rx="2" fill="currentColor" opacity="0.8"/><rect x="26" y="14" width="6" height="6" rx="2" fill="currentColor" opacity="0.6"/><rect x="32" y="14" width="4" height="6" rx="2" fill="currentColor" opacity="0.4"/><rect x="4" y="24" width="32" height="3" rx="1.5" fill="currentColor" opacity="0.2"/></svg>',
  donut: '<svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="14" stroke="currentColor" stroke-width="6" stroke-dasharray="44 88"/><circle cx="20" cy="20" r="6" fill="currentColor"/></svg>',

function donutSegPath(cx, cy, r, ri, a0, a1) {

  var xi0 = cx + ri * Math.cos(a0), yi0 = cy + ri * Math.sin(a0);
  return 'M' + x0 + ' ' + y0 + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1 + ' ' + y1 + ' L' + xi1 + ' ' + yi1 + ' A' + ri + ' ' + ri + ' 0 ' + large + ' 0 ' + xi0 + ' ' + yi0 + ' Z';

    a0 = a1;
  });
  return '<svg viewBox="0 0 170 170">' + arcs +
    '<text x="85" y="82" text-anchor="middle" font-size="22" font-weight="600" fill="#000">' + total + esc(chart.unit || '') + '</text>' +
    '<text x="85" y="100" text-anchor="middle" font-size="11" fill="#737585">总计</text></svg>' + legendHtml(data);
}

      var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);

    } else {
      shapes += '<path d="' + donutSegPath(cx, cy, r, ri, a0, a1) + '" fill="' + PALETTE[i % PALETTE.length] + '"/>';
    }
    // 引导线
    var lx0 = cx + (solid ? r : r + 2) * Math.cos(mid), ly0 = cy + (solid ? r : r + 2) * Math.sin(mid);

  var html = '';
  sorted.forEach(function(d, i) {
    var badgeCls = i === 0 ? ' top1' : i === 1 ? ' top2' : i === 2 ? ' top3' : '';
    html += '<div class="cd-rankrow"><span class="cd-rankrow__badge' + badgeCls + '">' + (i + 1) + '</span>' +
      '<span class="cd-barrow__name" style="flex:1">' + esc(d.name) + '</span>' +
      '<span class="cd-barrow__track" style="flex:1.2"><span class="cd-barrow__fill" style="width:' + Math.round(d.value / max * 100) + '%;background:' + PALETTE[0] + '"></span></span>' +
      '<span class="cd-barrow__value">' + esc(d.value) + esc(chart.unit || '') + '</span></div>';
  });
  return html;
}

function renderChartContent(chart) {
  if (chart.type === 'profileCard') {
    var fields = '';
    (chart.fields || []).forEach(function(f) {
      fields += '<div class="cd-profile-card__field"><dt>' + esc(f.label) + '</dt><dd>' + esc(f.value) + '</dd></div>';
    });
    return '<div class="cd-profile-card">' +
      (chart.photo ? '<img class="cd-profile-card__photo" src="' + esc(chart.photo) + '" alt=""/>' : '') +
      '<div class="cd-profile-card__body"><div class="cd-profile-card__name">' + esc(chart.name) + '</div><dl style="margin:0">' + fields + '</dl></div></div>';
  }
  if (chart.type === 'basicInfo') {
    var s = chart.stat || {};
    var scheme = STAT_COLOR_SCHEMES[s.color] || STAT_COLOR_SCHEMES.purple;
    var icon = s.icon ? STAT_ICONS[s.icon] : '';
    return '<div class="cd-stat-card" style="background:' + scheme.bg + ';color:' + scheme.text + '">' +
      (s.iconPosition === 'before-title' && icon ? '<div class="cd-stat-card__icon-before">' + icon + '</div>' : '') +
      '<div class="cd-stat-card__body"><div class="cd-stat-card__label">' + esc(s.label || '指标') + '</div>' +
      '<div class="cd-stat-card__value-row"><span class="cd-stat-card__value">' + esc(s.value || '0') + '</span><span class="cd-stat-card__unit">' + esc(s.unit || '') + '</span></div>' +
      (s.compare ? '<div class="cd-stat-card__compare">' + esc(s.compare) + '</div>' : '') + '</div>' +
      (s.iconPosition === 'bottom-right' && icon ? '<div class="cd-stat-card__icon-corner">' + icon + '</div>' : '') + '</div>';
  }
  if (chart.type === 'segmentBar') {
    var stats = '';
    (chart.stats || []).forEach(function(st) {
      stats += '<div class="cd-segbar-stat"><div class="cd-segbar-stat__value">' + esc(st.value) + '</div><div class="cd-segbar-stat__label">' + esc(st.label) + '</div></div>';
    });
    var segs = chart.segments || [];
    var total = segs.reduce(function(sum, sg) { return sum + (Number(sg.value) || 0); }, 0) || 1;
    var track = '', legend = '';
    segs.forEach(function(sg) {
      var w = Math.round((Number(sg.value) || 0) / total * 100);
      var color = SEGMENT_STATUS_COLOR[sg.status] || '#1677FF';
      track += '<span class="cd-segbar-seg" style="width:' + w + '%;background:' + color + '"></span>';
      legend += '<span class="cd-legend__item"><span class="cd-legend__dot" style="background:' + color + '"></span>' + esc(sg.label) + ' ' + (Number(sg.value) || 0) + '</span>';
    });
    return '<div class="cd-chart-card__title">' + esc(chart.title) + '</div>' +
      '<div class="cd-segbar-stats">' + stats + '</div>' +
      '<div class="cd-segbar-track">' + track + '</div>' +
      '<div class="cd-legend">' + legend + '</div>';
  }
  var body = '';
  switch (chart.type) {
    case 'donut': body = chartSvgDonut(chart); break;
    case 'donutCallout': body = chartSvgCallout(chart, false); break;
    case 'pie': body = chartSvgPie(chart); break;
    case 'pieCallout': body = chartSvgCallout(chart, true); break;
    case 'progressRing': body = chartSvgProgressRing(chart); break;
    case 'barHorizontal': body = chartHtmlBarH(chart); break;
    case 'barVertical': body = chartSvgBarVertical(chart); break;
    case 'rankBar': body = chartHtmlRankBar(chart); break;
    case 'line': body = chartSvgLine(chart, false); break;
    case 'areaLine': body = chartSvgLine(chart, true); break;
    case 'radar': body = chartSvgRadar(chart); break;
    default: body = '';
  }
  return '<div class="cd-chart-card__title">' + esc(chart.title) + '</div><div class="cd-chart-card__body">' + body + '</div>';
}

function renderChartWrapper(chart, index, containerId, tabId) {
  var cid = containerId || '';
  var tid = tabId || '';
  var selected = state.selectedChartId === chart.id;
  var html = '<div class="cd-chart-wrapper' + (selected ? ' selected' : '') + '" style="grid-column: span ' + getChartSpan(chart) + '"' +
    ' onclick="selectChart(\'' + chart.id + '\')"' +
    ' draggable="true"' +
    ' ondragstart="dragSortStart(event,\'' + cid + '\',\'' + tid + '\',' + index + ')"' +
    ' ondragover="dragOverSort(event)"' +
    ' ondrop="dropSortChart(event,\'' + cid + '\',\'' + tid + '\',' + index + ')">';
  if (selected) {
    html += '<button class="cd-chart-wrapper__delete" type="button" onclick="event.stopPropagation();deleteChart(\'' + chart.id + ')">×</button>';
  }
  html += renderChartContent(chart);
  html += '</div>';
  return html;
}

/* ═══════════════ 左栏 ═══════════════ */
function renderLeft() {
  var html = '<div class="cd-panel-header">图表类型</div>';

  // 容器列表
  html += '<div class="cd-container-list"><div class="cd-container-list__header"><span>容器列表</span>' +
    '<button class="btn sm" type="button" onclick="addContainer()">+ 添加容器</button></div>';
  state.containers.forEach(function(c) {
    html += '<div class="cd-container-item' + (state.selectedContainerId === c.id && !state.selectedChartId ? ' active' : '') + '" onclick="selectContainer(\'' + c.id + '\')">' +
      '<span class="cd-container-item__title">' + esc(c.title || '未命名') + '</span>' +
      '<span class="cd-container-item__count">' + getContainerChartCount(c) + ' 图</span>' +
      '<button class="cd-container-item__del" type="button" onclick="event.stopPropagation();deleteContainer(\'' + c.id + ')">×</button></div>';
  });
  html += '</div>';

  // 类型库
  var groupMap = {};
  var groupOrder = [];
  CHART_TYPE_META.forEach(function(m) {
    if (!groupMap[m.group]) { groupMap[m.group] = []; groupOrder.push(m.group); }
    groupMap[m.group].push(m);
  });
  html += '<div class="cd-type-list">';
  groupOrder.forEach(function(g) {
    html += '<div class="cd-type-group__title">' + g + '</div>';
    groupMap[g].forEach(function(meta) {
      html += '<div class="cd-type-card" draggable="true" ondragstart="dragStartType(event,\'' + meta.type + '\')" title="' + esc(meta.desc) + '">' +
        '<div class="cd-type-card__thumb">' + THUMBS[meta.type] + '</div>' +
        '<div class="cd-type-card__name">' + meta.name + '</div></div>';
    });
  });
  html += '</div>';
  document.getElementById('leftPanel').innerHTML = html;
}

/* ═══════════════ 中栏 ═══════════════ */
function renderCanvas() {
  var totalCharts = state.charts.length + state.containers.reduce(function(s, c) { return s + getContainerChartCount(c); }, 0);
  var el = document.getElementById('canvasBody');
  document.getElementById('exportBtn').disabled = state.charts.length === 0 && state.containers.length === 0;

  if (state.charts.length === 0 && state.containers.length === 0) {
    el.innerHTML = '<div class="cd-canvas-toolbar__count" style="position:absolute"></div><div class="cd-canvas-empty">' +
      '<div class="cd-canvas-empty__icon">📊</div>' +
      '<div class="cd-canvas-empty__text">拖拽左侧图表类型到此处，或点击「+ 添加容器」</div></div>';
    return;
  }

  var html = '<div style="margin-bottom:12px;font-size:12px;color:#737585">画布 · ' + totalCharts + ' 个图表 / ' + state.containers.length + ' 个容器</div>';

  // 顶层图表
  if (state.charts.length) {
    html += '<div class="cd-top-charts"><div class="cd-dashboard-grid">';
    state.charts.forEach(function(chart, i) { html += renderChartWrapper(chart, i, null, null); });
    html += '</div></div>';
  }

  // 容器
  state.containers.forEach(function(c) {
    html += '<div class="cd-container">';
    html += '<div class="cd-container__header" onclick="selectContainer(\'' + c.id + '\')">' +
      '<span class="cd-container__title">' + esc(c.title) + '</span>' +
      '<button class="cd-container__toggle" type="button" onclick="event.stopPropagation();toggleCollapse(\'' + c.id + ')">' + (c.collapsed ? '▸' : '▾') + '</button></div>';
    if (!c.collapsed) {
      if (c.layout === 'tabs' && (c.tabs || []).length) {
        html += '<div class="cd-container__tabs">';
        (c.tabs || []).forEach(function(t) {
          html += '<div class="cd-container__tab' + (c.activeTabId === t.id ? ' active' : '') + '" onclick="selectTab(\'' + c.id + '\',\'' + t.id + '\')">' + esc(t.title) + '</div>';
        });
        html += '</div>';
      }
      var activeTabId = c.layout === 'tabs' ? (c.activeTabId || '') : '';
      html += '<div class="cd-container__body"' +
        ' ondragover="containerDragOver(event)"' +
        ' ondrop="dropTypeOnContainer(event,\'' + c.id + '\',\'' + activeTabId + '\')">';
      var charts = getActiveCharts(c);
      if (!charts.length) {
        var emptyText = c.layout === 'tabs' && !(c.tabs || []).length ? '请在右栏添加页签后拖入图表' : '拖拽左侧图表类型到此处';
        html += '<div class="cd-container__empty">' + emptyText + '</div>';
      } else {
        html += '<div class="cd-dashboard-grid">';
        charts.forEach(function(chart, i) { html += renderChartWrapper(chart, i, c.id, activeTabId); });
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  });

  el.innerHTML = html;
}

/* ═══════════════ 右栏 ═══════════════ */
function findSelectedTarget() {
  if (state.selectedChartId) {
    var topChart = null;
    state.charts.forEach(function(ch) { if (ch.id === state.selectedChartId) topChart = ch; });
    if (topChart) return { kind: 'chart', containerId: null, chart: topChart };
    for (var ci = 0; ci < state.containers.length; ci++) {
      var c = state.containers[ci];
      if (c.layout === 'tabs') {
        for (var ti = 0; ti < (c.tabs || []).length; ti++) {
          var t = c.tabs[ti];
          var found = null;
          (t.charts || []).forEach(function(ch) { if (ch.id === state.selectedChartId) found = ch; });
          if (found) return { kind: 'chart', containerId: c.id, tabId: t.id, chart: found };
        }
      } else {
        var found2 = null;
        (c.charts || []).forEach(function(ch) { if (ch.id === state.selectedChartId) found2 = ch; });
        if (found2) return { kind: 'chart', containerId: c.id, chart: found2 };
      }
    }
  }
  if (state.selectedContainerId) {
    var container = null;
    state.containers.forEach(function(c) { if (c.id === state.selectedContainerId) container = c; });
    if (container) return { kind: 'container', container: container };
  }
  return null;
}

function fieldHtml(label, control) {
  return '<div class="cd-field"><label class="cd-field__label">' + label + '</label>' + control + '</div>';
}
function inputHtml(value, placeholder, onchange) {
  return '<input type="text" value="' + esc(value) + '" placeholder="' + esc(placeholder || '') + '" onchange="' + onchange + '"/>';
}
function selectHtml(options, value, onchange) {
  var html = '<select onchange="' + onchange + '">';
  options.forEach(function(o) {
    var v = typeof o === 'string' ? o : o.value;
    var l = typeof o === 'string' ? o : o.label;
    html += '<option value="' + esc(v) + '"' + (v === value ? ' selected' : '') + '>' + esc(l) + '</option>';
  });
  return html + '</select>';
}
function switchRow(label, isOn, onchange) {
  return '<div class="cd-switch-row"><span class="cd-switch-row__label">' + label + '</span>' +
    '<span class="cd-switch' + (isOn ? ' is-on' : '') + '" onclick="' + onchange + '"></span></div>';
}

function renderRight() {
  var target = findSelectedTarget();
  var el = document.getElementById('rightPanel');

  if (!target) {
    el.innerHTML = '<div class="cd-panel-header">属性</div><div class="cd-right-empty">' +
      '<div class="cd-right-empty__icon">⚙️</div><div class="cd-right-empty__text">选中容器或图表以编辑属性</div></div>';

  }

  if (target.kind === 'container') {

    var html = '<div class="cd-panel-header">容器属性</div><div class="cd-property-body">';

    // 基础
    html += '<div class="cd-field-group"><div class="cd-field-group__header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'\':\'none\'"><span>基础</span><span class="cd-field-group__arrow">▾</span></div>';
    html += '<div class="cd-field-group__body">';
    html += fieldHtml('标题', inputHtml(c.title, '', 'updateContainerField(\'' + c.id + '\',\'title\',this.value)'));
    html += switchRow('多页签布局', c.layout === 'tabs', 'toggleTabLayout(\'' + c.id + '\',' + (c.layout === 'tabs' ? 'false' : 'true') + ')');
    html += '</div></div>';

    // 页签管理
    if (c.layout === 'tabs') {
      html += '<div class="cd-field-group"><div class="cd-field-group__header"><span>页签管理</span><span class="cd-field-group__arrow">▾</span></div><div class="cd-field-group__body">';
      (c.tabs || []).forEach(function(t) {
        html += '<div class="cd-filter-item"><div class="cd-filter-item__row">' +
          '<input type="text" value="' + esc(t.title) + '" placeholder="页签名" onchange="updateTab(\'' + c.id + '\',\'' + t.id + '\',\'title\',this.value)"/>' +
          '<button class="cd-icon-btn" type="button" onclick="deleteTab(\'' + c.id + '\',\'' + t.id + '\')">×</button></div></div>';
      });
      html += '<button class="btn sm" type="button" onclick="addTab(\'' + c.id + '\')">+ 添加页签</button>';
      html += '</div></div>';
    }

    // 筛选配置
    html += '<div class="cd-field-group"><div class="cd-field-group__header"><span>筛选配置</span><span class="cd-field-group__arrow">▾</span></div><div class="cd-field-group__body">';
    html += switchRow('是否筛选', c.enableFilter, 'updateContainerField(\'' + c.id + '\',\'enableFilter\',' + (!c.enableFilter) + ')');
    if (c.enableFilter) {
      html += '<div class="cd-series-editor__header"><span>筛选字段</span><button class="btn sm" type="button" onclick="addContainerFilter(\'' + c.id + '\')">+ 添加筛选</button></div>';
      (c.filters || []).forEach(function(flt) {
        html += '<div class="cd-filter-item"><div class="cd-filter-item__row">' +
          '<input type="text" value="' + esc(flt.field) + '" placeholder="字段名（如：学院）" onchange="updateContainerFilter(\'' + c.id + '\',\'' + flt.id + '\',\'field\',this.value)"/>' +
          '<button class="cd-icon-btn" type="button" onclick="removeContainerFilter(\'' + c.id + '\',\'' + flt.id + '\')">×</button></div>' +
          '<div class="cd-field-row2">' +
          fieldHtml('类型', selectHtml(FILTER_TYPE_OPTIONS, flt.type, 'updateContainerFilter(\'' + c.id + '\',\'' + flt.id + '\',\'type\',this.value)')) +
          (flt.type === 'time' ? fieldHtml('粒度', selectHtml(FILTER_TIME_GRAINS, flt.timeGrain || '按年', 'updateContainerFilter(\'' + c.id + '\',\'' + flt.id + '\',\'timeGrain\',this.value)')) : '') +
          '</div></div>';
      });
    }
    html += '</div></div>';

    html += '<div class="cd-type-badge">容器 · ' + getContainerChartCount(c) + ' 个图表</div>';
    html += '</div>';
    el.innerHTML = html;
    return;
  }

  // 图表属性
  var chart = target.chart;
  var cid = target.containerId || '';
  var tid = target.tabId || '';
  var html = '<div class="cd-panel-header"><span>图表属性</span>' +
    '<button class="cd-icon-btn" type="button" onclick="deleteChart(\'' + chart.id + '\')">×</button></div>';

  if (chart.type !== 'profileCard') {
    html += '<div class="cd-tabs-bar">' +
      '<button class="cd-tabs-bar__tab' + (state.propTab === 'style' ? ' active' : '') + '" type="button" onclick="setPropTab(\'style\')">图形属性</button>' +
      '<button class="cd-tabs-bar__tab' + (state.propTab === 'data' ? ' active' : '') + '" type="button" onclick="setPropTab(\'data\')">数据设置</button></div>';
  }

  html += '<div class="cd-property-body">';

  if (state.propTab === 'style') {
    html += '<div class="cd-field-group"><div class="cd-field-group__header"><span>基础属性</span><span class="cd-field-group__arrow">▾</span></div><div class="cd-field-group__body">';
    html += fieldHtml('标题', inputHtml(chart.title, '', 'updateChartProp(\'title\',this.value)'));
    html += fieldHtml('图表类型', selectHtml(CHART_TYPE_META.map(function(t) { return { label: t.name, value: t.type }; }), chart.type, 'changeChartType(this.value)'));

    // 统计卡片
    if (chart.type === 'basicInfo') {

      html += '<div class="cd-field-group"><div class="cd-field-group__header"><span>统计卡片</span><span class="cd-field-group__arrow">▾</span></div><div class="cd-field-group__body">';

      html += '</div></div>';

    // 通用数据配置

        html += fieldHtml('数据（JSON）', '<textarea rows="6" onchange="setDataJson(this.value)">' + esc(JSON.stringify(chart.data || [], null, 2)) + '</textarea>' +

      html += fieldHtml('数据统计 SQL', '<textarea rows="6" placeholder="SELECT stat_label AS label, stat_value AS value&#10;FROM kpi_summary&#10;WHERE kpi_code = :code" onchange="updateChartProp(\'statsSql\',this.value)">' + esc(chart.statsSql || '') + '</textarea><div class="cd-field-hint">取数值统计区（总数、达标率等），列：label, value</div>');
      html += '</div></div>';
      html += '<div class="cd-field-group"><div class="cd-field-group__header"><span>分段统计来源</span><span class="cd-field-group__arrow">▾</span></div><div class="cd-field-group__body">';

    } else if (chart.type === 'basicInfo') {
      html += '<div class="cd-field-group"><div class="cd-field-group__header"><span>数据来源</span><span class="cd-field-group__arrow">▾</span></div><div class="cd-field-group__body">';
      html += fieldHtml('SQL 数据来源（可选）', '<textarea rows="6" placeholder="SELECT label, value, unit, compare&#10;FROM kpi&#10;WHERE kpi_code = :code" onchange="updateChartProp(\'sql\',this.value)">' + esc(chart.sql || '') + '</textarea><div class="cd-field-hint">留空则使用图形属性中的静态值；填写则运行时覆盖</div>');
      html += '</div></div>';
    } else {
      html += '<div class="cd-field-group"><div class="cd-field-group__header"><span>数据来源</span><span class="cd-field-group__arrow">▾</span></div><div class="cd-field-group__body">';
      html += fieldHtml('SQL 数据来源', '<textarea rows="8" placeholder="SELECT year, series_name, value&#10;FROM chart_data&#10;WHERE chart_id = :id&#10;ORDER BY year" onchange="updateChartProp(\'sql\',this.value)">' + esc(chart.sql || '') + '</textarea><div class="cd-field-hint">运行时由后端执行，图表预览使用示例数据</div>');
      html += '</div></div>';
    }

    // 交互配置
    html += '<div class="cd-field-group"><div class="cd-field-group__header"><span>交互配置</span><span class="cd-field-group__arrow">▾</span></div><div class="cd-field-group__body">';
    html += switchRow('是否筛选', chart.enableFilter, 'updateChartProp(\'enableFilter\',' + (!chart.enableFilter) + ')');
    if (chart.enableFilter) {
      html += '<div class="cd-series-editor__header"><span>筛选字段</span><button class="btn sm" type="button" onclick="addChartFilter()">+ 添加筛选</button></div>';
      (chart.filters || []).forEach(function(flt) {
        html += '<div class="cd-filter-item"><div class="cd-filter-item__row">' +
          '<input type="text" value="' + esc(flt.field) + '" placeholder="字段名（如：学院）" onchange="updateChartFilter(\'' + flt.id + '\',\'field\',this.value)"/>' +
          '<button class="cd-icon-btn" type="button" onclick="removeChartFilter(\'' + flt.id + '\')">×</button></div>' +
          '<div class="cd-field-row2">' +
          fieldHtml('类型', selectHtml(FILTER_TYPE_OPTIONS, flt.type, 'updateChartFilter(\'' + flt.id + '\',\'type\',this.value)')) +
          (flt.type === 'time' ? fieldHtml('粒度', selectHtml(FILTER_TIME_GRAINS, flt.timeGrain || '按年', 'updateChartFilter(\'' + flt.id + '\',\'timeGrain\',this.value)')) : '') +
          '</div></div>';
      });
    }
    html += switchRow('是否下钻', chart.enableDrilldown, 'updateChartProp(\'enableDrilldown\',' + (!chart.enableDrilldown) + ')');
    if (chart.enableDrilldown) {
      html += fieldHtml('下钻URL', inputHtml(chart.drilldownUrl, 'https://...', 'updateChartProp(\'drilldownUrl\',this.value)'));
    }
    html += '</div></div>';

    var metaName2 = '';
    CHART_TYPE_META.forEach(function(t) { if (t.type === chart.type) metaName2 = t.name; });
    html += '<div class="cd-type-badge">' + metaName2 + ' · ' + chart.type + '</div>';
  }

  html += '</div>';
  el.innerHTML = html;
}

/* ═══════════════ 容器操作 ═══════════════ */
function addContainer() {
  var c = createDefaultContainer();
  state.containers.push(c);
  state.selectedContainerId = c.id;
  state.selectedChartId = null;
  notify('已添加容器');
  render();
}

function deleteContainer(id) {
  state.containers = state.containers.filter(function(c) { return c.id !== id; });
  if (state.selectedContainerId === id) { state.selectedContainerId = null; state.selectedChartId = null; }
  notify('已删除容器');
  render();
}

function selectContainer(id) {
  state.selectedContainerId = id;
  state.selectedChartId = null;
  state.dataError = '';
  render();
}

function selectChart(id) {
  state.selectedChartId = id;
  state.dataError = '';
  render();
}

function selectNone() {
  state.selectedContainerId = null;
  state.selectedChartId = null;
  render();
}

function updateContainerField(id, field, value) {
  state.containers.forEach(function(c) { if (c.id === id) c[field] = value; });
  render();
}

function addContainerFilter(containerId) {
  state.containers.forEach(function(c) {
    if (c.id === containerId) c.filters = (c.filters || []).concat([{ id: genId('cf'), field: '', type: 'select', timeGrain: '按年' }]);
  });
  render();
}

function removeContainerFilter(containerId, filterId) {
  state.containers.forEach(function(c) {
    if (c.id === containerId) c.filters = (c.filters || []).filter(function(f) { return f.id !== filterId; });
  });
  render();
}

function updateContainerFilter(containerId, filterId, field, value) {
  state.containers.forEach(function(c) {
    if (c.id !== containerId) return;
    (c.filters || []).forEach(function(f) { if (f.id === filterId) f[field] = value; });
  });
  render();
}

function toggleCollapse(id) {
  state.containers.forEach(function(c) { if (c.id === id) c.collapsed = !c.collapsed; });
  render();
}

function toggleTabLayout(containerId, enabled) {
  state.containers.forEach(function(c) {
    if (c.id !== containerId) return;
    if (enabled) {
      var t1 = { id: genId('tab'), title: '页签1', charts: c.charts || [] };
      var t2 = { id: genId('tab'), title: '页签2', charts: [] };
      c.layout = 'tabs'; c.tabs = [t1, t2]; c.activeTabId = t1.id; c.charts = [];
    } else {
      var merged = [];
      (c.tabs || []).forEach(function(t) { merged = merged.concat(t.charts || []); });
      c.layout = 'single'; c.tabs = []; c.activeTabId = null; c.charts = merged;
    }
  });
  notify(enabled ? '已切换为多页签布局' : '已合并为单页布局');
  render();
}

function addTab(containerId) {
  state.containers.forEach(function(c) {
    if (c.id !== containerId) return;
    var tab = { id: genId('tab'), title: '页签', charts: [] };
    c.tabs = (c.tabs || []).concat([tab]);
    c.activeTabId = tab.id;
  });
  render();
}

function updateTab(containerId, tabId, field, value) {
  state.containers.forEach(function(c) {
    if (c.id !== containerId) return;
    (c.tabs || []).forEach(function(t) { if (t.id === tabId) t[field] = value; });
  });
  render();
}

function deleteTab(containerId, tabId) {
  state.containers.forEach(function(c) {
    if (c.id !== containerId) return;
    var idx = -1;
    (c.tabs || []).forEach(function(t, i) { if (t.id === tabId) idx = i; });
    c.tabs = (c.tabs || []).filter(function(t) { return t.id !== tabId; });
    if (c.activeTabId === tabId) {
      if (c.tabs.length) c.activeTabId = c.tabs[Math.min(idx, c.tabs.length - 1)].id;
      else c.activeTabId = null;
    }
  });
  render();
}

function selectTab(containerId, tabId) {
  state.containers.forEach(function(c) { if (c.id === containerId) c.activeTabId = tabId; });
  render();
}

/* ═══════════════ 图表操作 ═══════════════ */
function mapCharts(containerId, tabId, transform) {
  state.containers.forEach(function(c) {
    if (c.id !== containerId) return;
    if (c.layout === 'tabs') {
      (c.tabs || []).forEach(function(t) { if (t.id === tabId) t.charts = transform(t.charts || []); });
    } else {
      c.charts = transform(c.charts || []);
    }
  });
}

function addChart(containerId, type, tabId) {
  var chart = createDefaultChart(type);
  if (containerId) {
    mapCharts(containerId, tabId, function(list) { return list.concat([chart]); });
  } else {
    state.charts.push(chart);
  }
  state.selectedChartId = chart.id;
  var name = type;
  CHART_TYPE_META.forEach(function(t) { if (t.type === type) name = t.name; });
  notify('已添加 ' + name);
  render();
}

function currentTargetInfo() {
  var target = findSelectedTarget();
  if (!target || target.kind !== 'chart') return null;
  return { containerId: target.containerId || null, tabId: target.tabId || null, chart: target.chart };
}

function updateChartPropHelper(field, value) {
  var info = currentTargetInfo();
  if (!info) return;
  if (info.containerId) {
    mapCharts(info.containerId, info.tabId, function(list) {
      return list.map(function(ch) { if (ch.id === info.chart.id) ch[field] = value; return ch; });
    });
  } else {
    state.charts = state.charts.map(function(ch) { if (ch.id === info.chart.id) ch[field] = value; return ch; });
  }
}

function updateChartProp(field, value) {
  updateChartPropHelper(field, value);
  render();
}

function updateStat(field, value) {
  var info = currentTargetInfo();
  if (!info) return;
  if (!info.chart.stat) info.chart.stat = {};
  info.chart.stat[field] = value;
  render();
}

function addSegment() {
  var info = currentTargetInfo();
  if (!info) return;
  info.chart.segments = (info.chart.segments || []).concat([{ label: '新分段', value: 0, status: 'good' }]);
  render();
}

function updateSegment(idx, field, value) {
  var info = currentTargetInfo();
  if (!info) return;
  if (info.chart.segments && info.chart.segments[idx]) info.chart.segments[idx][field] = value;
  render();
}

function removeSegment(idx) {
  var info = currentTargetInfo();
  if (!info) return;
  info.chart.segments = (info.chart.segments || []).filter(function(_, i) { return i !== idx; });
  render();
}

function setProgress(val) {
  var v = Math.max(0, Math.min(100, Number(val) || 0));
  updateChartPropHelper('data', [{ value: v }]);
  render();
}

function setXAxis(val) {
  updateChartPropHelper('xAxisData', val.split(/[,，]/).map(function(s) { return s.trim(); }).filter(Boolean));
  render();
}

function setIndicators(val) {
  var info = currentTargetInfo();
  if (!info) return;
  var names = val.split(/[,，]/).map(function(s) { return s.trim(); }).filter(Boolean);
  var oldMap = {};
  (info.chart.indicators || []).forEach(function(i) { oldMap[i.name] = i.max; });
  info.chart.indicators = names.map(function(name) { return { name: name, max: oldMap[name] !== undefined ? oldMap[name] : 100 }; });
  // 维度数量变化时同步系列 values 长度
  (info.chart.data || []).forEach(function(s) {
    if (s.values) {
      while (s.values.length < names.length) s.values.push(0);
      s.values.length = names.length;
    }
  });
  render();
}

function setDataJson(jsonStr) {
  try {
    var parsed = JSON.parse(jsonStr);
    updateChartPropHelper('data', parsed);
    state.dataError = '';
  } catch (e) {
    state.dataError = 'JSON 格式有误';
  }
  render();
}

function changeChartType(newType) {
  var info = currentTargetInfo();
  if (!info) return;
  var next = createDefaultChart(newType);
  next.id = info.chart.id;
  next.title = info.chart.title;
  next.sql = info.chart.sql || '';
  next.filters = info.chart.filters || [];
  if (info.containerId) {
    mapCharts(info.containerId, info.tabId, function(list) {
      return list.map(function(ch) { return ch.id === info.chart.id ? next : ch; });
    });
  } else {
    state.charts = state.charts.map(function(ch) { return ch.id === info.chart.id ? next : ch; });
  }
  state.dataError = '';
  render();
}

function resizeBySize(size) {
  var info = currentTargetInfo();
  if (!info) return;
  info.chart.size = size;
  info.chart.span = SIZE_SPAN[size] || 3;
  render();
}

function deleteChart(chartId) {
  state.containers.forEach(function(c) {
    if (c.layout === 'tabs') {
      (c.tabs || []).forEach(function(t) { t.charts = (t.charts || []).filter(function(ch) { return ch.id !== chartId; }); });
    } else {
      c.charts = (c.charts || []).filter(function(ch) { return ch.id !== chartId; });
    }
  });
  state.charts = state.charts.filter(function(ch) { return ch.id !== chartId; });
  if (state.selectedChartId === chartId) state.selectedChartId = null;
  notify('已删除图表');
  render();
}

function setPropTab(tab) {
  state.propTab = tab;
  state.dataError = '';
  render();
}

/* 图表筛选（数据设置 tab） */
function addChartFilter() {
  var info = currentTargetInfo();
  if (!info) return;
  info.chart.filters = (info.chart.filters || []).concat([{ id: genId('flt'), field: '', type: 'select', timeGrain: '按年' }]);
  render();
}
function updateChartFilter(filterId, field, value) {
  var info = currentTargetInfo();
  if (!info) return;
  (info.chart.filters || []).forEach(function(f) { if (f.id === filterId) f[field] = value; });
  render();
}
function removeChartFilter(filterId) {
  var info = currentTargetInfo();
  if (!info) return;
  info.chart.filters = (info.chart.filters || []).filter(function(f) { return f.id !== filterId; });
  render();
}

/* ═══════════════ 拖拽 ═══════════════ */
function dragStartType(e, type) {
  state.dragType = type;
  e.dataTransfer.setData('text/chart-type', type);
  e.dataTransfer.effectAllowed = 'copy';
}

function hasSortDrag(e) {
  var types = e.dataTransfer.types || [];
  for (var i = 0; i < types.length; i++) if (types[i] === 'text/sort') return true;
  return false;
}

function canvasDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
}

function dropTypeOnCanvas(e) {
  e.preventDefault();
  if (hasSortDrag(e)) return;
  var type = e.dataTransfer.getData('text/chart-type') || state.dragType;
  state.dragType = null;
  if (!type) return;
  addChart(null, type);
}

function containerDragOver(e) {
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'copy';
}

function dropTypeOnContainer(e, containerId, tabId) {
  e.preventDefault();
  e.stopPropagation();
  if (hasSortDrag(e)) return;
  var type = e.dataTransfer.getData('text/chart-type') || state.dragType;
  state.dragType = null;
  if (!type) return;
  // tabs 布局无激活页签时不可放
  var container = null;
  state.containers.forEach(function(c) { if (c.id === containerId) container = c; });
  if (container && container.layout === 'tabs' && !tabId) return;
  addChart(containerId, type, tabId || null);
}

function dragSortStart(e, containerId, tabId, index) {
  e.dataTransfer.setData('text/sort', JSON.stringify({ containerId: containerId || null, tabId: tabId || null, index: index }));
  e.dataTransfer.effectAllowed = 'move';
}

function dragOverSort(e) {
  if (!hasSortDrag(e)) return;
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'move';
}

function getChartsOf(c, tabId) {
  if (c.layout === 'tabs') {
    var out = [];
    (c.tabs || []).forEach(function(t) { if (t.id === tabId) out = t.charts || []; });
    return out;
  }
  return c.charts || [];
}
function setChartsOf(c, tabId, next) {
  if (c.layout === 'tabs') {
    (c.tabs || []).forEach(function(t) { if (t.id === tabId) t.charts = next; });
  } else {
    c.charts = next;
  }
}

function dropSortChart(e, containerId, tabId, index) {
  e.preventDefault();
  e.stopPropagation();
  var data = e.dataTransfer.getData('text/sort');
  if (!data) return;
  var from;
  try { from = JSON.parse(data); } catch (err) { return; }
  var to = { containerId: containerId || null, tabId: tabId || null, index: index };
  handleSortChart(from, to);
}

function handleSortChart(from, to) {
  if (from.containerId === to.containerId && from.tabId === to.tabId && from.index === to.index) return;

  function findContainer(id) {
    var out = null;
    state.containers.forEach(function(c) { if (c.id === id) out = c; });
    return out;
  }

  // 顶层之间
  if (from.containerId === null && to.containerId === null) {
    var next = state.charts.slice();
    var moved = next.splice(from.index, 1)[0];
    next.splice(to.index, 0, moved);
    state.charts = next;
  }
  // 顶层 → 容器
  else if (from.containerId === null && to.containerId) {
    var chart = state.charts.splice(from.index, 1)[0];
    var tc = findContainer(to.containerId);
    if (chart && tc) {
      var list = getChartsOf(tc, to.tabId);
      setChartsOf(tc, to.tabId, list.concat([chart]));
    }
  }
  // 容器 → 顶层
  else if (from.containerId && to.containerId === null) {
    var fc = findContainer(from.containerId);
    if (fc) {
      var src = getChartsOf(fc, from.tabId).slice();
      picked = src.splice(from.index, 1)[0];
      setChartsOf(fc, from.tabId, src);
      if (picked) state.charts.splice(to.index, 0, picked);
    }
  }
  // 容器之间
  else if (from.containerId !== to.containerId) {
    var fc2 = findContainer(from.containerId);
    var tc2 = findContainer(to.containerId);
    if (fc2 && tc2) {
      var srcList = getChartsOf(fc2, from.tabId).slice();
      var mv = srcList.splice(from.index, 1)[0];
      setChartsOf(fc2, from.tabId, srcList);
      var toList = getChartsOf(tc2, to.tabId).slice();
      toList.splice(to.index, 0, mv);
      setChartsOf(tc2, to.tabId, toList);
    }
  }
  // 同容器内排序
  else {
    if (from.tabId !== to.tabId) return;
    var c3 = findContainer(from.containerId);
    if (c3) {
      var arr = getChartsOf(c3, from.tabId).slice();
      var m = arr.splice(from.index, 1)[0];
      arr.splice(to.index, 0, m);
      setChartsOf(c3, from.tabId, arr);
    }
  }

  render();
}

/* ═══════════════ 导出 ═══════════════ */
function getExportData() {
  return { version: 4, charts: state.charts, containers: state.containers };
}

function openExport() {
  document.getElementById('exportCode').textContent = JSON.stringify(getExportData(), null, 2);
  document.getElementById('exportModal').classList.add('is-open');
}

function closeExport() {
  document.getElementById('exportModal').classList.remove('is-open');
}

function copyJson() {
  var text = JSON.stringify(getExportData(), null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text);
  }
  notify('已复制');
}

function downloadJson() {
  var blob = new Blob([JSON.stringify(getExportData(), null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'chart-dashboard-config.json';
  a.click();
  URL.revokeObjectURL(url);
  notify('已下载');
}

/* ═══════════════ 渲染入口 ═══════════════ */
function render() {
  renderLeft();
  renderCanvas();
  renderRight();
}

render();
</script>
