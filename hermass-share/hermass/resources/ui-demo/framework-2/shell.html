<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>框架2 - 纯框架</title>
  <link rel="stylesheet" href="../packages/design-system/src/base.css" />
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" href="../packages/design-system/src/AppShellV2/app-shell-v2.css" />
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
<div class="frame2-stage ds-scope"></div>

<script src="../assets/icon-registry.js"></script>
<script src="../packages/design-system/src/AppShellV2/app-shell-v2.js"></script>
<script>
  const appMenus = {
    home: [
      { key: 'workspace', label: '工作台', icon: 'home', children: [
        { key: 'home-overview', label: '首页概览' },
        { key: 'todo-center', label: '待办中心' },

        { key: 'ai-knowledge', label: '知识库' }

        { key: 'custom-report', label: '自定义报表' }

    versionLabel: '框架2',
    frameworkAssetBase: './assets',
    activeApp: 'staff',

      { key: 'stats', label: '数据统计' }

    secondaryNav: {
      items: appMenus.staff

      { key: 'department', label: '部门维护' }
