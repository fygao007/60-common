ontology: szpu-hr
version: 0.4.0
domain: staff-data
title: 人员数据敏感字段治理规则
description: >-
  本分区数据为学校真实教职工数据，包含身份证号、银行卡号、社保号等高敏信息。
  本文件定义字段分级、使用约束和脱敏规则，是数据对外提供前的强制门禁。

# ============================================================
# 一、分级定义（沿用 governance/data-classification.yaml）
# ============================================================
levels:
  - id: restricted
    label: 受限级
    definition: 一旦泄露将直接侵害个人权益或造成财产损失，禁止进入任何检索、日志、导出和分析场景
    constraints:
      - 禁止进入通用全文索引和向量索引
      - 禁止出现在接口响应的默认字段中，必须显式申请
      - 禁止写入日志、埋点、错误堆栈
      - 禁止用于统计、分析和看板
      - 展示时必须脱敏或按字段级权限单独授权
      - 传输与存储必须加密

  - id: sensitive
    label: 敏感级
    definition: 个人身份与属性信息，可用于业务判断，但不得扩散
    constraints:
      - 可用于精确匹配查询，但不得进入全文检索
      - 统计场景仅允许输出聚合值，禁止输出明细
      - 展示遵循最小必要原则
      - 政治面貌、宗教信仰等涉及个人倾向的字段需按授权访问

  - id: internal
    label: 内部级
    definition: 业务属性信息，系统内部可正常使用
    constraints:
      - 可正常查询、统计、展示
      - 对外共享前需评估

# ============================================================
# 二、本分区受限级字段清单（17 个）
# ============================================================
restrictedFields:
  - field: 证件号码
    recordCount: 4497
    masking: "保留前 6 位和后 2 位，中间以 * 填充"
    note: 主标识符，与 PersonIdentity.documentNumber 对应
  - field: 银行卡号
    recordCount: 3183
    masking: "仅保留后 4 位"
  - field: 银行卡开户行
    recordCount: 0
    note: 当前无数据，将来启用时按受限级处理
  - field: 银行名称
    recordCount: 3183
    masking: 无需单独脱敏，但与卡号组合可定位个人
  - field: 社保电脑号
    recordCount: 3359
    masking: "保留后 4 位"
  - field: 公积金账号
    recordCount: 3014
    masking: "保留后 4 位"
  - field: 护照编码
    recordCount: 0
    note: 外籍人员字段，当前无数据
  - field: 工作许可证号
    recordCount: 0
  - field: 薪酬（万元）
    recordCount: 20
    masking: 禁止原值输出，仅允许区间或聚合值
  - field: 薪酬变化时间
    recordCount: 0
  - field: 绩效比例
    recordCount: 20
  - field: 身份证详细地址
    recordCount: 0
  - field: 现居住地址
    recordCount: 35
    masking: "保留至区县，门牌号脱敏"
  - field: 紧急联系人
    recordCount: 33
  - field: 紧急联系电话
    recordCount: 34
    masking: "保留前 3 位和后 2 位"
  - field: 户籍所在地区号
    recordCount: 0
  - field: 医疗缴费档次
    recordCount: 0

# ============================================================
# 三、敏感级字段分组（35 个）
# ============================================================
sensitiveGroups:
  - group: 身份标识
    fields: [姓名, 姓名全拼, 曾用名, 证件类型, 年龄, 出生日期]
    note: 姓名用于业务识别，但批量导出需审批
  - group: 联系方式
    fields: [手机号, 办公电话, 个人邮箱, 学校邮箱]
    note: 通知类场景可用，禁止进入检索索引
  - group: 个人属性
    fields: [民族, 籍贯, 出生地, 户口所在地, 宗教信仰, 婚姻状况, 子女情况, 港澳台侨, 国籍地区]
    note: 涉及个人身份特征，统计时仅输出聚合值
  - group: 政治信息
    fields: [政治面貌, 参加党派日期, 第二党派, 第二党派日期, 转正日期, 当前所在组织, 现担任组织职务]
    note: 需按组织部门授权访问，不得与业绩考核数据自动关联
  - group: 家庭关系
    table: 家庭成员及社会关系
    fields: [家属姓名, 与本人的关系, 籍贯, 出生年月, 政治面貌, 工作单位, 职务, 联系电话, 是否本校职工]
    classification: restricted
    recordCount: 2606
    note: 整表按受限级管理，涉及第三方个人信息，需最高级别授权
  - group: 用工与合同
    fields: [合同开始日期, 合同结束日期, 试用期截止日期, 见习期截止日期, 档案号, 户口类别]
  - group: 考核结果
    tables: [学年（年度）考核, 师德考核, 聘期考核]
    note: 考核结论属个人评价信息，仅本人、直接主管和授权人事岗位可查

# ============================================================
# 四、脱敏规则
# ============================================================
maskingRules:
  - id: id-card
    appliesTo: 证件号码
    pattern: "\\d{6}\\d{8}\\w{4}"
    replacement: "前6位 + ******** + 后2位"
    example: "110101********1X"
  - id: phone
    appliesTo: [手机号, 紧急联系电话]
    replacement: "前3位 + **** + 后2位"
    example: "138****70"
  - id: bank-card
    appliesTo: [银行卡号, 社保电脑号, 公积金账号]
    replacement: "仅后4位可见"
  - id: name
    appliesTo: [姓名, 家属姓名]
    replacement: "保留姓，名以 * 替代"
    example: "张**"
    note: 仅用于日志和演示环境，业务查询不应脱敏姓名

# ============================================================
# 五、使用门禁
# ============================================================
usagePolicy:
  - id: U1
    rule: 本分区不存放原始明细数据，仅存放字段定义、映射关系和脱敏统计结果
    reason: 原始文件含 4497 条身份证号、3183 条银行卡号，不得进入代码仓库
    enforcement: 原始数据文件保持在 /Volumes/WD/下载/ 下，不复制进本目录

  - id: U2
    rule: 任何页面、接口、报表引用人员数据时，默认只暴露 internal 级字段
    reason: 最小必要原则
    enforcement: 字段级权限校验，restricted 与 sensitive 需显式授权

  - id: U3
    rule: 统计类场景（人数、占比、分布）必须引用 statistics/ 下的聚合结果，不得查明细后自行计算
    reason: 既保证口径统一，也避免明细数据扩散

  - id: U4
    rule: 名单类展示（如人员列表）需按角色控制可见字段集
    mapping:
      普通教师: [姓名, 所在部门, 教职工类别]
      院系管理员: [姓名, 所在部门, 教职工类别, 职称, 最高学位, 联系方式]
      人事处: [内部级全部字段]
      系统管理员: [按申请临时授权，需留痕]

  - id: U5
    rule: 导出功能必须走审批，且导出文件加水印、限制份数
    reason: 批量明细导出是主要泄露渠道

  - id: U6
    rule: 演示、联调、测试环境禁止使用真实数据，必须使用脱敏后的构造数据
    reason: 防止真实个人信息流入非生产环境

# ============================================================
# 六、数据存放声明
# ============================================================
storageDeclaration:
  originalDataLocation: "/Volumes/WD/下载/深职大基础数据和扩展信息数据"
  copiedIntoRepository: false
  reason: 含大量个人信息，不得提交至代码仓库
  inRepositoryContent:
    - 字段字典（含分级与空值率，不含具体数据）
    - 实体映射关系
    - 脱敏后的聚合统计结果
    - 统计口径与治理规则
  regeneration: 源文件更新后重新运行生成脚本，产出新的统计文件
